name: H3 Hermes Registry Liveness Bind

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-registry-liveness-bind.yml'

permissions:
  contents: write

jobs:
  bind:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validated read-only liveness binder
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\afz-openai-agent\Bind-H3-Hermes-RegistryLiveness.ps1'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Commit binding and retire one-shot binder
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/h3-hermes-registry-liveness-bind.yml'
          git rm 'afz-openai-agent/Bind-H3-Hermes-RegistryLiveness.ps1'
          git add 'afz-openai-agent/Push-Deploy-Watcher.ps1' '.github/workflows/h3-hermes-agent-validate.yml'
          git commit -m 'Bind read-only H3 Hermes registry liveness audit'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
