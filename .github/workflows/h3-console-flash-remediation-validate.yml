name: H3 Console Flash Remediation Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Invoke-H3-ConsoleFlash-Remediation.ps1'
      - 'afz-openai-agent/Bootstrap-H3-GitHub-DirectReturnV3.ps1'
      - 'afz-openai-agent/Bootstrap-H3-GitHub-DirectReturnV4.ps1'
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - '.github/workflows/h3-console-flash-remediation-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse affected scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'afz-openai-agent\Invoke-H3-ConsoleFlash-Remediation.ps1',
            'afz-openai-agent\Bootstrap-H3-GitHub-DirectReturnV3.ps1',
            'afz-openai-agent\Bootstrap-H3-GitHub-DirectReturnV4.ps1',
            'afz-openai-agent\Sync-AFZ-AgentFromGitHub.ps1'
          )
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw "$file parse failure: $($errors.Message -join '; ')"}
          }

      - name: Verify recurring no-window safety contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fix=Get-Content 'afz-openai-agent\Invoke-H3-ConsoleFlash-Remediation.ps1' -Raw
          $v3=Get-Content 'afz-openai-agent\Bootstrap-H3-GitHub-DirectReturnV3.ps1' -Raw
          $v4=Get-Content 'afz-openai-agent\Bootstrap-H3-GitHub-DirectReturnV4.ps1' -Raw
          $sync=Get-Content 'afz-openai-agent\Sync-AFZ-AgentFromGitHub.ps1' -Raw

          foreach($needle in @(
            'AFZ H3 GitHub Direct Return Publisher',
            'AFZ H3 Ollama Cloud Telemetry Watchdog',
            'AFZ Ops 35B Watchdog',
            'Run-H3-GitHub-DirectReturn-Hidden.vbs',
            'Run-Ensure-H3-OllamaCloudTelemetry-Hidden.vbs',
            'Run-AFZ-Ops35B-H3-Watchdog-Hidden.vbs',
            'already-hidden-live-verified',
            'periodicConsoleRiskCount',
            'H3-CONSOLE-FLASH-AUDIT-LATEST.json',
            'Set-ScheduledTask -TaskName',
            'WScript.Quit rc'
          )){if(-not $fix.Contains($needle)){throw "Remediation invariant missing: $needle"}}
          if($fix.Contains('cached-completed')){throw 'Remediation still trusts a stale cached success marker.'}
          if($fix -match '(?i)pythonw|nssm|winsw|prefect'){throw 'Launcher remediation unexpectedly introduced a worker/service migration.'}
          if($fix -match '(?i)Disable-ScheduledTask|Unregister-ScheduledTask'){throw 'Remediation must not disable or unregister H3 tasks.'}

          if(-not $v3.Contains('Bootstrap-H3-GitHub-DirectReturnV4.ps1')){throw 'V3 compatibility path does not delegate to V4.'}
          if($v3 -match '(?i)Register-ScheduledTask|New-ScheduledTaskAction'){throw 'V3 can still directly recreate a Scheduled Task.'}

          foreach($needle in @("`$task='AFZ H3 GitHub Direct Return Publisher'",'System32\wscript.exe','LogonType Interactive','WScript.Quit rc')){
            if(-not $v4.Contains($needle)){throw "V4 invariant missing: $needle"}
          }
          if($v4 -match "New-ScheduledTaskAction -Execute 'powershell.exe'.*Publish-H3-GitHub-DirectReturn-V3"){
            throw 'V4 still directly registers the publisher under powershell.exe.'
          }

          if(-not $sync.Contains('Invoke-H3-ConsoleFlash-Remediation.ps1')){throw 'Source sync does not contain the remediation hook.'}
          if(-not $sync.Contains('h3ConsoleFlashRemediation')){throw 'Source sync does not return remediation state.'}
