name: H3 RadioHilal Hermes Cron Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/h3-radiohilal-hermes-cron-repair-signal.txt'

permissions:
  contents: write
  id-token: write

concurrency:
  group: h3-radiohilal-hermes-cron-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate one-shot signal
        shell: bash
        run: |
          set -euo pipefail
          signal='.github/h3-radiohilal-hermes-cron-repair-signal.txt'
          grep -Fx 'target=h3' "$signal"
          grep -Fx 'action=radiohilal-hermes-cron-rh1' "$signal"
          grep -Fx 'job=9d9eea1b7618' "$signal"
          grep -Eq '^nonce=[A-Za-z0-9._-]+$' "$signal"

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Ensure H3 is awake
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --accept-routes=true || true
          if nc -z -w 3 100.106.186.118 22; then
            echo 'H3_ALREADY_REACHABLE=YES'
            exit 0
          fi

          echo 'H3_WAKE_REQUEST=PI'
          curl --silent --show-error --fail-with-body --max-time 8 http://100.91.50.9:8087/wake/h3 || echo 'PI_WAKE_UNAVAILABLE=YES'

          echo 'H3_WAKE_REQUEST=DIRECT_WOL'
          python3 - <<'PY'
          import socket,time,json
          mac='4c:ed:fb:3f:b0:9e'
          m=bytes.fromhex(mac.replace(':',''))
          packet=b'\xff'*6+m*16
          targets=['192.168.50.255','255.255.255.255']
          ports=[9,7]
          sent=[]
          for target in targets:
              for port in ports:
                  for attempt in range(1,4):
                      s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
                      s.setsockopt(socket.SOL_SOCKET,socket.SO_BROADCAST,1)
                      try:
                          n=s.sendto(packet,(target,port))
                          sent.append({'target':target,'port':port,'attempt':attempt,'bytes':n})
                      except Exception as e:
                          sent.append({'target':target,'port':port,'attempt':attempt,'error':repr(e)})
                      finally:
                          s.close()
                      time.sleep(.15)
          print(json.dumps({'mac':mac,'packetBytes':len(packet),'attempts':sent},indent=2))
          PY

          echo 'H3_WAKE_REQUEST=WINDOWS_MAIN_RELAY'
          remote_script=$(cat <<'REMOTE'
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'DESKTOP-10SKF0M'){throw "WRONG_HOST $($env:COMPUTERNAME)"}
          $mac='4C-ED-FB-3F-B0-9E'
          $broadcast='192.168.50.255'
          $m=[byte[]](($mac -split '[:-]') | ForEach-Object {[Convert]::ToByte($_,16)})
          $packet=New-Object byte[] 102
          0..5 | ForEach-Object {$packet[$_]=0xFF}
          for($i=0;$i -lt 16;$i++){[Array]::Copy($m,0,$packet,6+($i*6),6)}
          $udp=New-Object Net.Sockets.UdpClient
          $udp.EnableBroadcast=$true
          foreach($port in @(9,7)){
            1..3 | ForEach-Object {
              [void]$udp.Send($packet,$packet.Length,$broadcast,$port)
              Start-Sleep -Milliseconds 150
            }
          }
          $udp.Close()
          Write-Output "WOL_SENT=TRUE MAC=$mac BROADCAST=$broadcast"
          REMOTE
          )
          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          timeout 40s tailscale ssh Faiz@100.70.25.8 "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded" || echo 'WINDOWS_MAIN_WOL_RELAY_UNAVAILABLE=YES'

          for attempt in $(seq 1 30); do
            echo "wake_attempt=$attempt"
            tailscale ping --timeout=3s -c 1 100.106.186.118 || true
            if nc -z -w 3 100.106.186.118 22; then
              echo 'H3_SSH_REACHABLE=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'H3_SSH_REACHABLE=FAIL' >&2
          exit 40

      - name: Run guarded H3 repair and record result
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/f3arif/homelab-control/${AFZ_SHA}/.github/scripts/h3-radiohilal-hermes-cron-rh1.ps1"
          remote="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"\$ProgressPreference='SilentlyContinue'; \$script=(Invoke-WebRequest -UseBasicParsing '$url').Content; Invoke-Expression \$script\""
          set +e
          result=$(timeout 600s tailscale ssh Faiz@100.106.186.118 "$remote" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$result"
          {
            printf 'workflowSha=%s\n' "$AFZ_SHA"
            printf 'exitCode=%s\n' "$rc"
            printf 'timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "$result"
          } > .github/h3-radiohilal-hermes-cron-repair-result.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add .github/h3-radiohilal-hermes-cron-repair-result.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record H3 RadioHilal Hermes cron repair result'
            git push origin HEAD:main
          fi
          exit "$rc"
