name: H3 PostBoot WOL Audit Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Invoke-H3-PostBoot-WolRootCauseAudit.ps1'
      - '.github/workflows/h3-postboot-wol-audit-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = 'afz-openai-agent/Invoke-H3-PostBoot-WolRootCauseAudit.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          'POWERSHELL_PARSE=PASS'
      - name: Verify read-only safety contract
        shell: powershell
        run: |
          $path = 'afz-openai-agent/Invoke-H3-PostBoot-WolRootCauseAudit.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          foreach ($needle in @(
            'MutationPolicy=READ_ONLY',
            'POWER_CHANGE=NONE',
            'RESULT=PASS_READONLY_H3_POSTBOOT_WOL_ROOTCAUSE_AUDIT',
            '4C-ED-FB-3F-B0-9E',
            'powercfg.exe /devicequery',
            'Get-NetAdapterPowerManagement',
            'Get-NetAdapterAdvancedProperty',
            'Get-WinEvent',
            'Get-ScheduledTask'
          )) {
            if (-not $text.Contains($needle)) { throw "Required audit invariant missing: $needle" }
          }
          foreach ($forbidden in @(
            'Set-NetAdapter',
            'Disable-NetAdapter',
            'Enable-NetAdapter',
            'Set-NetAdapterPowerManagement',
            'Register-ScheduledTask',
            'Set-ScheduledTask',
            'Unregister-ScheduledTask',
            'powercfg.exe /hibernate off',
            'powercfg.exe /hibernate on',
            'shutdown.exe',
            'Set-ItemProperty',
            'Remove-Item',
            'Stop-Process'
          )) {
            if ($text.Contains($forbidden)) { throw "Forbidden mutation primitive present: $forbidden" }
          }
          'READ_ONLY_CONTRACT=PASS'
