def afzNativeRoot = System.getProperty("afz.nuvio.buildOutputRoot")
if (!afzNativeRoot) throw new GradleException("Missing build output root")
gradle.beforeProject { project ->
    def component = project.path == ":" ? "root" : project.path.substring(1).replace(":", "/")
    project.layout.buildDirectory.set(new File(afzNativeRoot, component))
}
