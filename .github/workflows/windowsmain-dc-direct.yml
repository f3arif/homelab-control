name: Commander Alternate Account Pair

on:
  push:
    branches: [main]
    paths:
      - '.github/windowsmain-dc-direct-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: windowsmain-dc-direct
  cancel-in-progress: true

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy
          args: --accept-dns=false

      - name: Start fresh Commander pairing on Windows-main
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_script=$(cat <<'PS'
          $ErrorActionPreference='Stop'
          $expected='DESKTOP-10SKF0M'
          if($env:COMPUTERNAME -ne $expected){throw ('WRONG_HOST '+$env:COMPUTERNAME)}
          $npx=(Get-Command npx.cmd -ErrorAction Stop | Select-Object -First 1).Source
          $taskName='AFZ Desktop Commander Remote Pairing'
          $logDir=Join-Path $env:LOCALAPPDATA 'AFZ\DesktopCommander'
          $log=Join-Path $logDir 'remote-alt-account.log'
          $config=Join-Path $env:USERPROFILE '.desktop-commander-device\device.json'
          $resultRoot=Join-Path $env:USERPROFILE 'OneDrive - AFZ Engineering Inc\AFZ Shared\AFZ Control Hub\Commander'
          $resultFile=Join-Path $resultRoot 'PAIRING-WINDOWSMAIN-LATEST.json'
          New-Item -ItemType Directory -Force -Path $logDir,$resultRoot | Out-Null

          $existingTask=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if($existingTask -and [string]$existingTask.State -eq 'Running'){
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          }
          $existing=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            ([string]$_.CommandLine) -match '(?i)@wonderwhy-er/desktop-commander.*remote|desktop-commander.*remote'
          })
          foreach($p in $existing){try{Stop-Process -Id ([int]$p.ProcessId) -Force -ErrorAction SilentlyContinue}catch{}}
          Start-Sleep -Seconds 2

          $null=(& $npx --yes @wonderwhy-er/desktop-commander@latest remote --logout 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw ('COMMANDER_LOGOUT_EXIT='+$LASTEXITCODE)}
          if(Test-Path -LiteralPath $config -PathType Leaf){throw 'COMMANDER_LOCAL_CREDENTIALS_STILL_PRESENT'}
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue

          $user=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          $cmdArgs='/d /s /c ""'+$npx+'" --yes @wonderwhy-er/desktop-commander@latest remote >> "'+$log+'" 2>&1"'
          $action=New-ScheduledTaskAction -Execute 'cmd.exe' -Argument $cmdArgs
          $trigger=New-ScheduledTaskTrigger -AtLogOn -User $user
          $principal=New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
          $settings=New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 20 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName -ErrorAction Stop

          $deadline=(Get-Date).AddSeconds(90)
          $code=$null
          do{
            Start-Sleep -Seconds 2
            if(Test-Path -LiteralPath $log -PathType Leaf){
              $txt=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              if($txt){
                $m=[regex]::Match($txt,'(?im)^\s*([A-Z0-9]{4}-[A-Z0-9]{4})\s*$')
                if($m.Success){$code=$m.Groups[1].Value;break}
              }
            }
          }while((Get-Date) -lt $deadline)

          $task=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          $procs=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            ([string]$_.CommandLine) -match '(?i)@wonderwhy-er/desktop-commander.*remote|desktop-commander.*remote'
          })
          $result=[ordered]@{
            schema=1
            host=$env:COMPUTERNAME
            status=$(if($code){'AUTHORIZATION_REQUIRED'}else{'NO_DEVICE_CODE'})
            verifyUrl='https://mcp.desktopcommander.app/device/verify'
            deviceCode=$code
            codeExpiresMinutes=$(if($code){15}else{$null})
            localOldCredentialsRemoved=(-not(Test-Path -LiteralPath $config -PathType Leaf))
            taskName=$taskName
            taskState=$(if($task){[string]$task.State}else{'MISSING'})
            processCount=@($procs).Count
            generatedAt=(Get-Date -Format o)
          }
          [IO.File]::WriteAllText($resultFile,($result|ConvertTo-Json -Depth 6),(New-Object Text.UTF8Encoding($false)))
          Write-Output ('PAIR_RESULT_WRITTEN='+$resultFile)
          Write-Output ('PAIR_AUTH_REQUIRED='+[bool]$code)
          if(-not $code){exit 2}
          PS
          )
          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          timeout 180s tailscale ssh Faiz@100.70.25.8 "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"

      - name: Start fresh Commander pairing on H3
        shell: bash
        run: |
          set -euo pipefail
