name: AFZ Website Pi Deploy Validate

on:
  push:
    branches:
      - fix/afz-site-cutover-r3-carrier
      - stage/afz-site-cutover-r4
      - activate/afz-site-cutover-r4
      - fix/afz-site-cutover-r5-nativeargs
  pull_request:
    branches:
      - main
    paths:
      - 'afz-openai-agent/Deploy-AFZ-WebsiteToPi*.ps1'
      - 'afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1'
      - 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/requests/afz-site-deploy*.json'
      - '.github/workflows/afz-site-pi-deploy-r1-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1',
            'afz-openai-agent/Deploy-AFZ-WebsiteToPi-Core.ps1',
            'afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1',
            'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw "PowerShell parse failed: $file"}
            Write-Host "PARSE PASS $file"
          }

      - name: Validate R5 request and carrier safety contract
        shell: python
        run: |
          import json
          from pathlib import Path

          expected_base={
            'schema':1,
            'project':'afz-website',
            'action':'deploy-pi-static-site',
            'job_id':'afz-site-git-cutover-r5-20260828T1151',
            'source_repository':'f3arif/afz-engineering',
            'expected_sha':'c38576741ce2d379723fde038300363429845656'
          }
          staged=json.loads(Path('afz-openai-agent/requests/afz-site-deploy-next.json').read_text())
          active=json.loads(Path('afz-openai-agent/requests/afz-site-deploy.json').read_text())
          assert staged == {**expected_base,'status':'staged-not-active'}
          assert active == {**expected_base,'status':'active'}

          core=Path('afz-openai-agent/Deploy-AFZ-WebsiteToPi-Core.ps1').read_text()
          watcher=Path('afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1').read_text()
          updater=Path('afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1').read_text()

          required_core=[
            'https://codeload.github.com/f3arif/afz-engineering/zip/',
            "coolyo@192.168.50.68",
            "C:\\Users\\Faiz\\.ssh\\afz_pi_sync",
            "C:\\Users\\Faiz\\AppData\\Local\\AFZ\\WebsiteGitDeploy",
            "/opt/edge/afz-site/html",
            "deleteExtraneousFiles",
            "hpenvy",
            "/api/ai-chat",
            "rollback.sh",
            "afz-git-deploy.json",
            "AFZ CHAT SESSION PERSISTENCE",
            "AFZ AI PROJECT QUESTION PREFILL",
            "Do you provide HVAC design?",
            "New-VerifiedProductionArchive",
            "$TempBase=Join-Path $ResultRoot 'temp'",
            "archiveAttempts",
            "'-tzf'",
            "ConnectionAttempts=1",
            "ServerAliveCountMax=3",
            "Pi contact begins only after local archive creation + integrity verification passes.",
            "[string[]]$ArgumentList",
            "@ArgumentList",
            "[string[]]$TarArguments",
            "@TarArguments"
          ]
          for marker in required_core: assert marker in core, marker
          assert '[string[]]$Args' not in core, 'PowerShell automatic $args collision reintroduced'
          assert '& tar.exe @Args' not in core, 'PowerShell automatic $args collision reintroduced'
          archive_call="New-VerifiedProductionArchive $repoRoot.FullName $Archive"
          first_pi='Invoke-Ssh "mkdir -p'
          assert core.index(archive_call) < core.index(first_pi), 'Pi contact must occur only after archive verification'
          for forbidden in (
            "Invoke-External 'git.exe'",
            'Invoke-External "git.exe"',
            "Invoke-External 'node.exe'",
            'Invoke-External "node.exe"',
            '& git.exe', '& node.exe'
          ):
            assert forbidden not in core, forbidden

          required_watcher=[
            "$carrierTaskName='AFZ Edge Backup'",
            "$legacySiteTaskName='AFZ Website Sync to Pi'",
            "edge-backup-interactive-carrier",
            "Restore-CarrierTask",
            "Restore-LegacySiteTask",
            "Disable-ScheduledTask -TaskName $legacySiteTaskName",
            "Set-ScheduledTask -TaskName $carrierTaskName -Action $newAction",
            "Start-ScheduledTask -TaskName $carrierTaskName",
            "if($legacy -and $legacy.State -eq 'Running')",
            "if($carrier -and $carrier.State -eq 'Running')",
            "source_repository -ne 'f3arif/afz-engineering'"
          ]
          for marker in required_watcher: assert marker in watcher, marker
          assert "Set-ScheduledTask -TaskName $legacySiteTaskName -Action $newAction" not in watcher
          assert "Disable-ScheduledTask -TaskName $carrierTaskName | Out-Null\n      Save-State" not in watcher
          assert "AFZ Website Git Deploy Request Watcher" in updater
          print('R5 NATIVE ARGS + CARRIER CONTRACT PASS')

      - name: Syntax-check embedded Pi Bash
        shell: python
        run: |
          import re
          from pathlib import Path
          text=Path('afz-openai-agent/Deploy-AFZ-WebsiteToPi-Core.ps1').read_text()
          m=re.search(r"\$bash=@'\n(.*?)\n'@",text,re.S)
          assert m, 'literal Bash template not found'
          bash=m.group(1).replace('__JOB_ID__','validate-job').replace('__EXPECTED_SHA__','c38576741ce2d379723fde038300363429845656').replace('__REMOTE_ARCHIVE__','/tmp/site.tar.gz').replace('__REMOTE_SCRIPT__','/tmp/site.sh')
          Path('/tmp/afz-site-deploy.sh').write_text(bash)

      - name: Bash parser
        shell: bash
        run: bash -n /tmp/afz-site-deploy.sh

      - name: Verify AFZ production commit and guard
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python -c "import json;print(json.load(open('afz-openai-agent/requests/afz-site-deploy-next.json'))['expected_sha'])")
          git init -q /tmp/afz-engineering
          git -C /tmp/afz-engineering remote add origin https://github.com/f3arif/afz-engineering.git
          git -C /tmp/afz-engineering fetch -q --depth 1 origin "$sha"
          git -C /tmp/afz-engineering checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/afz-engineering rev-parse HEAD)" = "$sha"
          node /tmp/afz-engineering/scripts/afz-production-deploy-guard.mjs
          python - <<'PY'
          import json
          m=json.load(open('/tmp/afz-engineering/production-site/manifest.json'))
          assert m['reconciled'] is True
          assert m['deployment']['target']=='/opt/edge/afz-site/html'
          assert m['deployment']['deleteExtraneousFiles'] is False
          assert m['webchat']['backendOwner']=='hpenvy'
          assert m['webchat']['endpoint']=='/api/ai-chat'
          assert len(m['files']) >= 8
          print('SITE COMMIT CONTRACT PASS')
          PY

  windows-native-archive-selftest:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Execute exact native archive helpers under Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path 'afz-openai-agent/Deploy-AFZ-WebsiteToPi-Core.ps1').Path
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'Core PowerShell parse failed'}
          $wanted=@('Invoke-External','Invoke-Tar','New-VerifiedProductionArchive')
          $defs=New-Object System.Collections.Generic.List[string]
          foreach($name in $wanted){
            $node=$ast.Find({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name},$true)
            if(-not $node){throw "Missing helper function: $name"}
            $defs.Add($node.Extent.Text)
          }
          Invoke-Expression ($defs -join "`r`n`r`n")

          $TempRoot=Join-Path $env:RUNNER_TEMP 'afz-r5-native-archive'
          Remove-Item -LiteralPath $TempRoot -Recurse -Force -ErrorAction SilentlyContinue
          $repo=Join-Path $TempRoot 'repo'
          $site=Join-Path $repo 'production-site'
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          Set-Content -LiteralPath (Join-Path $site 'managed.sha256') -Value 'selftest' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $site 'index.html') -Value '<html>selftest</html>' -Encoding ASCII
          $archive=Join-Path $TempRoot 'production-site.tar.gz'
          $script:archiveAttempts=0

          New-VerifiedProductionArchive $repo $archive
          if(-not(Test-Path -LiteralPath $archive -PathType Leaf)){throw 'Archive self-test did not create an archive'}
          if((Get-Item -LiteralPath $archive).Length -le 0){throw 'Archive self-test created an empty archive'}

          $listed=Invoke-Tar @('-tzf',$archive)
          if($listed.ExitCode -ne 0){throw "Invoke-Tar list failed: $($listed.StdErr)"}
          if($listed.StdOut -notmatch '(?m)^production-site/managed\.sha256\r?$'){throw 'Invoke-Tar list did not contain managed.sha256'}

          Invoke-External 'tar.exe' @('-tzf',$archive) 'Invoke-External tar list failed.'
          Write-Host "WINDOWS NATIVE ARCHIVE SELFTEST PASS attempts=$archiveAttempts bytes=$((Get-Item -LiteralPath $archive).Length)"
