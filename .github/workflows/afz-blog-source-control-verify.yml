name: AFZ Blog source control verify

on:
  push:
    branches: [main]
    paths:
      - '.github/afz-blog-source-control-verify-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: afz-blog-source-control-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Resolve current main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "AFZ_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Trigger exact source sync on Windows-main
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 3 --max-time 15 \
            -H 'Content-Type: application/json' \
            -X POST --data "$payload" \
            http://100.70.25.8:8797/api/push-deploy

      - name: Verify exact Windows-main source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if health=$(curl --silent --show-error --fail --connect-timeout 3 --max-time 10 http://100.70.25.8:8797/health 2>/dev/null); then
              printf '%s\n' "$health" > afz-blog-windows-health.json
              if HEALTH="$health" EXPECTED="$AFZ_SHA" python - <<'PY'
          import json, os
          data=json.loads(os.environ['HEALTH'])
          expected=os.environ['EXPECTED'].strip().lower()
          assert data.get('ok') is True
          assert (data.get('commit') or '').strip().lower()==expected
          assert data.get('transport')=='github-fast-signal+exact-sha+codeload'
          PY
              then
                python -m json.tool afz-blog-windows-health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Windows-main did not reach the resolved main SHA' >&2
          exit 1

      - name: Upload live health proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afz-blog-windows-health
          path: afz-blog-windows-health.json
          if-no-files-found: warn
          retention-days: 3
