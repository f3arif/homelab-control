<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFZ OpenAI Agent</title><style>body{font:15px system-ui;background:#0b1220;color:#e5edf7;margin:0}.wrap{max-width:900px;margin:32px auto;padding:20px}.card{background:#111b2e;border:1px solid #26344d;border-radius:14px;padding:18px;margin-bottom:14px}h1{margin:0 0 6px;font-size:24px}.muted{color:#95a8c7}textarea{width:100%;min-height:150px;box-sizing:border-box;background:#08101d;color:#edf5ff;border:1px solid #334766;border-radius:10px;padding:12px;font:14px ui-monospace,monospace}select,button{background:#162743;color:#fff;border:1px solid #355078;border-radius:9px;padding:9px 12px}button{cursor:pointer;background:#185abc}pre{white-space:pre-wrap;background:#08101d;border-radius:10px;padding:14px;min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.good{color:#79e2a8}.bad{color:#ff8a8a}</style></head><body><div class="wrap"><div class="card"><h1>AFZ OpenAI Agent</h1><div id="health" class="muted">Checking local agent…</div></div><div class="card"><div class="row"><select id="project"><option value="torbox">torbox</option><option value="media">media</option><option value="AFZ-General">AFZ-General</option></select><select id="processor"><option value="auto">Smart Auto</option><option value="luna">Luna</option><option value="sol">Sol</option></select><button id="run">Process request</button></div><p class="muted">Typed local tools only. No OneDrive execution bus. V1 is read-only for Jellyfin.</p><textarea id="prompt">Continue diagnosing the Jellyfin TorBox native-library regression. Use the live read-only tools, compare against known-good backups, and identify the exact minimal reversible repair.</textarea></div><div class="card"><b>Result</b><pre id="out">Ready.</pre></div></div><script>const h=document.getElementById('health'),o=document.getElementById('out'),b=document.getElementById('run');async function health(){try{let r=await fetch('/health',{cache:'no-store'}),j=await r.json();h.innerHTML='<span class="good">ONLINE</span> · '+j.version+' · '+j.mode+' · '+j.modelLuna+' / '+j.modelSol}catch(e){h.innerHTML='<span class="bad">OFFLINE</span> · '+e.message}}b.onclick=async()=>{b.disabled=true;o.textContent='Working…';try{let r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:document.getElementById('project').value,processor:document.getElementById('processor').value,prompt:document.getElementById('prompt').value})});let j=await r.json();o.textContent=(j.answer||j.error||JSON.stringify(j,null,2))+'\n\nTools: '+JSON.stringify(j.toolTrace||[])}catch(e){o.textContent=e.message}finally{b.disabled=false}};health();</script></body></html>
