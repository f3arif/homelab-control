name: AFZ Blog Production Sync Hook Validate

on:
  push:
    branches:
      - chatgpt/afz-blog-prod-deploy-sync-hook
      - chatgpt/afz-blog-prod-deploy-a223b14b
    paths:
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - 'afz-openai-agent/requests/afz-blog-production-deploy.json'
      - '.github/workflows/afz-blog-prod-sync-hook-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse fresh sync wrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw "Parse errors: $($errors.Message -join '; ')"}
          Write-Host 'PARSE_PASS'

      - name: Verify production deploy hook invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $text=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          foreach($needle in @(
            'AFZ_BLOG_PRODUCTION_DEPLOY_SYNC_HOOK_V1',
            'Invoke-AFZBlog-ProductionDeploy.ps1',
            'afz-blog-production-deploy.json',
            '-InstallRoot $InstallRoot',
            '-RequestPath $blogProductionDeployRequest'
          )){
            if(-not $text.Contains($needle)){throw "Missing sync-hook invariant: $needle"}
          }
          $marker='AFZ_BLOG_PRODUCTION_DEPLOY_SYNC_HOOK_V1'
          if(([regex]::Matches($text,[regex]::Escape($marker))).Count -ne 1){
            throw 'Production deploy sync hook must occur exactly once.'
          }
          $request=Get-Content 'afz-openai-agent/requests/afz-blog-production-deploy.json' -Raw | ConvertFrom-Json
          if([string]$request.id -ne 'afz-blog-production-deploy-a223b14b-r2'){throw 'request id mismatch'}
          if([string]$request.expected_current_sha -ne 'a37e71aa0e0c9fad41ecdc9652a7024c485666f4'){throw 'current production SHA mismatch'}
          if([string]$request.expected_blog_sha -ne 'a223b14b38260d097343b8cdb4499f4122140321'){throw 'target Blog SHA mismatch'}
          if([bool]$request.allow_database_mutation -or [bool]$request.allow_schema_or_migration_change -or [bool]$request.allow_website_publish){throw 'unsafe mutation flag enabled'}
          if(-not [bool]$request.allow_database_untrack_migration){throw 'database untrack migration must remain enabled'}
          if(-not [bool]$request.rollback_on_failure){throw 'rollback must remain enabled'}

          Write-Host 'SYNC_HOOK_SAFETY_PASS'
