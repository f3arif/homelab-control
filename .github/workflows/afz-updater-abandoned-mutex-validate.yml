name: AFZ Updater Abandoned Mutex Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
      - '.github/workflows/afz-updater-abandoned-mutex-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse updater with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if($errors.Count){
            $errors|Format-List|Out-String|Write-Error
            throw 'Updater PowerShell parse failed.'
          }
          'UPDATER_PARSE=PASS'

      - name: Verify abandoned mutex recovery contract
        shell: powershell
        run: |
          $text=Get-Content 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1' -Raw
          foreach($needle in @(
            "Global\AFZOpenAIAgentUpdater",
            '$mutex.WaitOne([TimeSpan]::FromSeconds(60))',
            'catch [System.Threading.AbandonedMutexException]',
            '$locked=$true',
            "if(-not $locked){throw 'Another AFZ updater instance remained active for more than 60 seconds'}",
            'if($locked){try{$mutex.ReleaseMutex()}catch{}}',
            '$mutex.Dispose()'
          )){
            if(-not $text.Contains($needle)){throw "Updater mutex invariant missing: $needle"}
          }
          $wait=$text.IndexOf('$mutex.WaitOne([TimeSpan]::FromSeconds(60))')
          $catch=$text.IndexOf('catch [System.Threading.AbandonedMutexException]')
          $locked=$text.IndexOf('$locked=$true',$catch)
          $contention=$text.IndexOf("if(-not $locked){throw 'Another AFZ updater instance remained active for more than 60 seconds'}")
          if(-not($wait -ge 0 -and $catch -gt $wait -and $locked -gt $catch -and $contention -gt $locked)){
            throw 'Abandoned mutex recovery must occur before the ordinary contention guard.'
          }
          'ABANDONED_MUTEX_RECOVERY_CONTRACT=PASS'

      - name: Prove .NET abandoned mutex semantics
        shell: powershell
        run: |
          $name='Global\AFZUpdaterMutexCI-'+[guid]::NewGuid().ToString('n')
          $escaped=$name.Replace("'","''")
          $child="`$m=New-Object Threading.Mutex(`$false,'$escaped');`$null=`$m.WaitOne();[Environment]::Exit(0)"
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($child))
          $p=Start-Process powershell.exe -ArgumentList @('-NoProfile','-EncodedCommand',$encoded) -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Mutex-owner child failed.'}
          $m=New-Object Threading.Mutex($false,$name)
          $caught=$false;$owned=$false
          try{
            try{$owned=$m.WaitOne([TimeSpan]::FromSeconds(5))}
            catch [System.Threading.AbandonedMutexException]{$caught=$true;$owned=$true}
            if(-not $caught){throw 'Expected AbandonedMutexException was not observed.'}
            if(-not $owned){throw 'Abandoned mutex did not transfer ownership.'}
          }finally{
            if($owned){try{$m.ReleaseMutex()}catch{}}
            $m.Dispose()
          }
          'ABANDONED_MUTEX_SEMANTICS=PASS'
