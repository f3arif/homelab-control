name: RadioHilal HP Envy Control Hub read-only capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/radiohilal-hpenvy-controlhub-readonly-capture.yml'
      - '.github/afz-radiohilal-controlhub-capture-signal.txt'

permissions:
  contents: read

concurrency:
  group: radiohilal-hpenvy-controlhub-readonly-capture
  cancel-in-progress: false

jobs:
  validate-readonly-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate capture contract without tailnet access
        shell: bash
        run: |
          set -euo pipefail
          wf='.github/workflows/radiohilal-hpenvy-controlhub-readonly-capture.yml'
          grep -q 'workflow_dispatch:' "$wf"
          grep -q "if: github.event_name == 'workflow_dispatch'" "$wf"
          grep -q 'needs: validate-readonly-boundary' "$wf"
          grep -q 'tailscale ssh coolyo@100.71.26.69' "$wf"
          grep -q 'app/main.py' "$wf"
          grep -q 'test ! -L app/main.py' "$wf"
          grep -q 'SECRET_SCAN=PASS' "$wf"
          grep -q 'actions/upload-artifact@v4' "$wf"
          ! grep -Eq 'docker compose (up|down|restart)|systemctl|service[[:space:]]|curl .*(-X|--request)[[:space:]]+(POST|PUT|PATCH|DELETE)|rm[[:space:]]+-|chmod|chown' "$wf"
          echo 'CAPTURE_STATIC_READONLY_VALIDATION=PASS'

  capture:
    needs: validate-readonly-boundary
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Capture exact non-secret Control Hub source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          remote_manifest=$(cat <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = 'hpenvy'
          test "$(id -un)" = 'coolyo'
          root="$HOME/afz-control-hub"
          test -d "$root"
          cd "$root"
          test -f app/main.py
          test ! -L app/main.py
          echo 'AFZ_CONTROLHUB_CAPTURE_V1'
          printf 'HOST=%s\nUSER=%s\n' "$(hostname)" "$(id -un)"
          printf 'CAPTURED_UTC=%s\n' "$(date -u +%FT%TZ)"
          printf 'MAIN_SHA256='
          sha256sum app/main.py | awk '{print $1}'
          for f in requirements.txt pyproject.toml Dockerfile; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              printf 'FILE_SHA256 %s ' "$f"
              sha256sum "$f" | awk '{print $1}'
            fi
          done
          curl -fsS --max-time 5 http://127.0.0.1:8789/health | python3 -c 'import json,sys; h=json.load(sys.stdin); print("HEALTH_SERVICE="+str(h.get("service",""))); print("HEALTH_VERSION="+str(h.get("version",""))); print("HEALTH_MODE="+str(h.get("mode","")))'
          REMOTE
          )
          printf '%s\n' "$remote_manifest" | tailscale ssh coolyo@100.71.26.69 'bash -s' > capture/controlhub-manifest.txt

          # Stream only an explicit non-secret allowlist. Never include .env or runtime data.
          tailscale ssh coolyo@100.71.26.69 "bash -lc 'cd \"\$HOME/afz-control-hub\" && files=(app/main.py); test ! -L app/main.py; for f in requirements.txt pyproject.toml Dockerfile; do [ -f \"\$f\" ] && [ ! -L \"\$f\" ] && files+=(\"\$f\"); done; tar -czf - \"\${files[@]}\"'" > capture/controlhub-source.tgz

          tar -tzf capture/controlhub-source.tgz > capture/archive-files.txt
          if grep -Eiq '(^|/)(\.env|secrets?|credentials?)(/|$)' capture/archive-files.txt; then
            echo 'ERROR=secret-bearing path entered capture archive'
            exit 20
          fi
          grep -Fxq 'app/main.py' capture/archive-files.txt

          scan_root=$(mktemp -d)
          tar -xzf capture/controlhub-source.tgz -C "$scan_root"
          python3 - "$scan_root" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          literal_assignment = re.compile(r"(?i)\b(api[_-]?key|token|password|passwd|secret|client[_-]?secret)\b\s*[:=]\s*['\"]([^'\"]{8,})['\"]")
          token_prefix = re.compile(r"(?i)(?:sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|tskey-[A-Za-z0-9_-]{16,})")
          private_key = re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")
          findings = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if private_key.search(line): findings.append((p, n, 'private-key'))
                  if token_prefix.search(line): findings.append((p, n, 'token-prefix'))
                  m = literal_assignment.search(line)
                  if m and not any(x in m.group(2).lower() for x in ('example','placeholder','changeme','dummy','test-only')):
                      findings.append((p, n, 'literal-secret-assignment'))
          if findings:
              for p, n, kind in findings:
                  print(f'SECRET_SCAN_FINDING file={p.relative_to(root)} line={n} kind={kind}')
              raise SystemExit(22)
          print('SECRET_SCAN=PASS')
          PY

          sha256sum capture/controlhub-source.tgz capture/controlhub-manifest.txt > capture/local-sha256.txt

      - name: Validate capture boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^AFZ_CONTROLHUB_CAPTURE_V1$' capture/controlhub-manifest.txt
          grep -q '^HOST=hpenvy$' capture/controlhub-manifest.txt
          grep -q '^USER=coolyo$' capture/controlhub-manifest.txt
          grep -q '^MAIN_SHA256=[0-9a-f]\{64\}$' capture/controlhub-manifest.txt
          grep -q '^HEALTH_SERVICE=afz-control-hub$' capture/controlhub-manifest.txt
          grep -q '^HEALTH_VERSION=.' capture/controlhub-manifest.txt
          grep -q '^HEALTH_MODE=safe-readonly$' capture/controlhub-manifest.txt
          test -s capture/controlhub-source.tgz
          test -s capture/local-sha256.txt
          if grep -R -E 'AFZ_HUB_TOKEN=|OPENAI_API_KEY=|API_KEY=|PASSWORD=|PRIVATE KEY' capture --exclude='controlhub-source.tgz'; then
            echo 'ERROR=possible secret material found in textual capture'
            exit 21
          fi
          echo 'READONLY_CAPTURE_VALIDATION=PASS'

      - name: Upload read-only capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiohilal-hpenvy-controlhub-readonly-capture
          path: capture/
          if-no-files-found: error
          retention-days: 7