name: Validate H3 Qwen 35B A3B Website Test

on:
  pull_request:
    paths:
      - 'afz-openai-agent/tools/Start-H3-Qwen35BA3B-WebsiteTest.ps1'
      - 'afz-openai-agent/requests/h3-qwen35b-a3b-website-test.json'
      - '.github/workflows/h3-qwen35b-a3b-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='afz-openai-agent/tools/Start-H3-Qwen35BA3B-WebsiteTest.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw ('PowerShell parse failure: '+($errors.Message -join '; '))}

      - name: Enforce one-call fair-comparison contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content 'afz-openai-agent/requests/h3-qwen35b-a3b-website-test.json' -Raw|ConvertFrom-Json
          $runner=Get-Content 'afz-openai-agent/tools/Start-H3-Qwen35BA3B-WebsiteTest.ps1' -Raw
          if([string]$request.job_id -ne 'qwen35b-a3b-website-20260830-r1'){throw 'unexpected job id'}
          if([string]$request.model -ne 'qwen3.6:35b-a3b'){throw 'unexpected model'}
          if([int]$request.context -ne 16384){throw 'context must be 16384 for comparison'}
          if(-not [bool]$request.no_think){throw 'no_think must be true'}
          if([int]$request.max_model_calls -ne 1){throw 'max model calls must remain 1'}
          $expected=@('/','/services','/projects','/about','/contact')
          $routes=@($request.required_routes|ForEach-Object {[string]$_})
          if($routes.Count -ne 5){throw 'five routes required'}
          foreach($route in $expected){if($routes -notcontains $route){throw "missing route $route"}}
          foreach($needle in @(
            "`$Model='qwen3.6:35b-a3b'",
            "`$Context=16384",
            'max_model_calls=1',
            'human_written_website_code=0',
            'qwen_only_website_author=$true',
            'model_call_attempted=$true',
            "Save-State 'running' 'ollama_post_started'",
            "Save-State 'running' 'ollama_post_returned'",
            'num_ctx=$Context',
            'num_predict=11000',
            'think=$false',
            '/no_think',
            '<<<FILE:',
            '<<<END FILE>>>',
            "@('/','/services','/projects','/about','/contact')",
            "& curl.exe -sS --max-time 10800",
            "& ollama list",
            "& ollama ps"
          )){if(-not $runner.Contains($needle)){throw "required invariant missing: $needle"}}
          if($runner -match '(?i)ollama\s+pull'){throw 'runner must not pull models automatically'}
          if($runner -match '(?i)ollama\s+stop'){throw 'runner must not unload another model'}
          if($runner -match '(?i)Invoke-Expression|\biex\b'){throw 'dynamic expression execution forbidden'}
          $callCount=([regex]::Matches($runner,"127\.0\.0\.1:11434/api/generate")).Count
          if($callCount -ne 1){throw "expected exactly one Ollama generate endpoint occurrence; found $callCount"}
          Write-Host 'QWEN35B_A3B_ONE_CALL_CONTRACT=PASS'
