name: AFZ Agent Fast Signal

on:
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/**'

permissions:
  contents: write

concurrency:
  group: afz-agent-fast-signal
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish exact pushed SHA
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/afz-agent-deploy-signal.txt';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const content = Buffer.from(`${context.sha}\n`).toString('base64');
            for (let attempt = 1; attempt <= 4; attempt++) {
              let currentSha;
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                if (!Array.isArray(r.data)) currentSha = r.data.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  branch: 'main',
                  message: `AFZ deploy signal ${context.sha.slice(0,12)}`,
                  content,
                  ...(currentSha ? { sha: currentSha } : {})
                });
                core.info(`Published AFZ deploy signal ${context.sha}`);
                return;
              } catch (e) {
                if (attempt === 4) throw e;
                core.warning(`Signal update race on attempt ${attempt}; retrying...`);
                await new Promise(r => setTimeout(r, 500 * attempt));
              }
            }
