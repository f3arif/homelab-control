name: HP Envy Hermes OAuth Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/hpenvy-hermes-oauth-direct-signal.txt'

permissions:
  contents: write
  id-token: write

concurrency:
  group: hpenvy-hermes-oauth-direct
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Generate fresh Hermes OpenAI device code
        id: oauth
        shell: bash
        run: |
          set -euo pipefail
          remote_script=$(cat <<'REMOTE'
          set -eu
          root="$HOME/.hermes/afz-openai-oauth"
          mkdir -p "$root"
          pkill -f '/home/coolyo/.local/bin/hermes auth add openai-codex' >/dev/null 2>&1 || true
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          log="$root/login-$ts.log"
          nohup script -qefc '/home/coolyo/.local/bin/hermes auth add openai-codex' "$log" >/dev/null 2>&1 </dev/null &
          pid=$!
          printf 'AFZ_OAUTH_PID=%s\n' "$pid"
          printf 'AFZ_OAUTH_LOG=%s\n' "$log"
          for i in $(seq 1 24); do
            sleep 0.5
            if grep -q 'auth.openai.com/codex/device' "$log" 2>/dev/null; then break; fi
          done
          cat "$log" 2>/dev/null || true
          REMOTE
          )
          set +e
          raw=$(printf '%s\n' "$remote_script" | tailscale ssh coolyo@100.71.26.69 'bash -s' 2>&1)
          ssh_code=$?
          set -e
          RAW="$raw" SSH_CODE="$ssh_code" python - <<'PY' > /tmp/oauth-result.json
          import json, os, re, time
          raw=os.environ.get('RAW','')
          clean=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          urlm=re.search(r'https://auth\.openai\.com/codex/device(?:\?[^\s]+)?', clean, re.I)
          codem=re.search(r'\b[A-Z0-9]{4}-[A-Z0-9]{5}\b', clean, re.I)
          pidm=re.search(r'^AFZ_OAUTH_PID=(\d+)$', clean, re.M)
          logm=re.search(r'^AFZ_OAUTH_LOG=([^\r\n]+)$', clean, re.M)
          result={
            'schema':1,
            'target':'coolyo@100.71.26.69',
            'provider':'openai-codex',
            'classification':'AUTH_DEVICE_CODE_READY' if urlm and codem else 'AUTH_DEVICE_CODE_NOT_EMITTED',
            'deviceUrl':urlm.group(0).rstrip('.,)]') if urlm else None,
            'deviceCode':codem.group(0).upper() if codem else None,
            'remoteOauthPid':int(pidm.group(1)) if pidm else None,
            'remoteOauthLog':logm.group(1).strip() if logm else None,
            'tailscaleSshExitCode':int(os.environ.get('SSH_CODE','-1')),
            'providerSwitched':False,
            'generationStarted':False,
            'gatewayStarted':False,
            'secretValuesEmitted':False,
            'rawOutputPersisted':False,
            'generatedAtEpoch':int(time.time())
          }
          print(json.dumps(result, separators=(',',':')))
          PY
          cat /tmp/oauth-result.json

      - name: Publish sanitized OAuth result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(cat /tmp/oauth-result.json)
          content=$(printf '%s\n' "$result" | base64 -w0)
          path="afz-openai-agent/oauth-results/hpenvy-openai-codex-${RUN_ID}.json"
          payload=$(python - "$content" "$path" <<'PY'
          import json,sys
          content,path=sys.argv[1:]
          print(json.dumps({'message':'Publish sanitized HP Envy Hermes OAuth result','content':content}))
          PY
          )
          curl --silent --show-error --fail-with-body \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${REPO}/contents/${path}"
