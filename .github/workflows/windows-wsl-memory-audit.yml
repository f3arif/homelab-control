name: Windows WSL memory audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: windows-wsl-memory-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Trigger exact-SHA source sync on Windows-main
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 3 --max-time 15 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "$payload" \
            http://100.70.25.8:8797/api/push-deploy

      - name: Confirm exact source and typed audit endpoint
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if health=$(curl --silent --show-error --fail \
              --connect-timeout 3 --max-time 10 \
              http://100.70.25.8:8797/health 2>/dev/null); then
              if python - "$AFZ_SHA" <<'PY' <<<"$health"
          import json, sys
          expected = sys.argv[1].strip().lower()
          data = json.load(sys.stdin)
          endpoint = data.get('windowsWslMemoryAudit') or {}
          assert (data.get('commit') or '').strip().lower() == expected
          assert data.get('version') == '1.8.0'
          assert endpoint.get('typed') is True
          assert endpoint.get('readOnly') is True
          assert endpoint.get('arbitraryShell') is False
          assert endpoint.get('actions') == ['audit']
          PY
              then
                echo "Windows-main exact SHA and typed WSL audit endpoint confirmed."
                exit 0
              fi
            fi
            echo "Attempt $attempt: waiting for exact source + typed audit endpoint"
            sleep 5
          done
          echo "Windows-main did not reach the required exact source/endpoint state" >&2
          exit 1

      - name: Run read-only WSL memory audit
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s","action":"audit"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 3 --max-time 30 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "$payload" \
            http://100.70.25.8:8797/api/windows-wsl-memory-audit \
            > windows-wsl-memory-audit.json
          python -m json.tool windows-wsl-memory-audit.json

      - name: Validate audit result is read-only
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('windows-wsl-memory-audit.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['ok'] is True
          assert data['schema'] == 'afz.windows-wsl-memory-audit.v1'
          assert data['action'] == 'audit'
          assert data['readOnly'] is True
          assert data['computer'] == 'DESKTOP-10SKF0M'

      - name: Upload sanitized audit result
        uses: actions/upload-artifact@v4
        with:
          name: windows-wsl-memory-audit
          path: windows-wsl-memory-audit.json
          if-no-files-found: error
          retention-days: 3
