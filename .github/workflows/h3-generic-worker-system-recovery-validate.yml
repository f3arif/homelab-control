name: H3 Generic Worker SYSTEM Recovery Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - 'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1'
      - '.github/workflows/h3-generic-worker-system-recovery-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse affected scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths=@(
            'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1',
            'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $errors|Format-List|Out-String|Write-Error
              throw "PowerShell parse failed: $path"
            }
          }
          'POWERSHELL_PARSE=PASS'

      - name: Verify GitHub sync still invokes H3 preflight
        shell: powershell
        run: |
          $wrapper=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          foreach($needle in @('Invoke-H3-GenericWorker-Recovery.ps1','h3GenericWorkerRecovery')){
            if(-not $wrapper.Contains($needle)){throw "Wrapper invariant missing: $needle"}
          }
          'SYNC_WRAPPER_H3_PREFLIGHT=PASS'

      - name: Verify H3 automatic helper is read-only
        shell: powershell
        run: |
          $helper=Get-Content 'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1' -Raw
          foreach($needle in @(
            'C:\ProgramData\AFZ\OpenAIAgent\keys\afz_h3_worker_system',
            'AFZ H3 Generic Worker',
            'C:\AFZ\H3Worker\AFZ-H3-Worker.ps1',
            'C:\AFZ\H3Worker\Run-AFZ-H3-Worker-Task-Hidden.vbs',
            "Principal.LogonType -eq 'Interactive'",
            'H3_GENERIC_WORKER_RUNNING',
            'H3_GENERIC_WORKER_STALE_TASK_RUNNING_AUTHORIZATION_REQUIRED',
            'H3_GENERIC_WORKER_TASK_NOT_RUNNING_START_ELIGIBLE',
            'H3_GENERIC_WORKER_LAUNCHER_CORRUPT_REPAIR_REQUIRED',
            'readOnly=$true',
            "remoteMutation='NONE'",
            'StrictHostKeyChecking=yes',
            'IdentitiesOnly=yes',
            'RedirectStandardInput $inFile',
            '[Console]::In.ReadToEnd()',
            'Invoke-Expression $script',
            '[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($bootstrap))',
            "'-EncodedCommand',$bootstrapEncoded",
            '[IO.File]::WriteAllText($inFile,$RemoteScript,$utf8)',
            'b61d8eb4e625549836c504d102bc0139d1c97786447e2ea071ac9dbc8f02795e',
            'a09e67601c7261dc38d430c62f01395df4649cb10a487a7ae9aa74e0d06e7d55'
          )){if(-not $helper.Contains($needle)){throw "Read-only H3 invariant missing: $needle"}}

          foreach($forbidden in @(
            'Start-ScheduledTask',
            'Stop-ScheduledTask',
            'Register-ScheduledTask',
            'Set-ScheduledTask',
            'Unregister-ScheduledTask',
            'Disable-ScheduledTask',
            'Enable-ScheduledTask',
            'Stop-Process',
            'Set-Acl',
            'icacls.exe',
            'New-ItemProperty',
            'Set-ItemProperty',
            '[IO.File]::WriteAllBytes',
            'Move-Item -LiteralPath $tmpLauncher'
          )){if($helper.Contains($forbidden)){throw "Automatic H3 mutation primitive present: $forbidden"}}

          if($helper.Contains("'-Command','-'")){throw 'Ambiguous PowerShell -Command - stdin transport must not return.'}
          if($helper -match '(?i)ToBase64String[^\r\n]*RemoteScript'){throw 'Full remote probe script must never be encoded onto the SSH command line.'}
          if($helper.Contains('C:\Users\Faiz\.ssh\afz_h3_worker')){throw 'Interactive/user H3 key must not be used by SYSTEM preflight.'}
          $encodedMatches=[regex]::Matches($helper,'ToBase64String').Count
          if($encodedMatches -ne 1){throw "Expected exactly one tiny bootstrap encoding operation; found $encodedMatches"}
          'H3_GENERIC_AUTOMATIC_READ_ONLY=PASS'
