name: AFZ Control Health Read Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/afz-control-health-readonly-signal.txt'
      - '.github/workflows/afz-control-health-readonly.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: afz-control-health-readonly
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Read Windows-main control health
        shell: bash
        run: |
          set -u
          echo 'WINDOWS_MAIN_CONTROL_HEALTH_BEGIN'
          if health=$(curl --silent --show-error --fail \
            --connect-timeout 3 --max-time 12 \
            http://100.70.25.8:8797/health 2>&1); then
            echo 'WINDOWS_MAIN_CONTROL_REACHABLE=PASS'
            python -m json.tool <<<"$health" || printf '%s\n' "$health"
          else
            rc=$?
            echo 'WINDOWS_MAIN_CONTROL_REACHABLE=FAIL'
            echo "WINDOWS_MAIN_CONTROL_CURL_EXIT=$rc"
            printf '%s\n' "$health"
          fi
          echo 'WINDOWS_MAIN_CONTROL_HEALTH_END'

      - name: Read H3 reachability only
        shell: bash
        run: |
          set -u
          echo 'H3_REACHABILITY_BEGIN'
          if tailscale ping --timeout=5s --c=1 100.106.186.118; then
            echo 'H3_TAILSCALE_PING=PASS'
          else
            echo 'H3_TAILSCALE_PING=FAIL'
          fi
          if nc -z -w 3 100.106.186.118 22; then
            echo 'H3_TCP22_REACHABLE=PASS'
          else
            echo 'H3_TCP22_REACHABLE=FAIL'
          fi
          echo 'H3_REACHABILITY_END'

      - name: Enforce read-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          wf='.github/workflows/afz-control-health-readonly.yml'
          ! grep -Eq 'curl .*(-X|--request)[[:space:]]+(POST|PUT|PATCH|DELETE)' "$wf"
          ! grep -Eq '\bssh\b|Start-ScheduledTask|Stop-ScheduledTask|Stop-Process|New-NetFirewallRule|Remove-NetFirewallRule' "$wf"
          echo 'READ_ONLY_CONTRACT=PASS'
