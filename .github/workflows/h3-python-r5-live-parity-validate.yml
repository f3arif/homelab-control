name: Validate H3 Python R5 Live File-Hash Parity

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Invoke-H3-PythonR5-FileHashParity.ps1'
      - 'afz-openai-agent/Invoke-H3-Qwen35BA3B-TransportRecovery.ps1'
      - 'afz-openai-agent/h3-python-worker/**'
      - '.github/workflows/h3-python-r5-live-parity-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @(
            'afz-openai-agent/Invoke-H3-PythonR5-FileHashParity.ps1',
            'afz-openai-agent/Invoke-H3-Qwen35BA3B-TransportRecovery.ps1'
          )){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ("PowerShell parse failure in ${path}: "+($errors.Message -join '; '))}
          }

      - name: Enforce bounded SYSTEM-only parity contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='afz-openai-agent/Invoke-H3-PythonR5-FileHashParity.ps1'
          $r=Get-Content $path -Raw
          foreach($needle in @(
            "`$jobId='h3-python-r5-live-parity-20260831-r1'",
            "`$candidateCommit='278e927cec726ad86535ef06039c2d3e9c6082cf'",
            "`$key='C:\ProgramData\AFZ\OpenAIAgent\keys\afz_h3_worker_system'",
            'IdentitiesOnly=yes',
            'StrictHostKeyChecking=yes',
            "`$expectedWorkerSha='b61d8eb4e625549836c504d102bc0139d1c97786447e2ea071ac9dbc8f02795e'",
            "`$expectedLauncherSha='f8007a26f62831b515849dc9643399fac253ae23cac058db41cca83e4e80640e'",
            "`$action='h3-file-hash'",
            "args=[ordered]@{path=`$targetPath}",
            'H3_R5_FILEHASH_PARITY_PASS',
            'legacySummary=$legacySummary',
            'pythonSummary=$pythonSummary',
            'cutoverActivated=$false',
            'serviceInstalled=$false',
            'routingChanged=$false',
            'orphanCandidateProcesses=0'
          )){if(-not $r.Contains($needle)){throw "R5 invariant missing: $needle"}}
          foreach($pattern in @(
            '(?im)^\s*Start-ScheduledTask\b',
            '(?im)^\s*Stop-ScheduledTask\b',
            '(?im)^\s*Set-ScheduledTask\b',
            '(?im)^\s*Register-ScheduledTask\b',
            '(?im)^\s*Unregister-ScheduledTask\b',
            '(?im)^\s*(?:Stop|Start|Restart)-Service\b',
            '(?im)^\s*Stop-Process\b',
            '(?im)^\s*Set-Acl\b',
            '(?i)\bicacls(?:\.exe)?\b',
            '(?im)^\s*(?:New|Set)-ItemProperty\b',
            '(?i)127\.0\.0\.1:11434/api/generate',
            '(?im)^\s*[&]?\s*ollama(?:\.exe)?\s',
            '(?i)C:\\Users\\Faiz\\\.ssh\\afz_h3_worker(?:\s|''|")',
            '(?i)Invoke-Expression|\biex\b'
          )){if($r -match $pattern){throw "Forbidden R5 parity primitive matched: $pattern"}}
          Write-Host 'H3_R5_BOUNDED_SYSTEM_PARITY_CONTRACT=PASS'

      - name: Preserve frozen Qwen router semantics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content 'afz-openai-agent/Invoke-H3-Qwen35BA3B-TransportRecovery.ps1' -Raw
          foreach($needle in @(
            "`$jobId='qwen35b-a3b-website-20260830-r1'",
            "classification='QWEN35B_R1_TRANSPORT_FROZEN_POSTRETURN_ONLY'",
            'modelCallIssued=$false',
            'Invoke-H3-Qwen35BA3B-PostReturnRecoveryV2.ps1',
            'Invoke-H3-PythonR5-FileHashParity.ps1',
            'r5PythonFileHashParity=$r5Parity',
            'exit $code'
          )){if(-not $r.Contains($needle)){throw "Router invariant missing: $needle"}}
          if($r -match '127\.0\.0\.1:11434/api/generate'){throw 'router must not contain Ollama generate endpoint'}
          if($r -match '(?im)^\s*[&]?\s*ollama(?:\.exe)?\s'){throw 'router must not invoke Ollama CLI'}
          if($r -match 'exit\s+\$r5Code'){throw 'R5 result must never control Qwen router exit code'}
          Write-Host 'QWEN35B_R1_EXIT_AND_MODEL_GUARD=PASS'

      - name: Run H3 Python candidate unit tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'afz-openai-agent/h3-python-worker'
          python -m unittest discover -s tests -v
