name: HP Envy Nextcloud Probe Once 20260920

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpenvy-nextcloud-probe-once-20260920.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy
      - name: Probe HP Envy Nextcloud read-only
        shell: bash
        run: |
          set +e
          host=100.71.26.69
          echo 'AFZ_HPENVY_NEXTCLOUD_PROBE_V1'
          tailscale ping --timeout=5s -c 1 "$host" || true
          if timeout 5 bash -c "</dev/tcp/$host/8446" 2>/dev/null; then
            echo 'TCP_8446=OPEN'
          else
            echo 'TCP_8446=CLOSED_OR_FILTERED'
          fi
          for path in /status.php /login /ocs/v2.php/cloud/capabilities; do
            echo "PATH=$path"
            curl -k -sS --connect-timeout 4 --max-time 8 -D - "https://$host:8446$path" -o /tmp/body || true
            head -c 1200 /tmp/body 2>/dev/null || true
            echo
          done
          echo 'FINAL_CLASSIFICATION=AFZ_HPENVY_NEXTCLOUD_PROBE_COMPLETE'
