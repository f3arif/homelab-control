name: H3 Hermes Docker Desktop Discovery Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-docker-discovery-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Docker CLI fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Invoke-H3-HermesAgent-Install.Core.ps1'
          $text=Get-Content $p -Raw
          $old=@(
            '  $dockerCmd=Get-Command docker.exe -ErrorAction SilentlyContinue|Select-Object -First 1',
            "  if(-not `$dockerCmd){Emit `$false 'HERMES_DOCKER_ENGINE_MISSING' @{retryable=`$false;dockerReady=`$false;repaired=`$false} `$false;exit 31}",
            '  $script:docker=[string]$dockerCmd.Source'
          ) -join "`n"
          $new=@(
            '  $dockerCmd=Get-Command docker.exe -ErrorAction SilentlyContinue|Select-Object -First 1',
            '  if(-not $dockerCmd){',
            "    `$dockerFallback='C:\Program Files\Docker\Docker\resources\bin\docker.exe'",
            '    if(Test-Path -LiteralPath $dockerFallback -PathType Leaf){$dockerCmd=[pscustomobject]@{Source=$dockerFallback}}',
            '  }',
            "  if(-not `$dockerCmd){Emit `$false 'HERMES_DOCKER_ENGINE_MISSING' @{retryable=`$false;dockerReady=`$false;repaired=`$false} `$false;exit 31}",
            '  $script:docker=[string]$dockerCmd.Source'
          ) -join "`n"
          if(-not $text.Contains($old)){throw 'Expected Docker discovery block was not found'}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText((Resolve-Path $p),$text,(New-Object Text.UTF8Encoding($false)))

      - name: Parse and enforce invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Invoke-H3-HermesAgent-Install.Core.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'Hermes core parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('C:\Program Files\Docker\Docker\resources\bin\docker.exe','[Console]::In.ReadToEnd()','--memory=4g','--cpus=2','--shm-size=1g','host.docker.internal:11434/v1','HERMES_READY_LOCAL_OLLAMA_64K')){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          foreach($forbidden in @('8642:8642','/api/generate','ollama pull','docker.sock','winget install')){if($c.Contains($forbidden)){throw "Unexpected mutation: $forbidden"}}
          'HERMES_DOCKER_DISCOVERY=PASS'

      - name: Commit safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-HermesAgent-Install.Core.ps1
          git commit -m 'Detect Docker Desktop CLI outside H3 SSH PATH'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
