name: Tailscale DNS Repair Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tailscale-dns-repair-probe-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
    steps:
      - name: Read Tailscale DNS control-plane settings
        shell: bash
        run: |
          set -euo pipefail
          oidc=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TS_AUDIENCE}" | jq -r .value)
          test -n "$oidc"
          exchange=$(curl -fsSL -X POST 'https://api.tailscale.com/api/v2/oauth/token-exchange' -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode "client_id=${TS_CLIENT_ID}" --data-urlencode "jwt=${oidc}")
          token=$(printf '%s' "$exchange" | jq -r .access_token)
          test -n "$token" -a "$token" != null
          echo "::add-mask::$token"
          for ep in nameservers preferences; do
            code=$(curl -sS -o "/tmp/${ep}.json" -w '%{http_code}' -H "Authorization: Bearer ${token}" "https://api.tailscale.com/api/v2/tailnet/-/dns/${ep}")
            echo "DNS_API_${ep^^}_HTTP=$code"
            if [ "$code" = 200 ]; then jq . "/tmp/${ep}.json"; fi
          done
# trigger: 2026-09-20 dns repair probe
