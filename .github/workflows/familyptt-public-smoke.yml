name: FamilyPTT public smoke

on:
  push:
    paths:
      - '.github/afz-familyptt-public-smoke-signal.txt'

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify FamilyPTT public transport
        shell: bash
        run: |
          set -euo pipefail
          api_status="$(curl --fail --silent --show-error --output /tmp/health --write-out '%{http_code}' --max-time 15 https://ptt-api.afzeng.ca/health)"
          test "$api_status" = "200"
          curl --fail --silent --show-error --max-time 15 'https://ptt-api.afzeng.ca/token?identity=github-public-smoke&name=GitHubPublicSmoke&room=family-main' --output /tmp/token.json
          python3 - <<'PY'
          import json
          with open('/tmp/token.json') as f:
              d=json.load(f)
          assert d.get('serverUrl') == 'wss://ptt-livekit.afzeng.ca', d.get('serverUrl')
          assert bool(d.get('participantToken'))
          print('TOKEN_SERVER_URL=wss://ptt-livekit.afzeng.ca')
          print('TOKEN_PRESENT=true')
          PY
          lk_status="$(curl --fail --silent --show-error --output /tmp/livekit --write-out '%{http_code}' --max-time 15 https://ptt-livekit.afzeng.ca/)"
          test "$lk_status" = "200"
          timeout 8 bash -c '</dev/tcp/ptt-livekit.afzeng.ca/7881'
          echo "API_HEALTH_STATUS=$api_status"
          echo "LIVEKIT_HTTPS_STATUS=$lk_status"
          echo 'LIVEKIT_TCP_7881=true'
          echo 'FINAL=PASS_PUBLIC_TRANSPORT'

      - name: Join LiveKit room from external runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet livekit
          python3 - <<'PY'
          import asyncio, json, urllib.request
          from livekit import rtc

          TOKEN_URL = 'https://ptt-api.afzeng.ca/token?identity=github-rtc-smoke&name=GitHubRtcSmoke&room=family-main'

          async def main():
              with urllib.request.urlopen(TOKEN_URL, timeout=15) as r:
                  d = json.load(r)
              assert d.get('serverUrl') == 'wss://ptt-livekit.afzeng.ca'
              token = d.get('participantToken')
              assert token
              room = rtc.Room()
              await asyncio.wait_for(room.connect(d['serverUrl'], token), timeout=30)
              assert room.isconnected()
              print('ROOM_CONNECTED=true')
              print('ROOM_SERVER_URL=wss://ptt-livekit.afzeng.ca')
              await asyncio.sleep(3)
              remote_ids = sorted(room.remote_participants.keys())
              android_ids = [identity for identity in remote_ids if identity.lower().startswith('familyptt-android-')]
              print(f'REMOTE_PARTICIPANT_COUNT={len(remote_ids)}')
              print(f'ANDROID_REMOTE_COUNT={len(android_ids)}')
              for identity in android_ids:
                  print(f'ANDROID_REMOTE_ID={identity}')
              print('PHONE_ROOM_CONNECTED=' + ('true' if android_ids else 'false'))
              assert android_ids, 'Android phone participant is not present in family-main'

              active_android_mics = []
              total_android_mics = 0
              for identity in android_ids:
                  participant = room.remote_participants[identity]
                  for publication in participant.track_publications.values():
                      if publication.source == rtc.TrackSource.SOURCE_MICROPHONE:
                          total_android_mics += 1
                          print(f'ANDROID_MIC_PUBLICATION={identity} muted={str(publication.muted).lower()}')
                          if not publication.muted:
                              active_android_mics.append((identity, publication.sid))
              print(f'ANDROID_MIC_PUBLICATION_COUNT={total_android_mics}')
              print(f'ANDROID_ACTIVE_MIC_COUNT={len(active_android_mics)}')
              print('PHONE_IDLE_MIC_SAFE=' + ('true' if not active_android_mics else 'false'))
              assert not active_android_mics, 'Android microphone is unexpectedly active while idle'

              await room.disconnect()
              print('ROOM_DISCONNECTED_CLEANLY=true')

          asyncio.run(main())
          PY

      - name: Verify floor acquire and release without audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request

          BASE = 'https://ptt-api.afzeng.ca'
          ROOM = 'family-main'
          IDENTITY = 'github-floor-smoke'

          def request(path, method='GET', body=None):
              data = None
              headers = {}
              if body is not None:
                  data = json.dumps(body).encode('utf-8')
                  headers['content-type'] = 'application/json'
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      raw = r.read()
                      payload = json.loads(raw.decode('utf-8')) if raw else None
                      return r.status, payload
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  payload = None
                  try:
                      payload = json.loads(raw.decode('utf-8')) if raw else None
                  except Exception:
                      pass
                  return e.code, payload

          before_status, before = request(f'/floor/status?room={ROOM}')
          assert before_status == 200
          before_floor = (before or {}).get('floor')
          print('FLOOR_BEFORE_FREE=' + ('true' if before_floor is None else 'false'))
          if before_floor is not None:
              print('FLOOR_TEST_SKIPPED_BUSY=true')
              raise SystemExit(0)

          acquired = False
          try:
              acquire_status, _ = request('/floor/acquire', 'POST', {
                  'room': ROOM,
                  'identity': IDENTITY,
                  'priority': 'normal',
              })
              print(f'FLOOR_ACQUIRE_STATUS={acquire_status}')
              assert 200 <= acquire_status < 300
              acquired = True

              verify_status, verify = request(f'/floor/status?room={ROOM}')
              assert verify_status == 200
              floor_present = (verify or {}).get('floor') is not None
              print('FLOOR_AFTER_ACQUIRE_PRESENT=' + ('true' if floor_present else 'false'))
              assert floor_present
          finally:
              if acquired:
                  release_status, _ = request('/floor/release', 'POST', {
                      'room': ROOM,
                      'identity': IDENTITY,
                  })
                  print(f'FLOOR_RELEASE_STATUS={release_status}')
                  assert 200 <= release_status < 300

          free = False
          for _ in range(10):
              final_status, final = request(f'/floor/status?room={ROOM}')
              assert final_status == 200
              if (final or {}).get('floor') is None:
                  free = True
                  break
              time.sleep(0.25)
          print('FLOOR_AFTER_RELEASE_FREE=' + ('true' if free else 'false'))
          assert free
          print('FINAL=PASS_FLOOR_ACQUIRE_RELEASE_NO_AUDIO')
          PY
