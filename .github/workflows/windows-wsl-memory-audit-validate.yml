name: Windows WSL memory audit validate

on:
  push:
    paths:
      - 'afz-openai-agent/AFZ-Agent-Control.ps1'
      - 'afz-openai-agent/Invoke-Windows-Wsl-Memory-Audit.ps1'
      - 'afz-openai-agent/Queue-Orphan-Request-Watcher.ps1'
      - 'afz-openai-agent/requests/windows-wsl-memory-audit.json'
      - '.github/workflows/windows-wsl-memory-audit.yml'
      - '.github/workflows/windows-wsl-memory-audit-validate.yml'
  pull_request:
    paths:
      - 'afz-openai-agent/AFZ-Agent-Control.ps1'
      - 'afz-openai-agent/Invoke-Windows-Wsl-Memory-Audit.ps1'
      - 'afz-openai-agent/Queue-Orphan-Request-Watcher.ps1'
      - 'afz-openai-agent/requests/windows-wsl-memory-audit.json'
      - '.github/workflows/windows-wsl-memory-audit.yml'
      - '.github/workflows/windows-wsl-memory-audit-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: pwsh
        run: |
          foreach ($file in @(
            'afz-openai-agent/AFZ-Agent-Control.ps1',
            'afz-openai-agent/Invoke-Windows-Wsl-Memory-Audit.ps1',
            'afz-openai-agent/Queue-Orphan-Request-Watcher.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate narrow read-only boundary
        shell: python
        run: |
          import json
          from pathlib import Path

          audit = Path('afz-openai-agent/Invoke-Windows-Wsl-Memory-Audit.ps1').read_text(encoding='utf-8')
          control = Path('afz-openai-agent/AFZ-Agent-Control.ps1').read_text(encoding='utf-8')
          watcher = Path('afz-openai-agent/Queue-Orphan-Request-Watcher.ps1').read_text(encoding='utf-8')
          request = json.loads(Path('afz-openai-agent/requests/windows-wsl-memory-audit.json').read_text(encoding='utf-8'))
          workflow = Path('.github/workflows/windows-wsl-memory-audit.yml').read_text(encoding='utf-8')

          required_audit = [
              "schema = 'afz.windows-wsl-memory-audit.v1'",
              "readOnly = $true",
              "diagnosticWriteOnly = $true",
              "Get-CimInstance Win32_OperatingSystem",
              "Get-Process -Name 'vmmemWSL'",
              "info --format '{{.MemTotal}}'",
              "autoMemoryReclaim",
              "C:\\Users\\Faiz\\OneDrive - AFZ Engineering Inc\\AFZ Shared\\AFZ Workers\\Results",
              "AFZ-WINDOWS-WSL-MEMORY-AUDIT-LATEST.json",
              "[IO.File]::WriteAllText($publishPath, $json",
              "Operationally read-only: no process/service stop, WSL shutdown, Docker/container mutation, configuration change, or memory-cap change. The only write is this sanitized diagnostic result to the fixed AFZ Workers Results path when that directory exists.",
          ]
          for marker in required_audit:
              assert marker in audit, f'missing audit marker: {marker}'

          forbidden_audit = [
              'Stop-Process',
              'Stop-Service',
              'Restart-Service',
              'Set-Content',
              'Add-Content',
              'Out-File',
              'Remove-Item',
              'Move-Item',
              'Copy-Item',
              'New-Item',
              'wsl.exe --shutdown',
              'docker.exe stop',
              'docker compose down',
          ]
          lowered = audit.lower()
          for marker in forbidden_audit:
              assert marker.lower() not in lowered, f'audit contains forbidden mutator: {marker}'
          assert audit.count('[IO.File]::WriteAllText') == 1, 'audit may have exactly one diagnostic file write'
          assert audit.count("$publishRoot = 'C:\\Users\\Faiz\\OneDrive - AFZ Engineering Inc\\AFZ Shared\\AFZ Workers\\Results'") == 1

          required_control = [
              "version='1.10.0'",
              "'/api/windows-wsl-memory-audit'",
              "Invoke-WindowsWslMemoryAudit",
              "actions=@('audit')",
              "readOnly=$true",
              "arbitraryShell=$false",
              "if($action -ne 'audit')",
              "WSL memory audit source mismatch",
          ]
          for marker in required_control:
              assert marker in control, f'missing control boundary marker: {marker}'

          required_watcher = [
              r'afz-openai-agent\requests\windows-wsl-memory-audit.json',
              r'afz-openai-agent\Invoke-Windows-Wsl-Memory-Audit.ps1',
              'audit-wsl-memory-readonly',
              'atomic-local-readonly-request-from-exact-github-source',
              'AFZ-WINDOWS-WSL-MEMORY-AUDIT-LATEST.json',
              'EMERGENCY_DIAGNOSTIC_ACK_ONLY',
              'Process-WslAuditRequest',
              'Invoke-WslAuditRunner',
              "[string]$audit.schema -ne 'afz.windows-wsl-memory-audit.v1'",
              "[string]$audit.computer -ne 'DESKTOP-10SKF0M'",
              'readOnly=$true',
          ]
          for marker in required_watcher:
              assert marker in watcher, f'missing local watcher marker: {marker}'
          for marker in ['Invoke-Expression', 'wsl.exe --shutdown', 'docker.exe stop', 'docker compose down', 'Stop-Process', 'Stop-Service']:
              assert marker.lower() not in watcher.lower(), f'local watcher contains forbidden WSL audit mutation marker: {marker}'
          assert 'raw.githubusercontent.com' not in watcher

          assert request == {
              'schema': 1,
              'project': 'ops',
              'action': 'audit-wsl-memory-readonly',
              'request_id': 'windows-wsl-memory-audit-20260829-r2',
              'enabled': True,
          }

          required_workflow = [
              'workflow_dispatch:',
              "branches: [main]",
              "- '.github/windows-wsl-memory-audit-signal.txt'",
              'tailscale/github-action@v4',
              'tag:afz-deploy',
              '/api/push-deploy',
              '/api/windows-wsl-memory-audit',
              'windows-wsl-memory-audit.json',
              'retention-days: 3',
          ]
          for marker in required_workflow:
              assert marker in workflow, f'missing audit workflow marker: {marker}'

          assert 'workflow_run:' not in workflow
          assert 'schedule:' not in workflow
