name: H3 Watchdog Audit ACK Bind

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-watchdog-audit-ack-bind.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase current main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Bind existing local watchdog audit into transport ACK
        shell: python
        run: |
          from pathlib import Path
          p=Path('afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1')
          text=p.read_text(encoding='utf-8')
          marker='# H3_OLLAMA_WATCHDOG_AUDIT_ACK_BIND_V1'
          if marker in text:
              raise SystemExit('ACK bind already present')

          old="    $h3PostMarkerPath='C:\\ProgramData\\AFZ\\OpenAIAgent\\jobs\\h3-return-publisher-postmortem\\postmortem-v1.json'\n    $h3Hotfix=Read-DiagnosticJson $h3HotfixPath"
          new="    $h3PostMarkerPath='C:\\ProgramData\\AFZ\\OpenAIAgent\\jobs\\h3-return-publisher-postmortem\\postmortem-v1.json'\n    # H3_OLLAMA_WATCHDOG_AUDIT_ACK_BIND_V1\n    $h3OllamaWatchdogAuditPath='C:\\Users\\Faiz\\OneDrive - AFZ Engineering Inc\\ChatGPT_Termius\\H3-GENERIC-WORKER-RECOVERY-LATEST.json'\n    $h3Hotfix=Read-DiagnosticJson $h3HotfixPath"
          if text.count(old)!=1:
              raise SystemExit(f'Expected one diagnostic path anchor, got {text.count(old)}')
          text=text.replace(old,new,1)

          old2="      h3ReturnPostmortem=$h3PostMarker\n      time=(Get-Date -Format o)"
          new2="      h3ReturnPostmortem=$h3PostMarker\n      h3OllamaWatchdogAudit=Read-DiagnosticJson $h3OllamaWatchdogAuditPath\n      time=(Get-Date -Format o)"
          if text.count(old2)!=1:
              raise SystemExit(f'Expected one ACK object anchor, got {text.count(old2)}')
          text=text.replace(old2,new2,1)
          p.write_text(text,encoding='utf-8',newline='\n')

      - name: Validate observability-only bind
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'ACK bind parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('H3_OLLAMA_WATCHDOG_AUDIT_ACK_BIND_V1','H3-GENERIC-WORKER-RECOVERY-LATEST.json','h3OllamaWatchdogAudit=Read-DiagnosticJson')){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          'H3_WATCHDOG_AUDIT_ACK_BIND=PASS'

      - name: Commit and signal safe exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1
          git commit -m 'Expose H3 watchdog audit in transport ACK'
          patch_sha=$(git rev-parse HEAD)
          printf '%s\n' "$patch_sha" > .github/afz-agent-deploy-signal.txt
          git add .github/afz-agent-deploy-signal.txt
          git commit -m 'Signal H3 watchdog audit ACK bind'
          git push origin HEAD:main
          echo "H3_WATCHDOG_AUDIT_ACK_BIND_SHA=$patch_sha"
