name: AFZ Blog HP Envy Control Hub Probe
# retrigger: control-hub-http-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afz-blog-hpenvy-relay-probe.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: afz-blog-hpenvy-relay-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Read-only Control Hub probes
        shell: bash
        run: |
          set -u
          for url in \
            http://100.71.26.69:8789/api/state \
            http://100.71.26.69:8791/api/status \
            http://100.71.26.69:8791/api/control-hub/state; do
            echo "=== $url ==="
            set +e
            code=$(curl -sS --connect-timeout 4 --max-time 12 -o /tmp/afz-probe-body -w '%{http_code}' "$url" 2>/tmp/afz-probe-err)
            rc=$?
            set -e
            echo "CURL_EXIT=$rc HTTP=$code"
            if [ -s /tmp/afz-probe-body ]; then head -c 12000 /tmp/afz-probe-body; echo; fi
            if [ -s /tmp/afz-probe-err ]; then cat /tmp/afz-probe-err; fi
          done
