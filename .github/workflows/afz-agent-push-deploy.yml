name: AFZ Agent Direct Push Recovery (Tailscale OIDC)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/afz-agent-direct-push.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: afz-agent-direct-push-recovery
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Trigger exact-SHA source sync on Windows-main
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 3 --max-time 15 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "$payload" \
            http://100.70.25.8:8797/api/push-deploy

      - name: Confirm Windows-main reached exact SHA
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if health=$(curl --silent --show-error --fail \
              --connect-timeout 3 --max-time 10 \
              http://100.70.25.8:8797/health 2>/dev/null); then
              commit=$(python -c 'import json,sys; print((json.load(sys.stdin).get("commit") or "").strip().lower())' <<<"$health")
              if [ "$commit" = "${AFZ_SHA,,}" ]; then
                echo "Windows-main exact source confirmed: $commit"
                exit 0
              fi
              echo "Attempt $attempt: Windows-main source=$commit expected=${AFZ_SHA,,}"
            else
              echo "Attempt $attempt: control health unavailable"
            fi
            sleep 5
          done
          echo "Windows-main did not confirm exact source SHA within bounded recovery window" >&2
          exit 1

      - name: Confirm Prospect Engine is healthy and draft-only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if health=$(curl --silent --show-error --fail \
              --connect-timeout 3 --max-time 15 \
              http://100.70.25.8:8797/health 2>/dev/null); then
              if python -c 'import json,sys; p=json.load(sys.stdin).get("prospectEngine") or {}; assert p.get("ok") is True; assert p.get("version")=="2.0.0"; assert p.get("route")=="/prospects"; assert p.get("serverStore")=="server-local"; assert p.get("outlookSendEnabled") is False' <<<"$health"; then
                echo "AFZ Prospect Engine is healthy, server-backed, and draft-only"
                exit 0
              fi
            fi
            echo "Attempt $attempt: Prospect Engine not healthy yet"
            sleep 5
          done
          echo "AFZ Prospect Engine did not become healthy within the bounded deployment window" >&2
          exit 1
