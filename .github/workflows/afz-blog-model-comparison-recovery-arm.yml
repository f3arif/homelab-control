name: AFZ Blog Model Comparison Recovery Arm

on:
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/tools/Recover-H3-AFZBlog-ModelComparison.ps1'
      - 'afz-openai-agent/tools/Launch-H3-AFZBlog-ModelComparisonRecovery.ps1'
      - 'afz-openai-agent/Bootstrap-H3-AFZBlog-ModelComparisonRecovery.ps1'
      - 'afz-openai-agent/tools/Patch-Sync-AFZBlogRecovery.py'
      - '.github/workflows/afz-blog-model-comparison-recovery-arm.yml'

permissions:
  contents: write

concurrency:
  group: afz-blog-model-comparison-recovery-arm
  cancel-in-progress: false

jobs:
  validate-and-arm:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate recovery scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @(
            'afz-openai-agent/tools/Recover-H3-AFZBlog-ModelComparison.ps1',
            'afz-openai-agent/tools/Launch-H3-AFZBlog-ModelComparisonRecovery.ps1',
            'afz-openai-agent/Bootstrap-H3-AFZBlog-ModelComparisonRecovery.ps1'
          )) {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "$f parse errors: $($errors.Message -join '; ')"}
          }
          $r=Get-Content 'afz-openai-agent/tools/Recover-H3-AFZBlog-ModelComparison.ps1' -Raw
          foreach($needle in @(
            "35B prior state does not prove an attempted call; recovery refuses to create one.",
            "Ridge Ollama POST starting; single-flight guard set before request.",
            "publish_article=`$false",
            "production_db_mutation=`$false"
          )){if(-not $r.Contains($needle)){throw "Recovery safety marker missing: $needle"}}

      - name: Patch sync
        shell: bash
        run: python afz-openai-agent/tools/Patch-Sync-AFZBlogRecovery.py

      - name: Validate patched sync
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ($errors.Message -join '; ')}
          $s=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          foreach($n in @('Start-AFZBlogModelComparisonRecoveryOneShot','replay35B=$false','ridgeOnlyIfUnattempted=$true','afzBlogModelComparisonRecoveryActivation')){if(-not $s.Contains($n)){throw "patched sync marker missing: $n"}}

      - name: Commit guarded recovery arm
        shell: bash
        run: |
          if git diff --quiet -- afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1; then
            echo 'Sync already armed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1
          git commit -m 'Arm guarded AFZ blog comparison recovery'
          git push origin HEAD:main
