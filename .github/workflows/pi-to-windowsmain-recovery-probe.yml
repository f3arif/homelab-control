name: Pi to Windows-main LAN Recovery Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/pi-to-windowsmain-recovery-signal.txt'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Probe Pi SSH and Windows-main LAN listeners
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=5s -c 2 100.91.50.9
          script=$(cat <<'REMOTE'
          set +e
          echo "PI_HOST=$(hostname)"
          echo "PI_TIME=$(date -Is)"
          echo '=== PI ADDRESSES ==='
          ip -br addr || true
          echo '=== WINDOWS-MAIN LAN ==='
          ping -c 2 -W 2 192.168.50.94 || true
          for p in 22 135 139 445 3389 5985 5986 8787 8790 8796 8797; do
            if timeout 3 bash -c "</dev/tcp/192.168.50.94/$p" 2>/dev/null; then
              echo "WM_LAN_TCP_${p}=OPEN"
            else
              echo "WM_LAN_TCP_${p}=CLOSED_OR_FILTERED"
            fi
          done
          for url in \
            http://192.168.50.94:8790/health \
            http://192.168.50.94:8790/api/status \
            http://192.168.50.94:8796/health \
            http://192.168.50.94:8797/health; do
            echo "GET=$url"
            curl -sS --connect-timeout 3 --max-time 6 -w '\nHTTP=%{http_code}\n' "$url" || true
          done
          REMOTE
          )
          enc=$(printf '%s' "$script" | base64 -w0)
          timeout 120s tailscale ssh coolyo@100.91.50.9 "bash -lc \"echo '$enc' | base64 -d | bash\""
