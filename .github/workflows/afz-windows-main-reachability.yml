name: AFZ Windows-main reachability

on:
  push:
    branches: [main]
    paths:
      - '.github/afz-windows-main-reachability-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: afz-windows-main-reachability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Probe Windows-main management listeners without mutation
        shell: bash
        run: |
          set +e
          echo "timestamp=$(date -u +%FT%TZ)"
          echo '--- tailscale status ---'
          tailscale status
          echo '--- tailscale ping windows-main ---'
          timeout 15s tailscale ping --timeout=5s 100.70.25.8
          echo "tailscale_ping_exit=$?"
          for port in 22 445 3389 5985 5986 8790 8796 8797; do
            echo "--- tcp $port ---"
            timeout 4s bash -c "</dev/tcp/100.70.25.8/$port" 2>&1
            echo "tcp_${port}_exit=$?"
          done
          echo '--- direct fabric health 8790 ---'
          curl --silent --show-error --connect-timeout 3 --max-time 8 http://100.70.25.8:8790/health
          echo
          echo '--- control health 8797 ---'
          curl --silent --show-error --connect-timeout 3 --max-time 8 http://100.70.25.8:8797/health
          echo
          echo '--- agent health 8796 ---'
          curl --silent --show-error --connect-timeout 3 --max-time 8 http://100.70.25.8:8796/health
          echo
          exit 0
