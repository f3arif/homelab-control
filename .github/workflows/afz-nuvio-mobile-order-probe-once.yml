name: AFZ Nuvio Mobile Order Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/afz-nuvio-mobile-order-probe-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: afz-nuvio-mobile-order-probe-once
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Join AFZ tailnet
        id: tailnet
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Probe H3 Nuvio source read only
        id: h3probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          host='100.106.186.118'
          out='/tmp/afz-nuvio-mobile-order-probe-result.txt'
          {
            echo "STATE=PROBING"
            echo "TIME=$(date -u +%FT%TZ)"
            echo "TAILSCALE_STATUS="
            tailscale status 2>&1
            echo "===HOST==="
            tailscale ssh "Faiz@${host}" 'hostname' 2>&1
            echo "HOST_EXIT=$?"
            echo "===SOURCE_FILES==="
            tailscale ssh "Faiz@${host}" 'powershell.exe -NoProfile -NonInteractive -Command "$r=''C:\AFZ\Nuvio-Setup-20260923\R31-universal-row-fix-source''; Write-Output (''ROOT_EXISTS='' + (Test-Path -LiteralPath $r)); $f=Join-Path $r ''composeApp\src\commonMain\kotlin\com\nuvio\app\features\streams\StreamsScreen.kt''; $p=Join-Path $r ''composeApp\src\commonMain\kotlin\com\nuvio\app\features\streams\PhonePlaybackRecommendation.kt''; Write-Output (''STREAMS_EXISTS='' + (Test-Path -LiteralPath $f)); Write-Output (''PHONE_EXISTS='' + (Test-Path -LiteralPath $p)); if(Test-Path $f){Get-FileHash -Algorithm SHA256 $f | ForEach-Object {''STREAMS_SHA256='' + $_.Hash}; Select-String -LiteralPath $f -Pattern ''RecommendedPlaybackStreamCard|recommendedForRow|phoneRecommendation'' -Context 3,5 | ForEach-Object {$_.ToString()}}; if(Test-Path $p){Get-FileHash -Algorithm SHA256 $p | ForEach-Object {''PHONE_SHA256='' + $_.Hash}; Select-String -LiteralPath $p -Pattern ''phonePlaybackPlacement|AFZ Play Best|Recommended for this phone'' -Context 3,7 | ForEach-Object {$_.ToString()}}"' 2>&1
            echo "SOURCE_EXIT=$?"
            echo "===ADB==="
            tailscale ssh "Faiz@${host}" 'powershell.exe -NoProfile -NonInteractive -Command "$adb=''C:\Users\Faiz\AppData\Local\Android\Sdk\platform-tools\adb.exe''; if(Test-Path $adb){& $adb devices -l}else{''ADB_MISSING''}"' 2>&1
            echo "ADB_EXIT=$?"
            echo "===RECENT_APKS==="
            tailscale ssh "Faiz@${host}" 'powershell.exe -NoProfile -NonInteractive -Command "Get-ChildItem ''C:\AFZ\Nuvio-Setup-20260923'' -Filter ''*.apk'' -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 8 FullName,Length,LastWriteTime | Format-List"' 2>&1
          } > "$out"
          exit 0

      - name: Commit probe result
        if: always()
        shell: bash
        env:
          TAILSCALE_OUTCOME: ${{ steps.tailnet.outcome }}
          H3PROBE_OUTCOME: ${{ steps.h3probe.outcome }}
        run: |
          set -euo pipefail
          tmp='/tmp/afz-nuvio-mobile-order-probe-result.txt'
          git fetch origin main
          git reset --hard origin/main
          out='.github/afz-nuvio-mobile-order-probe-result.txt'
          if [ -f "$tmp" ]; then cp "$tmp" "$out"; else printf 'STATE=NO_PROBE_FILE\nTIME=%s\n' "$(date -u +%FT%TZ)" > "$out"; fi
          printf '\nTAILSCALE_OUTCOME=%s\nH3PROBE_OUTCOME=%s\nSTATE=FINISHED\n' "$TAILSCALE_OUTCOME" "$H3PROBE_OUTCOME" >> "$out"
          git config user.name "AFZ Nuvio Probe"
          git config user.email "actions@users.noreply.github.com"
          git add "$out"
          git commit -m "Record one-time Nuvio mobile ordering probe result" || exit 0
          git push origin HEAD:main
