name: H3 Hermes R35 Runtime Config Fix

on:
  push:
    paths:
      - '.github/workflows/h3-hermes-r35-runtime-config-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          set -euo pipefail
          git config user.name 'f3arif'
          git config user.email '77086535+f3arif@users.noreply.github.com'
          git pull --rebase origin main
      - name: Apply runtime route patch
        run: python scripts/patch-hermes-r35.py
      - name: Validate patch
        run: |
          set -euo pipefail
          grep -q 'HERMES_R35_MODEL_RUNTIME_CONFIG' afz-openai-agent/H3-Hermes-Ollama-LivenessRecovery.ps1
          grep -q 'HERMES_R35_HERMES_CLI_CANARY' afz-openai-agent/H3-Hermes-Ollama-LivenessRecovery.ps1
          grep -q 'model.api_mode' afz-openai-agent/H3-Hermes-Ollama-LivenessRecovery.ps1
          grep -q 'h3-hermes-chat-gateway-recovery-20260903-r35' afz-openai-agent/requests/h3-hermes-agent-install.json
      - name: Commit repair and publish exact deploy signal
        run: |
          set -euo pipefail
          git add afz-openai-agent/H3-Hermes-Ollama-LivenessRecovery.ps1 afz-openai-agent/requests/h3-hermes-agent-install.json
          git commit -m 'Fix Hermes top-level local model runtime route'
          git push origin HEAD:main
          repair_sha=$(git rev-parse HEAD)
          printf '%s\n' "$repair_sha" > .github/afz-agent-deploy-signal.txt
          git add .github/afz-agent-deploy-signal.txt
          git commit -m 'Deploy Hermes r35 runtime route repair'
          git push origin HEAD:main
          echo "REPAIR_SHA=$repair_sha"
