name: Patch AFZ Retired Site Request Prune

on:
  push:
    branches:
      - fix/afz-site-retired-request-prune
    paths:
      - afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1
      - .github/workflows/afz-site-retired-request-prune-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/afz-site-retired-request-prune

      - name: Insert narrow retired-request reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1')
          s=p.read_text(encoding='utf-8-sig')
          marker='# Exact overlay retirement reconciliation.'
          if marker in s:
              print('RETIRED_REQUEST_PRUNE_ALREADY_PRESENT')
          else:
              a1="  $copied=@()\n"
              r1="  $copied=@()\n  $removed=@()\n"
              if s.count(a1) != 1:
                  raise SystemExit(f'Expected one copied-array anchor, found {s.count(a1)}')
              s=s.replace(a1,r1,1)

              a2="""    if($needs){Copy-Item -LiteralPath $f.FullName -Destination $target -Force; $copied+=$rel}
  }

  foreach($ps1 in @("""
              block="""    if($needs){Copy-Item -LiteralPath $f.FullName -Destination $target -Force; $copied+=$rel}
  }

  # Exact overlay retirement reconciliation. Git intentionally removed the one-time
  # AFZ website active request after the verified R8 cutover. Overlay-style copying
  # must not leave that retired control file behind locally forever.
  # This is deliberately narrow: no directory mirror, wildcard prune, or recursive
  # deletion. A managed artifact is removed only when the exact downloaded Git SHA
  # does not contain that same relative file.
  $managedRetiredArtifacts=@('requests\\afz-site-deploy.json')
  foreach($rel in $managedRetiredArtifacts){
    $sourceArtifact=Join-Path $src $rel
    $localArtifact=Join-Path $dst $rel
    if(-not(Test-Path -LiteralPath $sourceArtifact -PathType Leaf) -and (Test-Path -LiteralPath $localArtifact -PathType Leaf)){
      Remove-Item -LiteralPath $localArtifact -Force
      $removed+=$rel
    }
  }

  foreach($ps1 in @("""
              if s.count(a2) != 1:
                  raise SystemExit(f'Expected one copy-loop anchor, found {s.count(a2)}')
              s=s.replace(a2,block,1)

              old_state="$state=[ordered]@{remoteSha=$remoteSha;syncedAt=(Get-Date -Format o);installRoot=$InstallRoot;copied=$copied;compatibility='windows-powershell-5.1-dpapi-health-json-responses-zeroarg-utf8-ui-fast-signal-toolargs';ridge16kTransportRecoveryReset=$ridgeRecoveryReset;refTransport=$refTransport}"
              new_state="$state=[ordered]@{remoteSha=$remoteSha;syncedAt=(Get-Date -Format o);installRoot=$InstallRoot;copied=$copied;removed=$removed;compatibility='windows-powershell-5.1-dpapi-health-json-responses-zeroarg-utf8-ui-fast-signal-toolargs-managed-retired-artifact-prune';ridge16kTransportRecoveryReset=$ridgeRecoveryReset;refTransport=$refTransport}"
              if s.count(old_state) != 1:
                  raise SystemExit(f'Expected one state anchor, found {s.count(old_state)}')
              s=s.replace(old_state,new_state,1)

              old_emit="Emit ([ordered]@{ok=$true;changed=($copied.Count -gt 0);remoteSha=$remoteSha;localSha=$localSha;copied=$copied;ridge16kTransportRecoveryReset=$ridgeRecoveryReset;h3ReturnRecovery=$h3ReturnRecovery;h3ReturnPublisherHotfix=$h3ReturnPublisherHotfix;h3ConsoleFlashRemediation=$h3ConsoleFlashRemediation;installRoot=$InstallRoot;refTransport=$refTransport})"
              new_emit="Emit ([ordered]@{ok=$true;changed=(($copied.Count -gt 0) -or ($removed.Count -gt 0));remoteSha=$remoteSha;localSha=$localSha;copied=$copied;removed=$removed;ridge16kTransportRecoveryReset=$ridgeRecoveryReset;h3ReturnRecovery=$h3ReturnRecovery;h3ReturnPublisherHotfix=$h3ReturnPublisherHotfix;h3ConsoleFlashRemediation=$h3ConsoleFlashRemediation;installRoot=$InstallRoot;refTransport=$refTransport})"
              if s.count(old_emit) != 1:
                  raise SystemExit(f'Expected one emit anchor, found {s.count(old_emit)}')
              s=s.replace(old_emit,new_emit,1)
              p.write_text(s,encoding='utf-8')
              print('RETIRED_REQUEST_PRUNE_PATCHED')
          PY

      - name: Parse and prove narrow prune behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|Format-List|Out-String|Write-Error;throw 'PowerShell parse failed'}
          $text=Get-Content -LiteralPath $p -Raw
          foreach($needle in @(
            '# Exact overlay retirement reconciliation.',
            "`$managedRetiredArtifacts=@('requests\afz-site-deploy.json')",
            'Remove-Item -LiteralPath $localArtifact -Force',
            'removed=$removed',
            '($removed.Count -gt 0)'
          )){if(-not $text.Contains($needle)){throw "Missing reconciliation safety marker: $needle"}}

          $start=$text.IndexOf('# Exact overlay retirement reconciliation.')
          $end=$text.IndexOf('  foreach($ps1 in @(',$start)
          if($start -lt 0 -or $end -le $start){throw 'Unable to isolate prune block'}
          $section=$text.Substring($start,$end-$start)
          foreach($bad in @('-Recurse','Get-ChildItem','Stop-Process','Stop-ScheduledTask','Set-ScheduledTask','Disable-ScheduledTask','Enable-ScheduledTask','requests\*')){
            if($section.Contains($bad)){throw "Forbidden broad/mutating primitive in prune block: $bad"}
          }
          if(([regex]::Matches($section,[regex]::Escape("'requests\afz-site-deploy.json'"))).Count -ne 1){throw 'Managed prune list must contain exactly the retired site request'}

          $sb=[scriptblock]::Create($section)
          $tmp=Join-Path $env:TEMP ('afz-prune-test-'+[guid]::NewGuid().ToString('n'))
          try{
            $src=Join-Path $tmp 'src';$dst=Join-Path $tmp 'dst'
            New-Item -ItemType Directory -Force -Path (Join-Path $src 'requests'),(Join-Path $dst 'requests')|Out-Null
            $local=Join-Path $dst 'requests\afz-site-deploy.json'
            Set-Content -LiteralPath $local -Value '{"status":"active"}' -Encoding ASCII
            $removed=@(); & $sb
            if(Test-Path -LiteralPath $local){throw 'Absent-in-source retired request was not removed'}
            if(@($removed).Count -ne 1 -or [string]$removed[0] -ne 'requests\afz-site-deploy.json'){throw 'Removed audit list incorrect'}

            Set-Content -LiteralPath (Join-Path $src 'requests\afz-site-deploy.json') -Value '{"status":"active"}' -Encoding ASCII
            Set-Content -LiteralPath $local -Value '{"status":"active"}' -Encoding ASCII
            $removed=@(); & $sb
            if(-not(Test-Path -LiteralPath $local)){throw 'Source-present request must never be pruned'}
            if(@($removed).Count -ne 0){throw 'Source-present request incorrectly recorded as removed'}
          }finally{Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'AFZ RETIRED REQUEST PRUNE VALIDATION PASS'

      - name: Commit core patch when needed
        shell: bash
        run: |
          if git diff --quiet -- afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1; then
            echo NO_PATCH_COMMIT_NEEDED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1
          git commit -m 'Prune retired AFZ site request during exact-SHA sync'
          git push origin HEAD:fix/afz-site-retired-request-prune
