name: H3 Qwen27B Website Benchmark Request

on:
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/requests/h3-qwen27b-benchmark.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-qwen27b-website-benchmark-request
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate typed benchmark request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          f='afz-openai-agent/requests/h3-qwen27b-benchmark.json'
          test -f "$f"
          jq -e '.schema == 1 and .project == "qwen38-27b-website-benchmark"' "$f" >/dev/null
          job_id=$(jq -r '.job_id' "$f")
          start_iteration=$(jq -r '.start_iteration // 2' "$f")
          max_iterations=$(jq -r '.max_iterations // 5' "$f")
          [[ "$job_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,80}$ ]]
          [[ "$start_iteration" =~ ^[0-9]+$ ]]
          [[ "$max_iterations" =~ ^[0-9]+$ ]]
          (( start_iteration >= 1 && start_iteration <= 8 ))
          (( max_iterations >= start_iteration && max_iterations <= 8 ))
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "start_iteration=$start_iteration" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$max_iterations" >> "$GITHUB_OUTPUT"

      - name: Record accepted GitHub-first request
        shell: bash
        env:
          JOB_ID: ${{ steps.request.outputs.job_id }}
          START_ITERATION: ${{ steps.request.outputs.start_iteration }}
          MAX_ITERATIONS: ${{ steps.request.outputs.max_iterations }}
        run: |
          set -euo pipefail
          {
            echo '### H3 Qwen27B benchmark request accepted'
            echo
            echo "- Job: \`$JOB_ID\`"
            echo "- Iterations: $START_ITERATION-$MAX_ITERATIONS"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo '- Execution transport: secretless GitHub exact-SHA sync -> windows-main typed request watcher -> fixed H3 relay'
            echo '- Durable result: https://github.com/f3arif/faiz-homelab/issues/12'
            echo '- Qwen remains the only website code author.'
          } >> "$GITHUB_STEP_SUMMARY"
