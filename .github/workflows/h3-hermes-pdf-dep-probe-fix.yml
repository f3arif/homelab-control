name: H3 Hermes PDF Pip Bootstrap Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF helper pip bootstrap
        shell: python
        run: |
          import base64
          exec(base64.b64decode(''))

      - name: Validate helper under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent\Invoke-H3-Hermes-PdfRuntimeAudit.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'PDF helper parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @(
            "Run-Python -PyArgs @('-m','ensurepip','--upgrade')",
            'HERMES_PDF_PIP_BOOTSTRAP_FAILED',
            'HERMES_PDF_PIP_VERIFY_FAILED',
            "'pypdf','reportlab','pdfplumber'",
            'documentTextReturned=$false',
            'providerTouched=$false',
            'ollamaMutationStarted=$false',
            'networkChanged=$false',
            'modelGenerationStarted=$false'
          )){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          'H3_HERMES_PDF_PIP_BOOTSTRAP_PATCH=PASS'

      - name: Commit helper patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Bootstrap pip for H3 Hermes PDF dependencies'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
