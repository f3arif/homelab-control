name: Validate AFZ Agent PowerShell

on:
  push:
    branches: [main]
    paths:
      - '.github/validate-afz-agent-signal.txt'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Parse AFZ agent source
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'afz-openai-agent/AFZ-OpenAI-Agent-v2.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){
            $errors | ForEach-Object { Write-Host ('PARSE_ERROR line=' + $_.Extent.StartLineNumber + ' message=' + $_.Message) }
            exit 1
          }
          Write-Host 'PARSE_OK'
      - name: Parse direct recovery workflow helper
        shell: powershell
        run: |
          $p='afz-openai-agent/Refresh-WindowsMain-DesktopCommanderDeviceCode.ps1'
          if(Test-Path $p){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | ForEach-Object {Write-Host ('HELPER_PARSE_ERROR line='+$_.Extent.StartLineNumber+' message='+$_.Message)};exit 1}
          }
          Write-Host 'HELPER_PARSE_OK'
