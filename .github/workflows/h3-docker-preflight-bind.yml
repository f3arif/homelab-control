name: Bind H3 Docker Desktop Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-docker-preflight-bind.yml'

permissions:
  contents: write

jobs:
  bind:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind typed read-only preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Push-Deploy-Watcher.ps1'
          $text=Get-Content -LiteralPath $p -Raw
          if(-not $text.Contains('$h3DockerPreflightRunner=')){
            $anchor='$h3HermesLastAttempt=[DateTime]::MinValue'
            $idx=$text.IndexOf($anchor,[StringComparison]::Ordinal)
            if($idx -lt 0){throw 'H3 Hermes variable anchor not found'}
            $insert=@(
              '$h3DockerPreflightRunner=Join-Path $InstallRoot ''afz-openai-agent\Invoke-H3-DockerDesktop-Preflight.ps1''',
              '$h3DockerPreflightRequest=Join-Path $InstallRoot ''afz-openai-agent\requests\h3-docker-desktop-preflight.json''',
              '$h3DockerPreflightStateRoot=Join-Path $stateRoot ''jobs\h3-docker-desktop-preflight'''
            ) -join "`n"
            $pos=$idx+$anchor.Length
            $text=$text.Insert($pos,"`n"+$insert)
          }
          if(-not $text.Contains('function Handle-H3DockerDesktopPreflight')){
            $anchor='function Handle-H3HermesRequest{'
            $idx=$text.IndexOf($anchor,[StringComparison]::Ordinal)
            if($idx -lt 0){throw 'H3 Hermes handler anchor not found'}
            $handler=@(
              'function Handle-H3DockerDesktopPreflight{',
              '  if(-not(Test-Path -LiteralPath $h3DockerPreflightRunner -PathType Leaf)){return}',
              '  if(-not(Test-Path -LiteralPath $h3DockerPreflightRequest -PathType Leaf)){return}',
              '  try{',
              '    $req=Get-Content -LiteralPath $h3DockerPreflightRequest -Raw -Encoding UTF8|ConvertFrom-Json',
              '    $id=([string]$req.id).Trim()',
              '    if([int]$req.schema -ne 1 -or [string]$req.action -ne ''preflight-docker-desktop'' -or [string]$req.status -ne ''ACTIVE''){return}',
              '    if([string]$req.target -ne ''h3'' -or [string]$req.host -ne ''DESKTOP-H3R6CQN''){return}',
              '    if(-not [bool]$req.read_only -or [bool]$req.allow_install -or [bool]$req.allow_reboot -or [bool]$req.mutate_ollama){return}',
              '    if($id -notmatch ''^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$''){return}',
              '    $statePath=Join-Path $h3DockerPreflightStateRoot ($id+''.json'')',
              '    if(Test-Path -LiteralPath $statePath -PathType Leaf){',
              '      try{',
              '        $existing=Get-Content -LiteralPath $statePath -Raw -Encoding UTF8|ConvertFrom-Json',
              '        if([string]$existing.classification -in @(''H3_DOCKER_DESKTOP_INSTALL_READY'',''H3_DOCKER_DESKTOP_ALREADY_INSTALLED'',''H3_DOCKER_DESKTOP_INSTALL_BLOCKED'')){return}',
              '      }catch{}',
              '    }',
              '    $raw=(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $h3DockerPreflightRunner -InstallRoot $InstallRoot -RequestPath $h3DockerPreflightRequest 2>&1|Out-String).Trim()',
              '    $code=$LASTEXITCODE',
              '    $classification=''NO_CLASSIFICATION''',
              '    if(-not [string]::IsNullOrWhiteSpace($raw)){try{$classification=[string](($raw|ConvertFrom-Json).classification)}catch{}}',
              '    Log "H3_DOCKER_PREFLIGHT classification=$classification exit=$code source=$(Current-Sha)"',
              '  }catch{Log "H3_DOCKER_PREFLIGHT_ERROR $($_.Exception.Message)"}',
              '}',
              ''
            ) -join "`n"
            $text=$text.Insert($idx,$handler+"`n")
          }
          if(-not $text.Contains("      Handle-H3DockerDesktopPreflight`n      Handle-H3HermesRequest")){
            $anchor='      Handle-H3HermesRequest'
            $idx=$text.IndexOf($anchor,[StringComparison]::Ordinal)
            if($idx -lt 0){throw 'H3 Hermes call anchor not found'}
            $text=$text.Insert($idx,"      Handle-H3DockerDesktopPreflight`n")
          }
          [IO.File]::WriteAllText((Resolve-Path $p),$text,(New-Object Text.UTF8Encoding($false)))

      - name: Parse and enforce safety
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('afz-openai-agent/Push-Deploy-Watcher.ps1','afz-openai-agent/Invoke-H3-DockerDesktop-Preflight.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "$p parse errors: $($errors|ForEach-Object Message|Out-String)"}
          }
          $w=Get-Content 'afz-openai-agent/Push-Deploy-Watcher.ps1' -Raw
          $r=Get-Content 'afz-openai-agent/Invoke-H3-DockerDesktop-Preflight.ps1' -Raw
          foreach($required in @('Handle-H3DockerDesktopPreflight','Invoke-H3-DockerDesktop-Preflight.ps1','h3-docker-desktop-preflight.json','Handle-H3HermesRequest')){if(-not $w.Contains($required)){throw "Watcher invariant missing: $required"}}
          foreach($required in @('[Console]::In.ReadToEnd()','allow_install','allow_reboot','wingetPresent','wslPresent','pendingReboot','freeDiskGb','dockerMutationStarted')){if(-not $r.Contains($required)){throw "Preflight invariant missing: $required"}}
          foreach($forbidden in @('winget install','Start-Service com.docker.service','Restart-Computer','shutdown.exe','ollama pull','/api/generate')){
            if($w.Contains($forbidden)){throw "Forbidden watcher mutation detected: $forbidden"}
          }

      - name: Commit safely
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $p='afz-openai-agent/Push-Deploy-Watcher.ps1'
          git add -- $p
          if(git diff --cached --quiet){Write-Host 'Watcher already bound.'; exit 0}
          git commit -m 'Bind read-only H3 Docker Desktop preflight'
          git pull --rebase origin main
          git push origin HEAD:main
