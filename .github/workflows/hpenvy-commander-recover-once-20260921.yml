name: HP Envy Commander Recover Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpenvy-commander-recover-once-20260921.yml'

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Restart managed Commander and verify guards
        shell: bash
        run: |
          set -euo pipefail
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = "hpenvy"
          test "$(id -un)" = "coolyo"
          uid=$(id -u)
          export XDG_RUNTIME_DIR=/run/user/$uid
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus
          test -S "$XDG_RUNTIME_DIR/bus"

          systemctl --user daemon-reload
          systemctl --user enable afz-desktop-commander.service afz-desktop-commander-watch.timer afz-familyptt-edge-collision-guard.timer >/dev/null
          systemctl --user restart afz-desktop-commander.service
          systemctl --user start afz-desktop-commander-watch.timer afz-familyptt-edge-collision-guard.timer

          sleep 5
          echo "COMMANDER_ACTIVE=$(systemctl --user is-active afz-desktop-commander.service)"
          echo "COMMANDER_ENABLED=$(systemctl --user is-enabled afz-desktop-commander.service)"
          echo "WATCH_ACTIVE=$(systemctl --user is-active afz-desktop-commander-watch.timer)"
          echo "WATCH_ENABLED=$(systemctl --user is-enabled afz-desktop-commander-watch.timer)"
          echo "COLLISION_ACTIVE=$(systemctl --user is-active afz-familyptt-edge-collision-guard.timer)"
          echo "COLLISION_ENABLED=$(systemctl --user is-enabled afz-familyptt-edge-collision-guard.timer)"
          echo "COMMANDER_MAINPID=$(systemctl --user show afz-desktop-commander.service -p MainPID --value)"
          pgrep -af 'desktop-commander|wonderwhy-er' || true
          ip -4 addr show dev eno1 | grep '192.168.50.68/24'
          docker ps --filter name=afz-familyptt-edge-failover --format 'EDGE_CONTAINER={{.Status}}'
          curl -ksS --max-time 6 --resolve ptt-api.afzeng.ca:443:192.168.50.68 -o /dev/null -w 'EDGE_API_HTTP=%{http_code}\n' https://ptt-api.afzeng.ca/health
          curl -ksS --max-time 6 --resolve ptt-livekit.afzeng.ca:443:192.168.50.68 -o /dev/null -w 'EDGE_LIVEKIT_HTTP=%{http_code}\n' https://ptt-livekit.afzeng.ca/
          REMOTE
          )
          printf '%s\n' "$remote_script" | tailscale ssh coolyo@100.71.26.69 'bash -s'
