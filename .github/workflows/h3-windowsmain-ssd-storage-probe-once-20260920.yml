name: H3 Windows Main SSD Storage Probe Once 20260920

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-windowsmain-ssd-storage-probe-once-20260920.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Expiry guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -u -d '2026-09-20T07:20:00Z' +%s)"
          test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Join AFZ tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy
      - name: Probe H3 read-only storage surfaces
        shell: bash
        run: |
          set +e
          host=100.106.186.118
          echo 'AFZ_H3_WINDOWSMAIN_SSD_STORAGE_PROBE_V1'
          tailscale ping --timeout=5s -c 1 "$host" || true
          for p in 22 80 111 139 443 445 873 2049 5985 5986 8080 9119; do
            if timeout 3 bash -c "</dev/tcp/$host/$p" 2>/dev/null; then
              echo "TCP_$p=OPEN"
            else
              echo "TCP_$p=CLOSED_OR_FILTERED"
            fi
          done
          echo 'FINAL_CLASSIFICATION=AFZ_H3_WINDOWSMAIN_SSD_STORAGE_PROBE_COMPLETE'
