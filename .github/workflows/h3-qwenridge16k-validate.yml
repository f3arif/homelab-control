name: Validate H3 Qwen Ridge16K Lane

on:
  pull_request:
    paths:
      - 'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1'
      - 'afz-openai-agent/Bootstrap-H3-QwenRidge16K-WebsiteTest.ps1'
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - 'afz-openai-agent/tools/Run-WindowsMain-H3-QwenRidge16K-Carrier.ps1'
      - 'afz-openai-agent/tools/Launch-H3-QwenRidge16K-WebsiteTest.ps1'
      - 'afz-openai-agent/tools/Start-H3-QwenRidge16K-WebsiteTest.ps1'
      - 'afz-openai-agent/requests/h3-qwenridge16k-website-test.json'
      - '.github/workflows/h3-qwenridge16k-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell with Windows PowerShell AST
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1',
            'afz-openai-agent/Bootstrap-H3-QwenRidge16K-WebsiteTest.ps1',
            'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1',
            'afz-openai-agent/tools/Run-WindowsMain-H3-QwenRidge16K-Carrier.ps1',
            'afz-openai-agent/tools/Launch-H3-QwenRidge16K-WebsiteTest.ps1',
            'afz-openai-agent/tools/Start-H3-QwenRidge16K-WebsiteTest.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $errors|ForEach-Object {Write-Host $_.Message -ForegroundColor Red}
              throw "PowerShell parse failure: $file"
            }
          }

      - name: Assert typed request and execution boundaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $request=Get-Content 'afz-openai-agent/requests/h3-qwenridge16k-website-test.json' -Raw|ConvertFrom-Json
          if([int]$request.schema -ne 1){throw 'schema must be 1'}
          if([string]$request.project -ne 'qwen38-ridge16k-website-direct-test'){throw 'unexpected project'}
          if([string]$request.job_id -ne 'qwenridge16k-website-20260828-r1'){throw 'transport recovery must preserve the model job id'}
          if([string]$request.model -ne 'qwen3.8-ridge:27b-16k'){throw 'unexpected model'}
          if([int]$request.context -ne 16384){throw 'context must be 16384'}
          if(-not [bool]$request.no_think){throw 'no_think must be true'}
          if([int]$request.max_model_calls -ne 1){throw 'max_model_calls must be 1'}
          if([int]$request.recovery_generation -ne 6){throw 'hardening must not advance recovery_generation beyond 6'}
          $expected=@('/','/services','/projects','/about','/contact')
          $routes=@($request.required_routes|ForEach-Object {[string]$_})
          if($routes.Count -ne 5){throw 'five routes required'}
          foreach($route in $expected){if($routes -notcontains $route){throw "missing route $route"}}

          $watcher=Get-Content 'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1' -Raw
          $bootstrap=Get-Content 'afz-openai-agent/Bootstrap-H3-QwenRidge16K-WebsiteTest.ps1' -Raw
          $sync=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          $carrier=Get-Content 'afz-openai-agent/tools/Run-WindowsMain-H3-QwenRidge16K-Carrier.ps1' -Raw
          $launcher=Get-Content 'afz-openai-agent/tools/Launch-H3-QwenRidge16K-WebsiteTest.ps1' -Raw
          $runner=Get-Content 'afz-openai-agent/tools/Start-H3-QwenRidge16K-WebsiteTest.ps1' -Raw
          $all=$watcher+"`n"+$bootstrap+"`n"+$sync+"`n"+$carrier+"`n"+$launcher+"`n"+$runner

          foreach($needle in @(
            'DESKTOP-10SKF0M',
            'DESKTOP-H3R6CQN',
            'Faiz@100.106.186.118',
            'qwen3.8-ridge:27b-16k',
            '16384',
            'h3-qwenridge16k-website-test.json',
            'h3-direct-results',
            '[STATUS][H3-RIDGE16K]',
            'Path]::IsPathRooted',
            'think=$false',
            '/no_think',
            'StrictHostKeyChecking=yes',
            'transport-recovery-g',
            'AFZ Edge Backup',
            'AFZ H3 Qwen Ridge16K Transport',
            'AFZ H3 Qwen Ridge16K Runner',
            'LogonType Interactive',
            'execution_context=''h3-interactive-user''',
            '[System.Security.Principal.WindowsIdentity]::GetCurrent().Name',
            'contents/${Path}?ref=${Ref}',
            'contents/${Path}?ref=${resultBranch}',
            'pre_ollama',
            'ollama_post_started',
            'ollama_post_returned',
            'model_call_attempted'
          )){if(-not $all.Contains($needle)){throw "Required boundary missing: $needle"}}

          if($runner -notmatch 'max_model_calls' -or $runner -notmatch 'num_ctx=\$context' -or $runner -notmatch 'num_predict=11000'){
            throw 'Runner missing bounded one-call/context generation contract.'
          }
          if($launcher -notmatch 'GitHub contents URL compatibility patch' -or $launcher -notmatch '\$runnerText\.Replace'){
            throw 'H3 launcher missing exact-SHA GitHub contents URL compatibility normalization.'
          }
          if($launcher -notmatch 'phase-evidence compatibility patch' -or $launcher -notmatch 'ollama_request_written_at'){
            throw 'H3 launcher missing durable Ollama phase evidence injection.'
          }
          if($launcher -notmatch 'Register-ScheduledTask' -or $launcher -notmatch 'Start-ScheduledTask' -or $launcher -notmatch 'New-ScheduledTaskPrincipal'){
            throw 'H3 Interactive scheduled-task carrier boundary missing.'
          }
          if($launcher -match '\$env:USERDOMAIN\\\$env:USERNAME'){
            throw 'H3 task principal must not depend on SSH-session USERDOMAIN/USERNAME environment variables.'
          }
          if($launcher -match 'New-ScheduledTaskTrigger'){
            throw 'H3 Ridge16K carrier must remain triggerless.'
          }
          if($bootstrap -notmatch "status -notin @\('running','completed'\)" -or $bootstrap -notmatch "status -in @\('running','completed','failed'\)"){
            throw 'Bootstrap must classify proven H3 running state as successful transport launch.'
          }
          if($bootstrap -notmatch 'Register-ScheduledTask' -or $bootstrap -notmatch 'Start-ScheduledTask' -or $bootstrap -notmatch '\.Principal'){
            throw 'Dedicated windows-main Interactive transport task boundary missing.'
          }
          if($bootstrap -match 'New-ScheduledTaskTrigger'){
            throw 'Dedicated windows-main Ridge16K transport must remain triggerless.'
          }
          foreach($mutation in @('Set-ScheduledTask','Enable-ScheduledTask','Disable-ScheduledTask')){
            if($bootstrap -match [regex]::Escape($mutation)){throw "Shared carrier mutation primitive must not be present: $mutation"}
          }
          if($carrier -notmatch 'StrictHostKeyChecking=yes'){
            throw 'Strict SSH host-key boundary missing.'
          }
          if($sync -notmatch "status -in @\('failed','error'\)" -or $sync -notmatch 'transport-recovery-g'){
            throw 'One-shot pre-launch transport recovery migration missing.'
          }
          foreach($forbidden in @('Invoke-Expression','iex ','cmd.exe /c','SharePoint')){
            if($all -match [regex]::Escape($forbidden)){throw "Forbidden primitive/transport found: $forbidden"}
          }
