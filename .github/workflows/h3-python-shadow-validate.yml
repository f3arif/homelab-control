name: H3 Python Shadow Foundation Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/h3-python-worker/**'
      - '.github/workflows/h3-python-shadow-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test
        shell: pwsh
        run: |
          cd afz-openai-agent/h3-python-worker
          python -m compileall -q afz_h3_worker shadow_probe.py tests
          python -m unittest discover -s tests -v
      - name: Verify non-authoritative safety contract
        shell: python
        run: |
          import ast
          from pathlib import Path

          root=Path('afz-openai-agent/h3-python-worker')
          py=list(root.rglob('*.py'))
          parsed={}
          imports_by_path={}
          network_roots={'socket','http','urllib','requests','httpx','aiohttp','websocket','websockets'}

          for path in py:
              text=path.read_text(encoding='utf-8')
              tree=ast.parse(text, filename=str(path))
              parsed[path]=tree
              imports=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      imports.update(n.name for n in node.names)
                  elif isinstance(node,ast.ImportFrom) and node.module:
                      imports.add(node.module)
              imports_by_path[path]=imports
              roots={name.split('.',1)[0] for name in imports}
              if path.name!='process.py' and 'subprocess' in roots:
                  raise SystemExit(f'subprocess import outside central wrapper: {path}')
              if roots & network_roots:
                  raise SystemExit(f'network import forbidden in staged R3: {path}: {sorted(roots & network_roots)}')

          proc=(root/'afz_h3_worker/process.py').read_text(encoding='utf-8')
          for needle in ['CREATE_NO_WINDOW','GIT_TERMINAL_PROMPT','GCM_INTERACTIVE','shell=False','taskkill.exe','/T','/F']:
              if needle not in proc: raise SystemExit(f'process invariant missing: {needle}')

          probe_path=root/'shadow_probe.py'
          probe_tree=parsed[probe_path]
          forbidden_calls={'Popen','run_process','CreateProcess','system','popen','urlopen','request','post','put','delete'}
          forbidden_authority_constants={'Register-ScheduledTask','Start-ScheduledTask','Stop-ScheduledTask','Unregister-ScheduledTask'}
          for node in ast.walk(probe_tree):
              if isinstance(node,ast.Call):
                  fn=node.func
                  name=fn.id if isinstance(fn,ast.Name) else fn.attr if isinstance(fn,ast.Attribute) else ''
                  if name in forbidden_calls:
                      raise SystemExit(f'shadow probe gained execution/network call: {name}')
              elif isinstance(node,ast.Constant) and isinstance(node.value,str) and node.value in forbidden_authority_constants:
                  raise SystemExit(f'shadow probe gained authority constant: {node.value}')

          contracts_path=root/'afz_h3_worker/contracts.py'
          contracts_tree=parsed[contracts_path]
          contract_constants={}
          for node in contracts_tree.body:
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
                  try: contract_constants[node.targets[0].id]=ast.literal_eval(node.value)
                  except Exception: pass
          expected_contract_constants={
              'CLAIM_SCHEMA_KNOWN': True,
              'LEASE_RENEWAL_SCHEMA_KNOWN': False,
              'LEASE_SECONDS_DEFAULT': 60,
              'LEASE_SECONDS_MIN': 15,
              'LEASE_SECONDS_MAX': 7200,
              'CONTROL_HUB_WORKER_HEARTBEAT_PATH': '/api/workers/{worker_id}/heartbeat',
              'CONTROL_HUB_WORKER_CLAIM_PATH': '/api/workers/{worker_id}/claim',
              'CONTROL_HUB_JOB_COMPLETE_PATH': '/api/jobs/{job_id}/complete',
              'DIRECT_GATEWAY_CLAIM_PATH': '/claim',
              'DIRECT_GATEWAY_COMPLETE_PATH': '/complete',
          }
          for name,value in expected_contract_constants.items():
              if contract_constants.get(name)!=value:
                  raise SystemExit(f'R3 contract invariant failed: {name}={contract_constants.get(name)!r}')

          staged_paths=[contracts_path,root/'afz_h3_worker/transport.py']
          forbidden_live_literals=('http://','https://','X-AFZ-Token','AFZ_HUB_TOKEN')
          for path in staged_paths:
              for node in ast.walk(parsed[path]):
                  if isinstance(node,ast.Constant) and isinstance(node.value,str):
                      if any(value in node.value for value in forbidden_live_literals):
                          raise SystemExit(f'live transport/config literal forbidden in R3: {path}')

          transport_path=root/'afz_h3_worker/transport.py'
          transport_tree=parsed[transport_path]
          unbound=None
          for node in transport_tree.body:
              if isinstance(node,ast.ClassDef) and node.name=='UnboundControlHubTransport':
                  unbound=node
          if unbound is None:
              raise SystemExit('UnboundControlHubTransport missing')
          class_constants={}
          methods={}
          for node in unbound.body:
              if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
                  try: class_constants[node.targets[0].id]=ast.literal_eval(node.value)
                  except Exception: pass
              elif isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  methods[node.name]=node
          expected_unbound={
              'network_enabled': False,
              'claim_schema_known': True,
              'lease_renewal_schema_known': False,
              'routing_authority': False,
              'scheduling_authority': False,
          }
          for name,value in expected_unbound.items():
              if class_constants.get(name)!=value:
                  raise SystemExit(f'Unbound transport invariant failed: {name}={class_constants.get(name)!r}')
          for name in ('health','heartbeat','claim','complete','renew_lease'):
              if name not in methods:
                  raise SystemExit(f'Unbound transport method missing: {name}')
              if not any(isinstance(node,ast.Raise) for node in ast.walk(methods[name])):
                  raise SystemExit(f'Unbound transport method must fail closed: {name}')

          readme=(root/'README.md').read_text(encoding='utf-8')
          for needle in [
              'NON-AUTHORITATIVE',
              'Control Hub / PostgreSQL / Direct Fabric',
              'OneDrive / SharePoint remains emergency fallback only',
              'Prefect is not introduced',
              'CLAIM_SCHEMA_KNOWN=True',
              'LEASE_RENEWAL_SCHEMA_KNOWN=False',
              'no lease-renew endpoint',
              'network_enabled=False',
              'python.exe',
              'WinSW or NSSM',
              'Do not use `pythonw.exe`',
          ]:
              if needle not in readme: raise SystemExit(f'architecture invariant missing: {needle}')
          print('H3_PYTHON_SHADOW_SAFETY=PASS')
