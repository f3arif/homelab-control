name: H3 Hermes R37 Watcher Hot Reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-r37-watcher-hotreload.yml'

permissions:
  contents: write

jobs:
  hotreload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase current main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Confirm R37 remains active
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('afz-openai-agent/requests/h3-hermes-agent-install.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['id']=='h3-hermes-chat-gateway-recovery-20260903-r37'
          assert r['action']=='install-and-configure'
          assert r['status']=='ACTIVE'
          assert r['target']=='h3' and r['host']=='DESKTOP-H3R6CQN'
          assert r['run_chat_canary'] is True
          assert r['refresh_gateway_after_canary'] is True

      - name: Change only watcher hot-reload marker
        shell: python
        run: |
          from pathlib import Path
          p=Path('afz-openai-agent/Push-Deploy-Watcher.ps1')
          s=p.read_text(encoding='utf-8')
          old='# HOTRELOAD_CANARY=20260901T0410Z h3-docker-preflight-binding'
          new='# HOTRELOAD_CANARY=20260903T2108Z h3-hermes-r37-recovery'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one old marker, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')

      - name: Validate watcher syntax and scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Push-Deploy-Watcher.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Watcher parse failed'}
          $d=git diff -- $p
          if($d -notmatch 'HOTRELOAD_CANARY=20260903T2108Z h3-hermes-r37-recovery'){throw 'New marker missing'}
          if((git diff --numstat -- $p) -notmatch '^1\s+1\s+'){throw 'Watcher change is not exactly one-line replacement'}
          'H3_R37_WATCHER_HOTRELOAD_VALIDATE=PASS'

      - name: Commit patch and signal exact SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Push-Deploy-Watcher.ps1
          git commit -m 'Hot-reload watcher for Hermes r37 recovery'
          patch_sha=$(git rev-parse HEAD)
          printf '%s\n' "$patch_sha" > .github/afz-agent-deploy-signal.txt
          git add .github/afz-agent-deploy-signal.txt
          git commit -m 'Signal Hermes r37 watcher hot-reload'
          git push origin HEAD:main
          echo "H3_R37_WATCHER_HOTRELOAD_SHA=$patch_sha"
