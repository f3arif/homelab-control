name: AFZ Blog Production Sync Hook Validate

on:
  push:
    branches:
      - chatgpt/afz-blog-prod-deploy-sync-hook
    paths:
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - '.github/workflows/afz-blog-prod-sync-hook-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse fresh sync wrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw "Parse errors: $($errors.Message -join '; ')"}
          Write-Host 'PARSE_PASS'

      - name: Verify production deploy hook invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $text=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          foreach($needle in @(
            'AFZ_BLOG_PRODUCTION_DEPLOY_SYNC_HOOK_V1',
            'Invoke-AFZBlog-ProductionDeploy.ps1',
            'afz-blog-production-deploy.json',
            '-InstallRoot $InstallRoot',
            '-RequestPath $blogProductionDeployRequest'
          )){
            if(-not $text.Contains($needle)){throw "Missing sync-hook invariant: $needle"}
          }
          $marker='AFZ_BLOG_PRODUCTION_DEPLOY_SYNC_HOOK_V1'
          if(([regex]::Matches($text,[regex]::Escape($marker))).Count -ne 1){
            throw 'Production deploy sync hook must occur exactly once.'
          }
          Write-Host 'SYNC_HOOK_SAFETY_PASS'
