name: H3 Hermes R33 Priority Chat Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-r32-chat-gateway-repair.yml'

permissions:
  contents: write

concurrency:
  group: h3-hermes-r33-priority-chat-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make chat recovery priority and completion-aware
        shell: python
        run: |
          from pathlib import Path
          import json

          install = Path('afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1')
          text = install.read_text(encoding='utf-8')
          anchor = "$refreshGatewayAfterCanary=($req.PSObject.Properties.Name -contains 'refresh_gateway_after_canary' -and [bool]$req.refresh_gateway_after_canary)\n"
          addition = anchor + "$priorityChatRecovery=($runChatCanary -and $refreshGatewayAfterCanary)\n"
          if '$priorityChatRecovery=' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected one r32 guard anchor, got {text.count(anchor)}')
              text = text.replace(anchor, addition, 1)

          hook_start = "foreach($hook in @(\n  [ordered]@{script='Invoke-H3-Hermes-PdfRuntimeAudit.ps1';request='h3-hermes-pdf-runtime-audit.json'},"
          if 'if(-not $priorityChatRecovery){\nforeach($hook in @(' not in text:
              if text.count(hook_start) != 1:
                  raise SystemExit(f'Expected one auxiliary hook block, got {text.count(hook_start)}')
              text = text.replace(hook_start, "if(-not $priorityChatRecovery){\n" + hook_start, 1)
              hook_end = "}\n\nfunction Save-Result($result){"
              if text.count(hook_end) != 1:
                  raise SystemExit(f'Expected one hook end marker, got {text.count(hook_end)}')
              text = text.replace(hook_end, "}\n}\n\nfunction Save-Result($result){", 1)
          install.write_text(text, encoding='utf-8', newline='\n')

          watcher = Path('afz-openai-agent/Push-Deploy-Watcher.ps1')
          w = watcher.read_text(encoding='utf-8')
          old = "if([bool]$existing.ok -and [string]$existing.classification -eq 'HERMES_READY_LOCAL_OLLAMA_64K' -and -not $pdfAuxPending){return}"
          new = "if([bool]$existing.ok -and [string]$existing.classification -in @('HERMES_READY_LOCAL_OLLAMA_64K','HERMES_OLLAMA_FRESH_LIVENESS_READY','HERMES_OLLAMA_CHAT_AND_TELEGRAM_GATEWAY_READY') -and -not $pdfAuxPending){return}"
          if new not in w:
              if w.count(old) != 1:
                  raise SystemExit(f'Expected one Hermes completion guard, got {w.count(old)}')
              w = w.replace(old, new, 1)
          watcher.write_text(w, encoding='utf-8', newline='\n')

          reqp = Path('afz-openai-agent/requests/h3-hermes-agent-install.json')
          req = json.loads(reqp.read_text(encoding='utf-8'))
          req['id'] = 'h3-hermes-chat-gateway-recovery-20260903-r33'
          req['run_chat_canary'] = True
          req['refresh_gateway_after_canary'] = True
          reqp.write_text(json.dumps(req, indent=2) + '\n', encoding='utf-8', newline='\n')

      - name: Parse and validate r33
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1','afz-openai-agent/Push-Deploy-Watcher.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("${path}: "+$_.Message)};throw 'r33 parse failed'}
          }
          $i=Get-Content 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1' -Raw
          foreach($required in @('$priorityChatRecovery','if(-not $priorityChatRecovery)','H3-Hermes-Ollama-LivenessRecovery.ps1','bounded-chat-canary')){if(-not $i.Contains($required)){throw "Missing installer invariant: $required"}}
          $w=Get-Content 'afz-openai-agent/Push-Deploy-Watcher.ps1' -Raw
          foreach($required in @('HERMES_OLLAMA_FRESH_LIVENESS_READY','HERMES_OLLAMA_CHAT_AND_TELEGRAM_GATEWAY_READY')){if(-not $w.Contains($required)){throw "Missing completion classification: $required"}}
          $r=Get-Content 'afz-openai-agent/requests/h3-hermes-agent-install.json' -Raw|ConvertFrom-Json
          if($r.id -ne 'h3-hermes-chat-gateway-recovery-20260903-r33' -or -not $r.run_chat_canary -or -not $r.refresh_gateway_after_canary){throw 'r33 request mismatch'}
          if($r.mutate_ollama -or $r.expose_api){throw 'r33 forbidden mutation'}
          'H3_HERMES_R33_PATCH=PASS'

      - name: Commit r33 on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1 afz-openai-agent/Push-Deploy-Watcher.ps1 afz-openai-agent/requests/h3-hermes-agent-install.json
          git commit -m 'Prioritize Hermes chat recovery and stop completed reruns'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
