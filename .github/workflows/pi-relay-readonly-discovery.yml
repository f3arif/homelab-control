name: Pi Relay Read Only Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pi-relay-readonly-discovery.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Discover Raspberry Pi relay without mutation
        shell: bash
        run: |
          set +e
          host=100.91.50.9
          echo '=== TAILSCALE STATUS ==='
          tailscale status | grep -E '100[.]91[.]50[.]9|raspi-1' || true
          echo '=== TAILSCALE PING ==='
          tailscale ping --timeout=5s -c 2 "$host"
          echo "TAILSCALE_PING_EXIT=$?"
          echo '=== TCP PORTS ==='
          for p in 22 80 443 8081 8082 8443; do
            if timeout 4 bash -c "</dev/tcp/$host/$p" 2>/dev/null; then
              echo "TCP_$p=OPEN"
            else
              echo "TCP_$p=CLOSED_OR_FILTERED"
            fi
          done
          echo '=== READ-ONLY TAILSCALE SSH HOSTNAME ==='
          for user in pi faiz root; do
            echo "SSH_USER=$user"
            timeout 12s tailscale ssh "$user@$host" hostname 2>&1
            echo "SSH_${user}_EXIT=$?"
          done
          exit 0
