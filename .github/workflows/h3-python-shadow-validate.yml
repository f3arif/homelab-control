name: H3 Python Shadow Foundation Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/h3-python-worker/**'
      - '.github/workflows/h3-python-shadow-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test
        shell: pwsh
        run: |
          cd afz-openai-agent/h3-python-worker
          python -m compileall -q afz_h3_worker shadow_probe.py tests
          python -m unittest discover -s tests -v
      - name: Verify non-authoritative safety contract
        shell: python
        run: |
          import ast
          from pathlib import Path
          root=Path('afz-openai-agent/h3-python-worker')
          py=list(root.rglob('*.py'))
          for path in py:
              text=path.read_text(encoding='utf-8')
              tree=ast.parse(text, filename=str(path))
              imports={}
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for n in node.names: imports[n.asname or n.name]=n.name
                  elif isinstance(node,ast.ImportFrom) and node.module:
                      imports[node.module]=node.module
              if path.name!='process.py' and any(v=='subprocess' for v in imports.values()):
                  raise SystemExit(f'subprocess import outside central wrapper: {path}')
          proc=(root/'afz_h3_worker/process.py').read_text(encoding='utf-8')
          for needle in ['CREATE_NO_WINDOW','GIT_TERMINAL_PROMPT','GCM_INTERACTIVE','shell=False','taskkill.exe','/T','/F']:
              if needle not in proc: raise SystemExit(f'process invariant missing: {needle}')
          probe=(root/'shadow_probe.py').read_text(encoding='utf-8')
          for forbidden in ['subprocess','/claim','/complete','ScheduledTask','Register-ScheduledTask','Start-ScheduledTask','Stop-ScheduledTask']:
              if forbidden in probe: raise SystemExit(f'shadow probe gained execution authority: {forbidden}')
          readme=(root/'README.md').read_text(encoding='utf-8')
          for needle in ['NON-AUTHORITATIVE','Control Hub / PostgreSQL / Direct Fabric','OneDrive / SharePoint remains emergency fallback only','Prefect is not introduced','python.exe','WinSW or NSSM','Do not use `pythonw.exe`']:
              if needle not in readme: raise SystemExit(f'architecture invariant missing: {needle}')
          print('H3_PYTHON_SHADOW_SAFETY=PASS')
