name: H3 Hermes R32 Chat Gateway Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-r32-chat-gateway-repair.yml'

permissions:
  contents: write

concurrency:
  group: h3-hermes-r32-chat-gateway-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch r32 bounded chat canary and post-canary gateway refresh
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1')
          text = p.read_text(encoding='utf-8')

          guard = "if(-not [bool]$req.publish_result -or -not [bool]$req.emergency_diagnostic_ack){throw 'H3 Hermes provider repair publish policy mismatch.'}\n"
          guard_add = guard + "$runChatCanary=($req.PSObject.Properties.Name -contains 'run_chat_canary' -and [bool]$req.run_chat_canary)\n$refreshGatewayAfterCanary=($req.PSObject.Properties.Name -contains 'refresh_gateway_after_canary' -and [bool]$req.refresh_gateway_after_canary)\nif(-not $runChatCanary -or -not $refreshGatewayAfterCanary){throw 'H3 Hermes r32 chat/gateway recovery guards mismatch.'}\n"
          if text.count(guard) != 1:
              raise SystemExit(f'Expected one publish guard, got {text.count(guard)}')
          text = text.replace(guard, guard_add, 1)

          marker = "$o=[ordered]@{\n  schema=1;purpose='EMERGENCY_DIAGNOSTIC_ACK_ONLY';controlPlane='github';source='windows-main';target='h3';host='DESKTOP-H3R6CQN';jobId=$id;\n"
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one final result marker, got {text.count(marker)}')
          recovery = Path('.github/h3-hermes-r32-recovery.fragment.ps1').read_text(encoding='utf-8')
          text = text.replace(marker, recovery + marker, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          reqp = Path('afz-openai-agent/requests/h3-hermes-agent-install.json')
          req = json.loads(reqp.read_text(encoding='utf-8'))
          req['id'] = 'h3-hermes-chat-gateway-recovery-20260903-r32'
          req['run_chat_canary'] = True
          req['refresh_gateway_after_canary'] = True
          reqp.write_text(json.dumps(req, indent=2) + '\n', encoding='utf-8', newline='\n')

      - name: Parse PowerShell and enforce r32 invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'r32 parse failed'}
          $c=Get-Content $path -Raw
          foreach($required in @('H3-Hermes-Ollama-LivenessRecovery.ps1','run_chat_canary','refresh_gateway_after_canary','bounded-chat-canary','HERMES_R32_CHAT_RECOVERY_INVALID_RESULT')){if(-not $c.Contains($required)){throw "Missing r32 invariant: $required"}}
          $r=Get-Content 'afz-openai-agent/requests/h3-hermes-agent-install.json' -Raw|ConvertFrom-Json
          if($r.id -ne 'h3-hermes-chat-gateway-recovery-20260903-r32' -or -not $r.run_chat_canary -or -not $r.refresh_gateway_after_canary){throw 'r32 request mismatch'}
          if($r.mutate_ollama -or $r.expose_api){throw 'r32 forbidden mutation'}
          'H3_HERMES_R32_PATCH=PASS'

      - name: Commit r32 repair on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1 afz-openai-agent/requests/h3-hermes-agent-install.json
          git commit -m 'Run Hermes chat canary before Telegram gateway refresh'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
