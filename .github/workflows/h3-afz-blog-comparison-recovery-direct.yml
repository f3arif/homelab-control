name: H3 AFZ Blog Comparison Recovery Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/h3-afz-blog-comparison-recovery-direct.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: h3-afz-blog-comparison-recovery-direct
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate guarded recovery signal
        shell: bash
        run: |
          set -euo pipefail
          f='.github/h3-afz-blog-comparison-recovery-direct.txt'
          grep -Fx 'target=h3' "$f"
          grep -Fx 'job=afz-blog-qwen35b-vs-ridge27b-20260902-r1' "$f"
          grep -Fx 'action=recover-saved-35b-then-run-ridge-only-if-unattempted' "$f"
          grep -Fx 'replay_35b=false' "$f"
          grep -Fx 'publish_article=false' "$f"
          grep -Fx 'production_db_mutation=false' "$f"

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Inventory relevant tailnet peers
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json > /tmp/ts-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ts-status.json'))
          wanted=('h3','hpenvy','desktop-10skf0m','windows-main','raspberry','pi','lenovo','hplaptop')
          rows=[]
          for p in (d.get('Peer') or {}).values():
              host=(p.get('HostName') or '').lower()
              dns=(p.get('DNSName') or '').lower()
              if any(x in host or x in dns for x in wanted):
                  rows.append((p.get('HostName'),bool(p.get('Online')),','.join(p.get('TailscaleIPs') or [])))
          for host,online,ips in sorted(rows,key=lambda x:(x[0] or '')):
              print(f'TAILNET_PEER host={host} online={str(online).lower()} ips={ips}')
          PY

      - name: Wake H3 if needed and prove SSH
        shell: bash
        run: |
          set -u
          if nc -z -w 3 100.106.186.118 22; then
            echo 'H3_SSH_REACHABLE=PASS already-online'
            exit 0
          fi

          echo 'H3 SSH offline; trying existing Pi WoL service opportunistically.'
          if curl --silent --show-error --fail-with-body --max-time 8 http://100.91.50.9:8087/wake/h3; then
            echo
            echo 'PI_WOL_REQUEST=PASS'
          else
            echo 'PI_WOL_REQUEST=UNAVAILABLE'
          fi

          echo 'Trying HP Envy LAN WoL relay.'
          wol_script=$(cat <<'REMOTE'
          import socket,time
          mac='4C:ED:FB:3F:B0:9E'
          raw=bytes.fromhex(mac.replace(':',''))
          packet=b'\xff'*6 + raw*16
          sent=[]
          for dest in [('192.168.50.255',9),('192.168.50.255',7)]:
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
              s.setsockopt(socket.SOL_SOCKET,socket.SO_BROADCAST,1)
              try:
                  for _ in range(5):
                      s.sendto(packet,dest)
                      time.sleep(0.25)
                  sent.append(f'{dest[0]}:{dest[1]}')
              finally:
                  s.close()
          print('HPENVY_H3_WOL_SENT='+','.join(sent))
          REMOTE
          )
          if printf '%s\n' "$wol_script" | timeout 25s tailscale ssh coolyo@100.71.26.69 'python3 -'; then
            echo 'HPENVY_WOL_RELAY=PASS'
          else
            code=$?
            echo "HPENVY_WOL_RELAY=UNAVAILABLE exit=$code"
          fi

          for attempt in $(seq 1 36); do
            if nc -z -w 3 100.106.186.118 22; then
              echo "H3_SSH_REACHABLE=PASS attempt=$attempt"
              exit 0
            fi
            sleep 5
          done
          echo 'H3_SSH_REACHABLE=FAIL_NO_AVAILABLE_WAKE_RELAY' >&2
          exit 1

      - name: Launch exact-SHA guarded H3 recovery
        env:
          AFZ_SHA: ${{ github.sha }}
          JOB_ID: afz-blog-qwen35b-vs-ridge27b-20260902-r1
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/f3arif/homelab-control/${AFZ_SHA}/afz-openai-agent/tools/Launch-H3-AFZBlog-ModelComparisonRecovery.ps1"
          remote="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \"\$ProgressPreference='SilentlyContinue'; \$script=(Invoke-WebRequest -UseBasicParsing -Headers @{'Cache-Control'='no-cache'} '$url').Content; \$tmp=Join-Path \$env:TEMP 'AFZ-Blog-Recovery-Direct-${AFZ_SHA}.ps1'; [IO.File]::WriteAllText(\$tmp,\$script,(New-Object Text.UTF8Encoding(\$false))); try { & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \$tmp -ExpectedSha '${AFZ_SHA}' -JobId '${JOB_ID}'; exit \$LASTEXITCODE } finally { Remove-Item \$tmp -Force -ErrorAction SilentlyContinue }\""
          timeout 120s tailscale ssh Faiz@100.106.186.118 "$remote"

      - name: Record launch contract
        shell: bash
        run: |
          echo '35B replay: forbidden'
          echo 'Ridge call: allowed only if H3 prior state proves attempted=false'
          echo 'Article publish: disabled'
          echo 'Production DB mutation: disabled'
