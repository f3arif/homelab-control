[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afz-hermes-autopilot-control-adapter"
version = "0.1.0"
description = "Fail-closed typed Control Hub adapter around the verified AFZ MissionEngine"
requires-python = ">=3.11"
dependencies = ["cryptography>=45,<51"]

[project.scripts]
afz-autopilot-health-canary = "afz_hermes_autopilot.canary_cli:main"
afz-autopilot-health-verify = "afz_hermes_autopilot.verifier_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
