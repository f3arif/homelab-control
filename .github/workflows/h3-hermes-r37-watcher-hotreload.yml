name: H3 Hermes R37 Watcher Hot Reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-r37-watcher-hotreload.yml'

permissions:
  contents: write

jobs:
  hotreload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase current main
        run: git pull --rebase origin main

      - name: Confirm monotonic supersession
        run: |
          test "$(tr -d '\r\n' < .github/afz-agent-deploy-signal.txt)" = '4edf15e2948fcdd4fc6733ab9ae961adc8f4307b'
          git merge-base --is-ancestor 868cd0ee84a47170e6c47fc0ab403c12d0920f64 4edf15e2948fcdd4fc6733ab9ae961adc8f4307b

      - name: Patch fresh sync wrapper
        run: python .github/scripts/patch_stale_exact_sha_unpin.py

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw 'Sync wrapper parse failed'}
          if((Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw) -notmatch 'MONOTONIC_STALE_EXACT_SHA_UNPIN_V1'){throw 'Unpin marker missing'}

      - name: Commit bootstrap patch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1
          git commit -m 'Unpin superseded exact-SHA updater monotonically'
          test "$(tr -d '\r\n' < .github/afz-agent-deploy-signal.txt)" = '4edf15e2948fcdd4fc6733ab9ae961adc8f4307b'
          git push origin HEAD:main
