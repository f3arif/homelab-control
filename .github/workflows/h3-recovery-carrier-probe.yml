name: H3 Recovery Carrier Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  probe:
    if: ${{ github.event.issue.title == 'AFZ-H3-RECOVERY-CARRIER-DEFAULT-CONTEXT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Probe H3 recovery carriers read only
        id: carrier
        if: ${{ steps.tailscale.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          ip=100.106.186.118
          {
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            tailscale ping --timeout=5s -c 2 "$ip" || true
            for p in 22 135 139 445 3389 5985 5986 8788 8789 8790 8791 8795 8796 8797; do
              if timeout 3 bash -c "</dev/tcp/$ip/$p" 2>/dev/null; then
                echo "PORT_$p=OPEN"
              else
                echo "PORT_$p=CLOSED_OR_FILTERED"
              fi
            done
          } | tee /tmp/h3-probe.txt

      - name: Report result to trigger issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          TS_OUTCOME: ${{ steps.tailscale.outcome }}
          CARRIER_OUTCOME: ${{ steps.carrier.outcome }}
        shell: bash
        run: |
          {
            echo "H3 carrier probe result"
            echo
            echo "event: ${{ github.event_name }}"
            echo "ref: ${{ github.ref }}"
            echo "tailscale: $TS_OUTCOME"
            echo "carrier: $CARRIER_OUTCOME"
            if [ -f /tmp/h3-probe.txt ]; then
              echo
              echo '~~~'
              cat /tmp/h3-probe.txt
              echo '~~~'
            fi
          } >/tmp/report.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file /tmp/report.md
