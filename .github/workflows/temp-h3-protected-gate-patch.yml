name: TEMP H3 Protected Gate Patch

on:
  push:
    branches:
      - fix/h3-protected-stale-task-gate
    paths:
      - .github/workflows/temp-h3-protected-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h3-protected-stale-task-gate
          fetch-depth: 0
      - name: Patch helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1')
          s=p.read_text(encoding='utf-8')
          start=s.index("  $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop\n  if([string]$task.State -eq 'Running'){")
          end=s.index("\n}\n\n$after=@()",start)+2
          replacement="""  $task=Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
  if([string]$task.State -eq 'Running'){
    # A Running scheduled task with no worker process is a protected reset boundary.
    # Preserve diagnostics, but never stop/restart it from automatic source sync.
    $taskRunAgeSeconds=[math]::Round(((Get-Date)-$taskInfo.LastRunTime).TotalSeconds,1)
    $classification=$(if($launcherRepaired){'H3_GENERIC_WORKER_LAUNCHER_REPAIRED_STALE_TASK_RUNNING_AUTHORIZATION_REQUIRED'}else{'H3_GENERIC_WORKER_STALE_TASK_RUNNING_AUTHORIZATION_REQUIRED'})
  }else{
    Start-ScheduledTask -TaskName $taskName
    $started=$true
    $classification='H3_GENERIC_WORKER_STARTED_EXISTING_HIDDEN_TASK'
  }
}"""
          s=s[:start]+replacement+s[end:]
          mstart=s.index('$mutation=$(')
          mend=s.index('\n$result=[ordered]@{',mstart)
          mutation="""$mutation=$(
  if($launcherRepaired -and $started){'REPAIR_KNOWN_CORRUPT_LAUNCHER+START_EXISTING_TASK_ONLY'}
  elseif($launcherRepaired){'REPAIR_KNOWN_CORRUPT_LAUNCHER_ONLY'}
  elseif($started){'START_EXISTING_TASK_ONLY'}
  else{'NONE'}
)"""
          s=s[:mstart]+mutation+s[mend:]
          if 'Stop-ScheduledTask' in s:
              raise SystemExit('automatic Stop-ScheduledTask still present')
          if s.count('Start-ScheduledTask -TaskName $taskName') != 1:
              raise SystemExit('expected exactly one guarded start call')
          if 'H3_GENERIC_WORKER_STALE_TASK_RUNNING_AUTHORIZATION_REQUIRED' not in s:
              raise SystemExit('protected classification missing')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1
          git commit -m 'Restore protected gate for H3 stale task reset'
          git push origin HEAD:fix/h3-protected-stale-task-gate
