name: HP Envy Exact Source Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/hpenvy-surfshark-apply-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hpenvy-exact-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Trigger exact-SHA source sync on Windows-main
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 3 --max-time 15 \
            -H 'Content-Type: application/json' \
            -X POST --data "$payload" \
            http://100.70.25.8:8797/api/push-deploy

      - name: Confirm exact source loaded
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if health=$(curl --silent --show-error --fail --connect-timeout 3 --max-time 10 http://100.70.25.8:8797/health 2>/dev/null); then
              if HEALTH="$health" python - "$AFZ_SHA" <<'PY'
          import json,os,sys
          expected=sys.argv[1].lower()
          j=json.loads(os.environ['HEALTH'])
          commit=(j.get('commit') or '').strip().lower()
          assert commit == expected, (commit, expected)
          PY
              then
                echo "EXACT_SOURCE_SYNC=PASS"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "EXACT_SOURCE_SYNC=FAIL" >&2
          exit 1
