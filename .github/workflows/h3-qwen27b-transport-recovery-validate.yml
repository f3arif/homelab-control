name: Validate H3 Qwen27B Transport Recovery

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Invoke-H3-Qwen27B-TransportRecovery.ps1'
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - '.github/workflows/h3-qwen27b-transport-recovery-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and validate recovery invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $helper='afz-openai-agent/Invoke-H3-Qwen27B-TransportRecovery.ps1'
          $sync='afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
          foreach($f in @($helper,$sync)){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw "$f parse failure: $($errors.Message -join '; ')"}
          }
          $h=Get-Content $helper -Raw
          foreach($needle in @(
            'qwen27b-website-20260827-i02',
            'afz_h3_worker_system',
            'IdentitiesOnly=yes',
            'StrictHostKeyChecking=yes',
            'UserKnownHostsFile=',
            'EncodedCommand',
            'Disable-ScheduledTask',
            'AFZ H3 GitHub Direct Benchmark Watcher',
            'Switch-H3-Qwen27B-ToApiResume.ps1',
            'QWEN27B_EXISTING_CONTROLLER_PROTECTED',
            'QWEN27B_LEGACY_WATCHER_DISABLED_GH_AUTH_REQUIRED',
            'modelCallIssuedByRecovery=$false'
          )){if(-not $h.Contains($needle)){throw "Recovery invariant missing: $needle"}}
          foreach($forbidden in @(
            '127.0.0.1:11434/api/generate',
            'ollama run',
            'ollama.exe run',
            'Register-ScheduledTask -TaskName $legacyTask'
          )){if($h -match [regex]::Escape($forbidden)){throw "Forbidden recovery behavior found: $forbidden"}}
          $s=Get-Content $sync -Raw
          foreach($needle in @('TEMPORARY_QWEN27B_TRANSPORT_RECOVERY_HOOK','Invoke-H3-Qwen27B-TransportRecovery.ps1','4972f6abe1f695d9435f2b7d6575a462cbf73fc5')){
            if(-not $s.Contains($needle)){throw "Temporary sync-hook invariant missing: $needle"}
          }
          Write-Host 'QWEN27B_TRANSPORT_RECOVERY_VALIDATION=PASS'
