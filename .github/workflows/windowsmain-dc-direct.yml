            localOldCredentialsRemoved=(-not(Test-Path -LiteralPath $config -PathType Leaf))
            taskName=$taskName
            taskState=$(if($task){[string]$task.State}else{'MISSING'})
            processCount=@($procs).Count
            generatedAt=(Get-Date -Format o)
          }
          [IO.File]::WriteAllText($resultFile,($result|ConvertTo-Json -Depth 6),(New-Object Text.UTF8Encoding($false)))
          Write-Output ('PAIR_RESULT_WRITTEN='+$resultFile)
          Write-Output ('PAIR_AUTH_REQUIRED='+[bool]$code)
          if(-not $code){exit 2}
          PS
          )
          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          timeout 180s tailscale ssh Faiz@100.106.186.118 "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"
