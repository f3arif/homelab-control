name: HP temporary FamilyPTT edge external probe
on:
  push:
    branches: [ops/hpenvy-commander-dns-recovery-20260921]
    paths: [.github/workflows/afz-hpenvy-commander-dns-recovery.yml]
permissions:
  contents: read
concurrency:
  group: afz-hpenvy-commander-dns-recovery
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public API and LiveKit from outside home LAN
        shell: bash
        run: |
          set -euo pipefail
          echo '===API==='
          api=$(curl -fsS --connect-timeout 5 --max-time 15 https://ptt-api.afzeng.ca/health)
          printf '%s\n' "$api"
          grep -q '"ok":true' <<<"$api"
          echo '===LIVEKIT==='
          live=$(curl -fsS --connect-timeout 5 --max-time 15 https://ptt-livekit.afzeng.ca/)
          printf '%s\n' "$live"
          test "$live" = "OK"
          echo 'EXTERNAL_FAMILYPTT_EDGE=PASS'
