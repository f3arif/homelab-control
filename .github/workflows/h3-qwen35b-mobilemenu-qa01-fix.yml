name: H3 Qwen35B Mobile Menu QA01 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-qwen35b-mobilemenu-qa01-fix.yml'
      - '.github/scripts/h3-qwen35b-mobilemenu-qa01-fix.ps1'
      - '.github/h3-qwen35b-mobilemenu-qa01-fix-signal.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: h3-qwen35b-mobilemenu-qa01-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Apply bounded QA01 fix on H3
        shell: bash
        run: |
          set -euo pipefail
          host='100.106.186.118'
          script='.github/scripts/h3-qwen35b-mobilemenu-qa01-fix.ps1'
          tailscale ping --timeout=8s "$host"
          cat "$script" | timeout 420s tailscale ssh "Faiz@${host}" 'powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command -' | tee /tmp/h3-qa01.log
          grep -q 'BUILD=PASS' /tmp/h3-qa01.log
          grep -q 'LOCAL_HTTP=200' /tmp/h3-qa01.log
          grep -q 'ORIGINAL_REPAIR01_UNCHANGED=True' /tmp/h3-qa01.log
          grep -q 'MODEL_CALL_ISSUED=False' /tmp/h3-qa01.log
          echo 'RESULT=PASS'
