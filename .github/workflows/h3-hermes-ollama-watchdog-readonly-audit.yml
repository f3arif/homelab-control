name: H3 Hermes Ollama Watchdog Read Only Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-ollama-watchdog-readonly-audit.yml'

permissions:
  contents: write

concurrency:
  group: h3-hermes-ollama-watchdog-readonly-audit
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Add read-only Ollama watchdog telemetry to H3 generic audit
        shell: python
        run: |
          from pathlib import Path
          import base64

          p = Path('afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1')
          text = p.read_text(encoding='utf-8')
          marker = '# HERMES_OLLAMA_WATCHDOG_READONLY_AUDIT_V1'
          if marker in text:
              raise SystemExit('Ollama watchdog read-only audit already present')

          dec = lambda s: base64.b64decode(s).decode('utf-8')
          anchor = dec('')
          audit = dec('')
          anchor2 = dec('')
          old3 = dec('ICBoZWFydGJlYXRQYXRoPSRoZWFydGJlYXQ7aGVhcnRiZWF0TGFzdFdyaXRlPSRoZWFydGJlYXRMYXN0V3JpdGU7aGVhcnRiZWF0QWdlU2Vjb25kcz0kaGVhcnRiZWF0QWdlU2Vjb25kcztjYXB0dXJlZEF0PShHZXQtRGF0ZSAtRm9ybWF0IG8pCg==')
          new3 = dec('ICBoZWFydGJlYXRQYXRoPSRoZWFydGJlYXQ7aGVhcnRiZWF0TGFzdFdyaXRlPSRoZWFydGJlYXRMYXN0V3JpdGU7aGVhcnRiZWF0QWdlU2Vjb25kcz0kaGVhcnRiZWF0QWdlU2Vjb25kcztvbGxhbWFXYXRjaGRvZz0kb2xsYW1hV2F0Y2hkb2c7Y2FwdHVyZWRBdD0oR2V0LURhdGUgLUZvcm1hdCBvKQo=')

          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one worker-process anchor, got {text.count(anchor)}')
          text = text.replace(anchor, anchor + audit, 1)
          if text.count(anchor2) != 1:
              raise SystemExit(f'Expected one heartbeat anchor, got {text.count(anchor2)}')
          text = text.replace(anchor2, anchor2 + '$ollamaWatchdog=Get-OllamaWatchdogReadOnlyAudit\n', 1)
          if text.count(old3) != 1:
              raise SystemExit(f'Expected one output anchor, got {text.count(old3)}')
          text = text.replace(old3, new3, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Parse and enforce read-only audit contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'H3 Ollama watchdog audit parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('HERMES_OLLAMA_WATCHDOG_READONLY_AUDIT_V1','Get-ScheduledTaskInfo','Get-NetTCPConnection','/v1/models','/api/ps','Get-WinEvent','remoteMutation=''NONE''')){if(-not $c.Contains($required)){throw "Missing read-only invariant: $required"}}
          'H3_OLLAMA_WATCHDOG_READONLY_AUDIT=PASS'

      - name: Commit audit and publish exact deploy signal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1
          git commit -m 'Add read-only H3 Ollama watchdog telemetry'
          patch_sha=$(git rev-parse HEAD)
          printf '%s\n' "$patch_sha" > .github/afz-agent-deploy-signal.txt
          git add .github/afz-agent-deploy-signal.txt
          git commit -m 'Signal H3 Ollama watchdog read-only audit'
          git push origin HEAD:main
          echo "H3_OLLAMA_WATCHDOG_AUDIT_SHA=$patch_sha"
