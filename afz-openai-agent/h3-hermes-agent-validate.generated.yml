name: H3 Hermes Native Validate

on:
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-TelegramAttachmentAudit.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-TelegramFollowupRepair.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-ToolDispatchRepair.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-SessionRegistryRepair.ps1'
      - 'afz-openai-agent/requests/h3-hermes-agent-install.json'
      - 'afz-openai-agent/requests/h3-hermes-telegram-attachment-audit.json'
      - 'afz-openai-agent/requests/h3-hermes-telegram-followup-repair.json'
      - 'afz-openai-agent/requests/h3-hermes-tool-dispatch-repair.json'
      - 'afz-openai-agent/requests/h3-hermes-pdf-runtime-audit.json'
      - 'afz-openai-agent/requests/h3-hermes-gateway-reload.json'
      - '.github/workflows/h3-hermes-agent-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate typed native Hermes requests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          $r=Get-Content 'afz-openai-agent/requests/h3-hermes-agent-install.json' -Raw | ConvertFrom-Json
          if($r.schema -ne 1){throw 'provider schema'}
          if($r.action -ne 'install-and-configure' -or $r.status -ne 'ACTIVE'){throw 'provider action/status'}
          if($r.target -ne 'h3' -or $r.host -ne 'DESKTOP-H3R6CQN'){throw 'provider target'}
          if($r.provider_name -ne 'ollama' -or $r.provider_identity -ne 'custom:ollama'){throw 'provider identity'}
          if($r.base_url -ne 'http://127.0.0.1:11434/v1' -or $r.base_model -ne 'qwen3.6:35b-a3b'){throw 'provider route/model'}
          if($r.context_length -ne 65536){throw 'provider context'}
          if($r.restart_desktop_backend -or $r.restart_electron_ui -or $r.restart_messaging_gateway){throw 'provider restart safety'}
          if($r.mutate_ollama -or $r.run_generation_test -or $r.expose_api){throw 'provider mutation safety'}
          if(-not $r.publish_result -or -not $r.emergency_diagnostic_ack){throw 'provider publish/ack'}

          $t=Get-Content 'afz-openai-agent/requests/h3-hermes-telegram-attachment-audit.json' -Raw | ConvertFrom-Json
          if($t.schema -ne 1 -or $t.status -ne 'ACTIVE'){throw 'telegram schema/status'}
          if($t.target -ne 'h3' -or $t.host -ne 'DESKTOP-H3R6CQN'){throw 'telegram target'}
          if($t.action -notin @('audit-telegram-attachments','audit-and-reload-telegram-gateway','audit-and-repair-telegram-tool-dispatch')){throw 'telegram action'}
          if($t.action -eq 'audit-and-repair-telegram-tool-dispatch'){
            if($t.read_only -or -not $t.restart_gateway -or -not $t.repair_tool_dispatch -or -not $t.change_config){throw 'telegram tool-dispatch guard'}
          }elseif($t.action -eq 'audit-and-reload-telegram-gateway'){
            if($t.read_only -or -not $t.restart_gateway -or $t.change_config){throw 'telegram gateway repair guard'}
          }else{
            if(-not $t.read_only -or $t.restart_gateway -or $t.change_config){throw 'telegram audit guard'}
          }
          if($t.change_network){throw 'telegram forbidden network mutation'}

          $f=Get-Content 'afz-openai-agent/requests/h3-hermes-telegram-followup-repair.json' -Raw | ConvertFrom-Json
          if($f.schema -ne 1 -or $f.action -ne 'repair-telegram-document-followup' -or $f.status -ne 'ACTIVE'){throw 'followup schema/action/status'}
          if($f.target -ne 'h3' -or $f.host -ne 'DESKTOP-H3R6CQN'){throw 'followup target'}
          if(([string]$f.expected_adapter_sha256) -notmatch '^[0-9a-f]{64}$'){throw 'followup adapter hash'}
          if([double]$f.followup_delay_seconds -lt 2 -or [double]$f.followup_delay_seconds -gt 15){throw 'followup delay'}
          if(-not $f.restart_gateway -or $f.change_config -or $f.change_provider -or $f.mutate_ollama -or $f.change_network -or $f.run_model_generation){throw 'followup safety'}
          $d=Get-Content 'afz-openai-agent/requests/h3-hermes-tool-dispatch-repair.json' -Raw | ConvertFrom-Json
          if($d.schema -ne 1 -or $d.action -ne 'repair-local-tool-dispatch' -or $d.status -ne 'ACTIVE'){throw 'dispatch schema/action/status'}
          if($d.target -ne 'h3' -or $d.host -ne 'DESKTOP-H3R6CQN'){throw 'dispatch target'}
          if($d.provider -ne 'custom' -or $d.model -ne 'qwen3.6:35b-a3b'){throw 'dispatch provider/model'}
          if($d.tool_use_enforcement -or $d.task_completion_guidance -or $d.parallel_tool_call_guidance){throw 'dispatch desired flags'}
          if(-not $d.require_telegram_toolset_not_explicitly_empty -or -not $d.restart_gateway){throw 'dispatch guards'}
          if($d.change_provider -or $d.mutate_ollama -or $d.change_network -or $d.run_model_generation){throw 'dispatch forbidden mutation'}

          $p=Get-Content 'afz-openai-agent/requests/h3-hermes-pdf-runtime-audit.json' -Raw | ConvertFrom-Json
          if($p.schema -ne 1 -or $p.status -ne 'ACTIVE'){throw 'pdf schema/status'}
          if($p.action -notin @('audit-pdf-runtime','audit-and-repair-pdf-runtime')){throw 'pdf action'}
          if($p.target -ne 'h3' -or $p.host -ne 'DESKTOP-H3R6CQN'){throw 'pdf target'}
          if(-not $p.inspect_latest_cached_pdf -or $p.return_document_text){throw 'pdf content guards'}
          if($p.max_pages -lt 1 -or $p.max_pages -gt 5){throw 'pdf max_pages'}
          if($p.change_config -or $p.restart_gateway -or $p.change_provider -or $p.mutate_ollama -or $p.change_network -or $p.run_model_generation){throw 'pdf forbidden mutation'}
          if($p.action -eq 'audit-and-repair-pdf-runtime'){
            if($p.read_only -or -not $p.install_dependencies){throw 'pdf repair guard'}
            if((@($p.packages | ForEach-Object{([string]$_).ToLowerInvariant()}) -join ',') -ne 'pypdf,reportlab,pdfplumber'){throw 'pdf package allowlist'}
          }else{
            if(-not $p.read_only -or $p.install_dependencies){throw 'pdf audit guard'}
          }

          $g=Get-Content 'afz-openai-agent/requests/h3-hermes-gateway-reload.json' -Raw | ConvertFrom-Json
          if($g.schema -ne 1 -or $g.action -ne 'reload-gateway-native' -or $g.status -ne 'ACTIVE'){throw 'gateway schema/action/status'}
          if($g.target -ne 'h3' -or $g.host -ne 'DESKTOP-H3R6CQN'){throw 'gateway target'}
          if(-not $g.require_empty_active_registry -or -not $g.use_native_restart){throw 'gateway guards'}
          if($g.change_provider -or $g.mutate_ollama -or $g.change_network -or $g.run_model_generation){throw 'gateway forbidden mutation'}

          'REQUESTS=PASS'

      - name: Parse active Hermes control scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scripts=@(
            'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-TelegramAttachmentAudit.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-TelegramFollowupRepair.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-ToolDispatchRepair.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-SessionRegistryRepair.ps1'
          )
          foreach($p in $scripts){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              $errors | ForEach-Object { Write-Error ("${p}: "+$_.Message) }
              exit 1
            }
          }

          $install=Get-Content 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1' -Raw
          foreach($required in @('EMERGENCY_DIAGNOSTIC_ACK_ONLY','AFZ-H3-HERMES-DOCKER-LATEST.txt','127.0.0.1:11434/v1','qwen3.6:35b-a3b','Invoke-H3-Hermes-PdfRuntimeAudit.ps1','h3-hermes-pdf-runtime-audit.json','Invoke-H3-Hermes-TelegramFollowupRepair.ps1','h3-hermes-telegram-followup-repair.json')){
            if(-not $install.Contains($required)){throw "Install runner missing: $required"}
          }
          $followup=Get-Content 'afz-openai-agent/Invoke-H3-Hermes-TelegramFollowupRepair.ps1' -Raw
          foreach($required in @('HERMES_TELEGRAM_DOCUMENT_FOLLOWUP_REPAIR_VERIFIED','HERMES_TELEGRAM_DOCUMENT_FOLLOWUP_DELAY_SECONDS','FOLLOWUP_CANARY_PASS','expected_adapter_sha256','Invoke-H3-Hermes-GatewayReload.ps1')){
            if(-not $followup.Contains($required)){throw "Follow-up helper missing: $required"}
          }
          foreach($forbidden in @('/api/generate','ollama pull','docker.sock')){if($followup.Contains($forbidden)){throw "Forbidden follow-up helper content: $forbidden"}}          $dispatch=Get-Content 'afz-openai-agent/Invoke-H3-Hermes-ToolDispatchRepair.ps1' -Raw
          foreach($required in @('agent.tool_use_enforcement','agent.task_completion_guidance','agent.parallel_tool_call_guidance','HERMES_LOCAL_TOOL_DISPATCH_REPAIR_VERIFIED','platform_toolsets','Invoke-H3-Hermes-GatewayReload.ps1')){
            if(-not $dispatch.Contains($required)){throw "Dispatch helper missing: $required"}
          }
          $pdf=Get-Content 'afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1' -Raw
          foreach($required in @('AFZ-H3-HERMES-PDF-RUNTIME-LATEST.txt','HERMES_PDF_DEPENDENCIES_AND_READ_VERIFIED','HERMES_PDF_SKILL_MISSING','HERMES_PDF_DEPENDENCY_MISSING','latestCachedPdfSha256','documentTextReturned','$remoteTemplate','__REPAIR_MODE__','pypdf','reportlab','pdfplumber')){
            if(-not $pdf.Contains($required)){throw "PDF runtime helper missing: $required"}
          }
          if($pdf -match '\}\)\s+\$\(if\('){throw 'PDF helper contains unsafe interpolated remote exit subexpression'}
          $reload=Get-Content 'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1' -Raw
          foreach($required in @('require_empty_active_registry','use_native_restart','HERMES_GATEWAY_NATIVE_RELOAD_VERIFIED','active_sessions.json','gateway restart')){
            if(-not $reload.Contains($required)){throw "Reload helper missing: $required"}
          }
          $all=$install+"`n"+$dispatch+"`n"+$pdf+"`n"+$reload
          foreach($forbidden in @('/api/generate','ollama pull','docker.sock')){
            if($all.Contains($forbidden)){throw "Forbidden active runner content: $forbidden"}
          }
          'RUNNERS=PASS'
