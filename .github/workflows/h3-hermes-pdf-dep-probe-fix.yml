name: H3 Hermes PDF Carrier Gate Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Hermes carrier ready gate
        shell: python
        run: |
          from pathlib import Path

          p = Path('afz-openai-agent/Push-Deploy-Watcher.ps1')
          text = p.read_text(encoding='utf-8')
          old = r'''    $statePath=Join-Path $h3HermesStateRoot ($id+'.json')
          if(Test-Path -LiteralPath $statePath -PathType Leaf){
            try{
              $existing=Get-Content -LiteralPath $statePath -Raw -Encoding UTF8|ConvertFrom-Json
              if([bool]$existing.ok -and [string]$existing.classification -eq 'HERMES_READY_LOCAL_OLLAMA_64K'){return}
              if(-not [bool]$existing.retryable -and [string]$existing.classification -eq 'HERMES_SETUP_FAILED'){return}
            }catch{}
          }
          $now=Get-Date
'''
          new = r'''    # A successful primary Hermes state must not suppress newer typed auxiliary
          # preflights. Keep the existing Hermes carrier as the sole execution path; only
          # bypass the primary-ready short-circuit while a safe PDF request lacks ok state.
          $pdfAuxPending=$false
          $pdfAuxRequest=Join-Path $InstallRoot 'afz-openai-agent\requests\h3-hermes-pdf-runtime-audit.json'
          $pdfAuxStateRoot=Join-Path $stateRoot 'jobs\h3-hermes-pdf-runtime-audit'
          if(Test-Path -LiteralPath $pdfAuxRequest -PathType Leaf){
            try{
              $pdfReq=Get-Content -LiteralPath $pdfAuxRequest -Raw -Encoding UTF8|ConvertFrom-Json
              $pdfId=([string]$pdfReq.id).Trim()
              $pdfTypedSafe=(
                [int]$pdfReq.schema -eq 1 -and
                [string]$pdfReq.status -eq 'ACTIVE' -and
                [string]$pdfReq.target -eq 'h3' -and
                [string]$pdfReq.host -eq 'DESKTOP-H3R6CQN' -and
                [string]$pdfReq.action -in @('audit-pdf-runtime','audit-and-repair-pdf-runtime') -and
                $pdfId -match '^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$' -and
                -not [bool]$pdfReq.return_document_text -and
                -not [bool]$pdfReq.change_config -and
                -not [bool]$pdfReq.restart_gateway -and
                -not [bool]$pdfReq.change_provider -and
                -not [bool]$pdfReq.mutate_ollama -and
                -not [bool]$pdfReq.change_network -and
                -not [bool]$pdfReq.run_model_generation
              )
              if($pdfTypedSafe){
                $pdfStatePath=Join-Path $pdfAuxStateRoot ($pdfId+'.json')
                if(-not(Test-Path -LiteralPath $pdfStatePath -PathType Leaf)){
                  $pdfAuxPending=$true
                }else{
                  try{
                    $pdfState=Get-Content -LiteralPath $pdfStatePath -Raw -Encoding UTF8|ConvertFrom-Json
                    $pdfAuxPending=(-not [bool]$pdfState.ok)
                  }catch{$pdfAuxPending=$true}
                }
              }
            }catch{}
          }

          $statePath=Join-Path $h3HermesStateRoot ($id+'.json')
          if(Test-Path -LiteralPath $statePath -PathType Leaf){
            try{
              $existing=Get-Content -LiteralPath $statePath -Raw -Encoding UTF8|ConvertFrom-Json
              if([bool]$existing.ok -and [string]$existing.classification -eq 'HERMES_READY_LOCAL_OLLAMA_64K' -and -not $pdfAuxPending){return}
              if(-not [bool]$existing.retryable -and [string]$existing.classification -eq 'HERMES_SETUP_FAILED' -and -not $pdfAuxPending){return}
            }catch{}
          }
          if($pdfAuxPending){Log "H3_HERMES_PDF_AUX_PENDING request=$pdfId source=$(Current-Sha)"}
          $now=Get-Date
'''
          # Remove Python source indentation only.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Hermes primary-ready gate block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          required = [
              '$pdfAuxPending=$false',
              'h3-hermes-pdf-runtime-audit.json',
              'jobs\\h3-hermes-pdf-runtime-audit',
              "@('audit-pdf-runtime','audit-and-repair-pdf-runtime')",
              '-not [bool]$pdfReq.return_document_text',
              '-not [bool]$pdfReq.change_provider',
              '-not [bool]$pdfReq.mutate_ollama',
              '-not [bool]$pdfReq.change_network',
              '-not [bool]$pdfReq.run_model_generation',
              "HERMES_READY_LOCAL_OLLAMA_64K' -and -not $pdfAuxPending",
              'H3_HERMES_PDF_AUX_PENDING',
              'if(($now-$script:h3HermesLastAttempt).TotalSeconds -lt 60){return}',
              '$h3HermesRunner',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing carrier invariant after patch: ' + marker)
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Validate watcher under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent\Push-Deploy-Watcher.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'Push watcher parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('$pdfAuxPending=$false','h3-hermes-pdf-runtime-audit.json','H3_HERMES_PDF_AUX_PENDING','HERMES_READY_LOCAL_OLLAMA_64K','if(($now-$script:h3HermesLastAttempt).TotalSeconds -lt 60){return}')){if(-not $c.Contains($required)){throw "Missing carrier invariant: $required"}}
          if(-not $c.Contains('-not [bool]$pdfReq.return_document_text')){throw 'PDF content-return guard missing'}
          if(-not $c.Contains('-not [bool]$pdfReq.mutate_ollama')){throw 'PDF Ollama guard missing'}
          if(-not $c.Contains('-not [bool]$pdfReq.change_network')){throw 'PDF network guard missing'}
          'H3_HERMES_PDF_CARRIER_GATE_FIX=PASS'

      - name: Commit watcher patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Push-Deploy-Watcher.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Allow pending H3 PDF preflight through Hermes ready gate'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
