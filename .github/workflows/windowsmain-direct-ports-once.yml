# probe refresh 2026-09-04T10:31-04:00 stremio-tailnet
name: Windows-main Direct Ports Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windowsmain-direct-ports-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Probe read-only direct and LAN control surfaces
        shell: bash
        run: |
          set +e
          sudo tailscale set --accept-routes=true
          echo '=== ROUTE WINDOWS-MAIN LAN ==='
          ip route get 192.168.50.94 || true
          for host in 100.70.25.8 192.168.50.94; do
            echo "=== HOST=$host ==="
            for p in 22 445 5985 5986 8787 8790 8796 8797 18766; do
              if timeout 3 bash -c "</dev/tcp/$host/$p" 2>/dev/null; then
                echo "WM_"$host"_TCP_"$p"=OPEN"
              else
                echo "WM_"$host"_TCP_"$p"=CLOSED_OR_FILTERED"
              fi
            done
            for path in 8787/api/status 8790/api/status 8790/health 8796/health 8797/health 18766/health 18766/manifest.json; do
              echo "GET_BEGIN=http://$host/$path"
              curl --silent --show-error --connect-timeout 3 --max-time 6 --write-out '\nHTTP_CODE=%{http_code}\n' "http://$host/$path" || true
              echo "GET_END=http://$host/$path"
            done
          done
