name: HP Envy Hermes OAuth Force Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpenvy-hermes-oauth-force-sync.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hpenvy-hermes-oauth-force-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Force exact source sync on Windows-main
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body \
            --connect-timeout 4 --max-time 20 \
            -H 'Content-Type: application/json' \
            -X POST --data "$payload" \
            http://100.70.25.8:8797/api/push-deploy

      - name: Verify exact source loaded
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            health=$(curl --silent --show-error --fail --connect-timeout 4 --max-time 10 http://100.70.25.8:8797/health || true)
            if [ -n "$health" ] && HEALTH="$health" python - "$AFZ_SHA" <<'PY'
          import json, os, sys
          j=json.loads(os.environ['HEALTH'])
          actual=(j.get('commit') or '').strip().lower()
          expected=sys.argv[1].strip().lower()
          print('actual='+actual)
          print('expected='+expected)
          if actual != expected:
              raise SystemExit(1)
          PY
            then
              echo "EXACT_SOURCE_SYNC=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "EXACT_SOURCE_SYNC=FAIL" >&2
          exit 1
