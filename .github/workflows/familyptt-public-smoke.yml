name: FamilyPTT public smoke

on:
  push:
    paths:
      - '.github/afz-familyptt-public-smoke-signal.txt'

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify FamilyPTT public transport
        shell: bash
        run: |
          set -euo pipefail
          api_status="$(curl --fail --silent --show-error --output /tmp/health --write-out '%{http_code}' --max-time 15 https://ptt-api.afzeng.ca/health)"
          test "$api_status" = "200"
          curl --fail --silent --show-error --max-time 15 'https://ptt-api.afzeng.ca/token?identity=github-public-smoke&name=GitHubPublicSmoke&room=family-main' --output /tmp/token.json
          python3 - <<'PY'
          import json
          with open('/tmp/token.json') as f:
              d=json.load(f)
          assert d.get('serverUrl') == 'wss://ptt-livekit.afzeng.ca', d.get('serverUrl')
          assert bool(d.get('participantToken'))
          print('TOKEN_SERVER_URL=wss://ptt-livekit.afzeng.ca')
          print('TOKEN_PRESENT=true')
          PY
          lk_status="$(curl --fail --silent --show-error --output /tmp/livekit --write-out '%{http_code}' --max-time 15 https://ptt-livekit.afzeng.ca/)"
          test "$lk_status" = "200"
          timeout 8 bash -c '</dev/tcp/ptt-livekit.afzeng.ca/7881'
          echo "API_HEALTH_STATUS=$api_status"
          echo "LIVEKIT_HTTPS_STATUS=$lk_status"
          echo 'LIVEKIT_TCP_7881=true'
          echo 'FINAL=PASS_PUBLIC_TRANSPORT'

      - name: Join LiveKit room from external runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet livekit
          python3 - <<'PY'
          import asyncio, json, urllib.request
          from livekit import rtc

          TOKEN_URL = 'https://ptt-api.afzeng.ca/token?identity=github-rtc-smoke&name=GitHubRtcSmoke&room=family-main'

          async def main():
              with urllib.request.urlopen(TOKEN_URL, timeout=15) as r:
                  d = json.load(r)
              assert d.get('serverUrl') == 'wss://ptt-livekit.afzeng.ca'
              token = d.get('participantToken')
              assert token
              room = rtc.Room()
              await asyncio.wait_for(room.connect(d['serverUrl'], token), timeout=30)
              assert room.isconnected()
              print('ROOM_CONNECTED=true')
              print('ROOM_SERVER_URL=wss://ptt-livekit.afzeng.ca')
              await asyncio.sleep(3)
              remote_ids = sorted(room.remote_participants.keys())
              android_ids = [identity for identity in remote_ids if identity.lower().startswith('familyptt-android-')]
              print(f'REMOTE_PARTICIPANT_COUNT={len(remote_ids)}')
              print(f'ANDROID_REMOTE_COUNT={len(android_ids)}')
              for identity in android_ids:
                  print(f'ANDROID_REMOTE_ID={identity}')
              print('PHONE_ROOM_CONNECTED=' + ('true' if android_ids else 'false'))
              await room.disconnect()
              print('ROOM_DISCONNECTED_CLEANLY=true')

          asyncio.run(main())
          PY
