name: AFZ Website Retired Job Tombstone Validate

on:
  push:
    branches:
      - fix/afz-site-r3-tombstone
      - fix/afz-site-r6-tombstone
      - stage/afz-site-cutover-r8
      - activate/afz-site-cutover-r8
      - cleanup/afz-site-r8-post-success
    paths:
      - 'afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1'
      - '.github/workflows/afz-site-r3-tombstone-validate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1'
      - '.github/workflows/afz-site-r3-tombstone-validate.yml'

permissions:
  contents: read

jobs:
  tombstone:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Parse wrapper
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'PowerShell parse failed'}
          Write-Host 'PARSE PASS'

      - name: Prove exact retired R3 exits before deploy core
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1 "$tmp/Deploy-AFZ-WebsiteToPi.ps1"
          set +e
          output=$(pwsh -NoProfile -File "$tmp/Deploy-AFZ-WebsiteToPi.ps1" \
            -ExpectedSiteSha c38576741ce2d379723fde038300363429845656 \
            -JobId afz-site-git-cutover-r3-20260827T2138 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 42
          grep -Fq 'AFZ_SITE_DEPLOY_RETIRED_R3: blocked before deploy core.' <<<"$output"
          test ! -e "$tmp/Deploy-AFZ-WebsiteToPi-Core.ps1"
          echo 'R3 TOMBSTONE PASS'

      - name: Prove exact retired R6 exits before deploy core
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1 "$tmp/Deploy-AFZ-WebsiteToPi.ps1"
          set +e
          output=$(pwsh -NoProfile -File "$tmp/Deploy-AFZ-WebsiteToPi.ps1" \
            -ExpectedSiteSha c38576741ce2d379723fde038300363429845656 \
            -JobId afz-site-git-cutover-r6-20260828T1602 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 42
          grep -Fq 'AFZ_SITE_DEPLOY_RETIRED_R6: blocked before deploy core.' <<<"$output"
          test ! -e "$tmp/Deploy-AFZ-WebsiteToPi-Core.ps1"
          echo 'R6 TOMBSTONE PASS'

      - name: Prove exact retired R7 exits before deploy core
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1 "$tmp/Deploy-AFZ-WebsiteToPi.ps1"
          set +e
          output=$(pwsh -NoProfile -File "$tmp/Deploy-AFZ-WebsiteToPi.ps1" \
            -ExpectedSiteSha c38576741ce2d379723fde038300363429845656 \
            -JobId afz-site-git-cutover-r7-20260829T0030 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 42
          grep -Fq 'AFZ_SITE_DEPLOY_RETIRED_R7: blocked before deploy core.' <<<"$output"
          test ! -e "$tmp/Deploy-AFZ-WebsiteToPi-Core.ps1"
          echo 'R7 TOMBSTONE PASS'

      - name: Prove exact completed R8 exits before deploy core
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1 "$tmp/Deploy-AFZ-WebsiteToPi.ps1"
          set +e
          output=$(pwsh -NoProfile -File "$tmp/Deploy-AFZ-WebsiteToPi.ps1" \
            -ExpectedSiteSha c38576741ce2d379723fde038300363429845656 \
            -JobId afz-site-git-cutover-r8-20260829T1348 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -eq 42
          grep -Fq 'AFZ_SITE_DEPLOY_RETIRED_R8: blocked before deploy core.' <<<"$output"
          test ! -e "$tmp/Deploy-AFZ-WebsiteToPi-Core.ps1"
          echo 'R8 TOMBSTONE PASS'

      - name: Verify tombstones are exact and non-mutating
        shell: python
        run: |
          from pathlib import Path
          p=Path('afz-openai-agent/Deploy-AFZ-WebsiteToPi.ps1').read_text()
          for marker in [
            'afz-site-git-cutover-r3-20260827T2138',
            'AFZ_SITE_DEPLOY_RETIRED_R3: blocked before deploy core.',
            'afz-site-git-cutover-r6-20260828T1602',
            'AFZ_SITE_DEPLOY_RETIRED_R6: blocked before deploy core.',
            'afz-site-git-cutover-r7-20260829T0030',
            'AFZ_SITE_DEPLOY_RETIRED_R7: blocked before deploy core.',
            'afz-site-git-cutover-r8-20260829T1348',
            'AFZ_SITE_DEPLOY_RETIRED_R8: blocked before deploy core.',
            'c38576741ce2d379723fde038300363429845656',
            'exit 42'
          ]:
            assert marker in p, marker
          first_core=p.index("$core=Join-Path $PSScriptRoot 'Deploy-AFZ-WebsiteToPi-Core.ps1'")
          for marker in ('AFZ_SITE_DEPLOY_RETIRED_R3','AFZ_SITE_DEPLOY_RETIRED_R6','AFZ_SITE_DEPLOY_RETIRED_R7','AFZ_SITE_DEPLOY_RETIRED_R8'):
            assert p.index(marker) < first_core
          pre_core=p[:first_core]
          assert 'Remove-Item' not in pre_core
          assert 'Set-Content' not in pre_core
          assert 'ssh.exe' not in pre_core
          assert 'scp.exe' not in pre_core
          print('EXACT NON-MUTATING RETIRED-JOB TOMBSTONES PASS')
