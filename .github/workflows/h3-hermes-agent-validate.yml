name: H3 Hermes Native Validate

on:
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-TelegramAttachmentAudit.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1'
      - 'afz-openai-agent/Invoke-H3-Hermes-SessionRegistryRepair.ps1'
      - 'afz-openai-agent/requests/h3-hermes-agent-install.json'
      - 'afz-openai-agent/requests/h3-hermes-telegram-attachment-audit.json'
      - 'afz-openai-agent/requests/h3-hermes-gateway-reload.json'
      - '.github/workflows/h3-hermes-agent-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate typed native Hermes requests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          $r=Get-Content 'afz-openai-agent/requests/h3-hermes-agent-install.json' -Raw | ConvertFrom-Json
          if($r.schema -ne 1){throw 'provider schema'}
          if($r.action -ne 'install-and-configure' -or $r.status -ne 'ACTIVE'){throw 'provider action/status'}
          if($r.target -ne 'h3' -or $r.host -ne 'DESKTOP-H3R6CQN'){throw 'provider target'}
          if($r.provider_name -ne 'ollama' -or $r.provider_identity -ne 'custom:ollama'){throw 'provider identity'}
          if($r.base_url -ne 'http://127.0.0.1:11434/v1' -or $r.base_model -ne 'qwen3.6:35b-a3b'){throw 'provider route/model'}
          if($r.context_length -ne 65536){throw 'provider context'}
          if($r.restart_desktop_backend -or $r.restart_electron_ui -or $r.restart_messaging_gateway){throw 'provider restart safety'}
          if($r.mutate_ollama -or $r.run_generation_test -or $r.expose_api){throw 'provider mutation safety'}
          if(-not $r.publish_result -or -not $r.emergency_diagnostic_ack){throw 'provider publish/ack'}

          $t=Get-Content 'afz-openai-agent/requests/h3-hermes-telegram-attachment-audit.json' -Raw | ConvertFrom-Json
          if($t.schema -ne 1 -or $t.status -ne 'ACTIVE'){throw 'telegram schema/status'}
          if($t.target -ne 'h3' -or $t.host -ne 'DESKTOP-H3R6CQN'){throw 'telegram target'}
          if($t.action -notin @('audit-telegram-attachments','audit-and-reload-telegram-gateway')){throw 'telegram action'}
          if($t.action -eq 'audit-and-reload-telegram-gateway'){
            if($t.read_only -or -not $t.restart_gateway){throw 'telegram repair guard'}
          }else{
            if(-not $t.read_only -or $t.restart_gateway){throw 'telegram audit guard'}
          }
          if($t.change_config -or $t.change_network){throw 'telegram forbidden mutation'}

          $g=Get-Content 'afz-openai-agent/requests/h3-hermes-gateway-reload.json' -Raw | ConvertFrom-Json
          if($g.schema -ne 1 -or $g.action -ne 'reload-gateway-native' -or $g.status -ne 'ACTIVE'){throw 'gateway schema/action/status'}
          if($g.target -ne 'h3' -or $g.host -ne 'DESKTOP-H3R6CQN'){throw 'gateway target'}
          if(-not $g.require_empty_active_registry -or -not $g.use_native_restart){throw 'gateway guards'}
          if($g.change_provider -or $g.mutate_ollama -or $g.change_network -or $g.run_model_generation){throw 'gateway forbidden mutation'}

          'REQUESTS=PASS'

      - name: Parse active Hermes control scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scripts=@(
            'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-TelegramAttachmentAudit.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1',
            'afz-openai-agent/Invoke-H3-Hermes-SessionRegistryRepair.ps1'
          )
          foreach($p in $scripts){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              $errors | ForEach-Object { Write-Error ("${p}: "+$_.Message) }
              exit 1
            }
          }

          $install=Get-Content 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1' -Raw
          foreach($required in @('EMERGENCY_DIAGNOSTIC_ACK_ONLY','AFZ-H3-HERMES-DOCKER-LATEST.txt','127.0.0.1:11434/v1','qwen3.6:35b-a3b')){
            if(-not $install.Contains($required)){throw "Install runner missing: $required"}
          }
          $reload=Get-Content 'afz-openai-agent/Invoke-H3-Hermes-GatewayReload.ps1' -Raw
          foreach($required in @('require_empty_active_registry','use_native_restart','HERMES_GATEWAY_NATIVE_RELOAD_VERIFIED','active_sessions.json','gateway restart')){
            if(-not $reload.Contains($required)){throw "Reload helper missing: $required"}
          }
          foreach($forbidden in @('/api/generate','ollama pull','docker.sock')){
            if(($install+"`n"+$reload).Contains($forbidden)){throw "Forbidden active runner content: $forbidden"}
          }
          'RUNNERS=PASS'
