name: Windows-main RadioHilal Readonly Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windowsmain-radiohilal-readonly.yml'
      - '.github/windowsmain-radiohilal-readonly-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: windowsmain-radiohilal-readonly
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Inspect RadioHilal on windows-main without mutation
        shell: bash
        run: |
          set -euo pipefail
          host='100.70.25.8'
          tailscale ping --timeout=5s -c 2 "$host"

          remote_script=$(cat <<'REMOTE'
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'DESKTOP-10SKF0M'){throw "WRONG_HOST $($env:COMPUTERNAME)"}

          function TaskState([string]$name){
            $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
            $i=$null
            if($t){try{$i=Get-ScheduledTaskInfo -TaskName $name -ErrorAction Stop}catch{}}
            [ordered]@{
              name=$name
              present=[bool]$t
              state=$(if($t){[string]$t.State}else{$null})
              lastRun=$(if($i){$i.LastRunTime}else{$null})
              lastResult=$(if($i){$i.LastTaskResult}else{$null})
              nextRun=$(if($i){$i.NextRunTime}else{$null})
            }
          }

          $repoCandidates=@(
            'C:\AFZ\RadioHilalGit',
            'C:\Projects\RadioHilal'
          )
          $repo=$repoCandidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ '.git') } | Select-Object -First 1
          $head=$null
          $branch=$null
          $dirty=$null
          $pollFixInSource=$false
          if($repo){
            try{$head=(& git -C $repo rev-parse HEAD 2>$null | Select-Object -First 1).Trim()}catch{}
            try{$branch=(& git -C $repo branch --show-current 2>$null | Select-Object -First 1).Trim()}catch{}
            try{$dirty=((@(& git -C $repo status --porcelain 2>$null)).Count -gt 0)}catch{}
            $dashboard=Join-Path $repo 'radiohilal-admin\components\content-review\ContentReviewDashboard.tsx'
            if(Test-Path -LiteralPath $dashboard -PathType Leaf){
              try{
                $raw=Get-Content -LiteralPath $dashboard -Raw -Encoding UTF8
                $pollFixInSource=($raw.Contains('sameReviewList') -and $raw.Contains('sameReviewSnapshot'))
              }catch{}
            }
          }

          $frontendService=Get-Service -Name 'RadioHilal.Frontend' -ErrorAction SilentlyContinue
          $apiService=Get-Service -Name 'RadioHilal.Api' -ErrorAction SilentlyContinue
          $listen3002=@(Get-NetTCPConnection -State Listen -LocalPort 3002 -ErrorAction SilentlyContinue)
          $localReviewOk=$false
          $localReviewStatus=$null
          try{
            $resp=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3002/review' -TimeoutSec 8
            $localReviewStatus=[int]$resp.StatusCode
            $localReviewOk=($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 400)
          }catch{
            try{$localReviewStatus=[int]$_.Exception.Response.StatusCode.value__}catch{}
          }

          $nodeProcs=@()
          try{
            $nodeProcs=@(
              Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction Stop |
                Select-Object ProcessId,CreationDate,CommandLine
            )
          }catch{}

          $bridgeLog=$null
          if($repo){
            $candidate=Join-Path (Split-Path -Parent $repo) ((Split-Path -Leaf $repo)+'.github-bridge.log')
            if(Test-Path -LiteralPath $candidate -PathType Leaf){
              try{$bridgeLog=(Get-Content -LiteralPath $candidate -Tail 25 -ErrorAction Stop) -join "
"}catch{}
            }
          }

          [ordered]@{
            host=$env:COMPUTERNAME
            time=(Get-Date -Format o)
            repo=$repo
            head=$head
            branch=$branch
            dirty=$dirty
            pollFixInSource=$pollFixInSource
            fastWatcher=(TaskState 'RadioHilal-GitHub-FastWatcher')
            bridgeTask=(TaskState 'RadioHilal-GitHub-Bridge')
            frontendService=[ordered]@{
              present=[bool]$frontendService
              status=$(if($frontendService){[string]$frontendService.Status}else{$null})
            }
            apiService=[ordered]@{
              present=[bool]$apiService
              status=$(if($apiService){[string]$apiService.Status}else{$null})
            }
            listen3002=($listen3002.Count -gt 0)
            listen3002Count=$listen3002.Count
            localReviewOk=$localReviewOk
            localReviewStatus=$localReviewStatus
            nodeProcesses=$nodeProcs
            bridgeLogTail=$bridgeLog
          } | ConvertTo-Json -Depth 10 -Compress
          REMOTE
          )

          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)
          timeout 300s tailscale ssh "Faiz@${host}" "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"
