name: H3 Hermes Followup Diff Telemetry Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-followup-provenance-patch.yml'
      - 'afz-openai-agent/Patch-H3-Hermes-FollowupDiffTelemetry.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and parse helper
        shell: powershell
        run: .\afz-openai-agent\Patch-H3-Hermes-FollowupDiffTelemetry.ps1
      - name: Commit helper only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm 'afz-openai-agent/Patch-H3-Hermes-FollowupDiffTelemetry.ps1'
          git add 'afz-openai-agent/Invoke-H3-Hermes-TelegramFollowupRepair.ps1'
          git commit -m 'Report sanitized H3 Hermes adapter diff on hash mismatch'
          git push origin HEAD:main
