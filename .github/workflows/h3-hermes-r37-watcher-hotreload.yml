name: H3 Hermes R37 Watcher Hot Reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-hermes-r37-watcher-hotreload.yml'

permissions:
  contents: write

jobs:
  hotreload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase current main
        run: git pull --rebase origin main

      - name: Confirm Telegram binder ancestry
        run: |
          signal=$(tr -d '\r\n' < .github/afz-agent-deploy-signal.txt)
          test "$signal" = '4edf15e2948fcdd4fc6733ab9ae961adc8f4307b'
          git merge-base --is-ancestor 4edf15e2948fcdd4fc6733ab9ae961adc8f4307b HEAD

      - name: Add deferred watcher refresh
        run: python .github/scripts/patch_deferred_push_watcher_refresh.py

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Sync wrapper parse failed'}
          $t=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          if($t -notmatch 'DEFERRED_PUSH_WATCHER_REFRESH_V1'){throw 'Deferred refresh marker missing'}
          if($t -notmatch 'AFZ OpenAI Agent Push Watcher Deferred Refresh'){throw 'Deferred task contract missing'}

      - name: Commit patch and signal it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1
          git commit -m 'Schedule deferred push watcher refresh after sync'
          patch_sha=$(git rev-parse HEAD)
          printf '%s\n' "$patch_sha" > .github/afz-agent-deploy-signal.txt
          git add .github/afz-agent-deploy-signal.txt
          git commit -m 'Signal deferred push watcher refresh'
          git push origin HEAD:main
          echo "AFZ_DEFERRED_WATCHER_REFRESH_SHA=$patch_sha"
