name: Validate H3 Qwen 35B Post-Return Recovery

on:
  pull_request:
    paths:
      - 'afz-openai-agent/tools/Recover-H3-Qwen35BA3B-PostReturn.ps1'
      - 'afz-openai-agent/Inspect-H3-Qwen35BA3B-PostReturn.ps1'
      - '.github/workflows/h3-qwen35b-postreturn-recovery-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @(
            'afz-openai-agent/tools/Recover-H3-Qwen35BA3B-PostReturn.ps1',
            'afz-openai-agent/Inspect-H3-Qwen35BA3B-PostReturn.ps1'
          )){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ("PowerShell parse failure in ${path}: "+($errors.Message -join '; '))}
          }

      - name: Enforce no-second-call recovery contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='afz-openai-agent/tools/Recover-H3-Qwen35BA3B-PostReturn.ps1'
          $r=Get-Content $path -Raw
          foreach($needle in @(
            "`$JobId='qwen35b-a3b-website-20260830-r1'",
            "`$Model='qwen3.6:35b-a3b'",
            "`$Context=16384",
            "recovery_mode='postreturn_no_model_call'",
            'model_calls_used=1',
            'human_written_website_code=0',
            'qwen_only_website_author=$true',
            "phase -notin @('ollama_post_returned'",
            "ResponseFile=Join-Path `$ProjectRoot 'AFZ-OLLAMA-RESPONSE.json'",
            '<<<FILE:',
            '<<<END FILE>>>',
            "@('/','/services','/projects','/about','/contact')"
          )){if(-not $r.Contains($needle)){throw "required recovery invariant missing: $needle"}}
          if($r -match '127\.0\.0\.1:11434/api/generate'){throw 'recovery must not contain an Ollama generate endpoint'}
          if($r -match '(?i)\bcurl(?:\.exe)?\b'){throw 'recovery must not invoke curl'}
          if($r -match '(?im)^\s*[&]?\s*ollama(?:\.exe)?\s'){throw 'recovery must not invoke Ollama CLI'}
          if($r -match '(?i)Invoke-Expression|\biex\b'){throw 'dynamic expression execution forbidden'}
          Write-Host 'QWEN35B_POSTRETURN_NO_SECOND_CALL_CONTRACT=PASS'
