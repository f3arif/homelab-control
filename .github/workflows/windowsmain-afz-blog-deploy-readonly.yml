name: Windows-main AFZ Blog Deploy Readonly Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windowsmain-afz-blog-deploy-readonly.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: windowsmain-afz-blog-deploy-readonly
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Read AFZ control and Blog health without mutation
        shell: bash
        run: |
          set -euo pipefail
          host='100.70.25.8'
          tailscale ping --timeout=5s -c 2 "$host"

          for url in \
            "http://$host:8797/health" \
            "http://$host:8796/health" \
            "http://$host:3015/"; do
            echo "=== $url ==="
            set +e
            code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/afz-body -w '%{http_code}' "$url" 2>/tmp/afz-err)
            rc=$?
            set -e
            echo "CURL_EXIT=$rc HTTP=$code"
            if [ -s /tmp/afz-body ]; then head -c 20000 /tmp/afz-body; echo; fi
            if [ -s /tmp/afz-err ]; then cat /tmp/afz-err; fi
          done
