name: H3 Ollama 0.33.2 Corruption Repair Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h3-ollama-0332-corruption-repair-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/h3-ollama-0332-repair-trigger.txt'

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: h3-ollama-0332-corruption-repair-once
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch main-branch repair and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='h3-ollama-0332-corruption-repair-once.yml'
          before=$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run "$workflow" --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            candidate=$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$candidate" ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo 'Failed to resolve dispatched repair run ID' >&2
            exit 1
          fi
          echo "DISPATCHED_REPAIR_RUN=$run_id"
          gh run watch "$run_id" --exit-status --interval 10

  repair:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Sync windows-main to exact source
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s"}' "$AFZ_SHA")
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 -H 'Content-Type: application/json' -X POST --data "$payload" http://100.70.25.8:8797/api/push-deploy
          for attempt in $(seq 1 30); do
            if health=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 12 http://100.70.25.8:8797/health 2>/dev/null); then
              commit=$(python -c 'import json,sys; print((json.load(sys.stdin).get("commit") or "").strip().lower())' <<<"$health")
              if [ "$commit" = "${AFZ_SHA,,}" ]; then
                echo "WINDOWS_MAIN_EXACT_SHA=$commit"
                exit 0
              fi
              echo "attempt=$attempt current=$commit expected=${AFZ_SHA,,}"
            fi
            sleep 5
          done
          echo 'windows-main did not reach exact source SHA' >&2
          exit 1

      - name: Repair H3 Ollama through windows-main
        env:
          AFZ_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"f3arif/homelab-control","ref":"refs/heads/main","sha":"%s","action":"apply"}' "$AFZ_SHA")
          response=$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 690 -H 'Content-Type: application/json' -X POST --data "$payload" http://100.70.25.8:8797/api/h3-ollama-repair0332)
          printf '%s\n' "$response"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("classification")=="H3_OLLAMA_0332_REPAIR_VERIFIED"; r=d["result"]; assert r.get("llamaServerPresent") is True; assert r.get("endpointReachable") is True; assert r.get("model35BListed") is True; assert str(r.get("generationReply") or "").strip(); assert r.get("modelFilesBefore")==r.get("modelFilesAfter"); assert r.get("modelBytesBefore")==r.get("modelBytesAfter"); assert "running" in str(r.get("gatewayStatus") or "").lower(); print("H3_OLLAMA_REPAIR_ACCEPTANCE=PASS")' <<<"$response"
