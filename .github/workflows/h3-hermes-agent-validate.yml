name: H3 Hermes Agent Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1'
      - 'afz-openai-agent/requests/h3-hermes-agent-install.json'
      - 'afz-openai-agent/Push-Deploy-Watcher.ps1'
      - '.github/workflows/h3-hermes-agent-validate.yml'
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/Invoke-H3-HermesAgent-Install.ps1'
      - 'afz-openai-agent/requests/h3-hermes-agent-install.json'
      - 'afz-openai-agent/Push-Deploy-Watcher.ps1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: powershell
        run: |
          $files=@(
            'afz-openai-agent\Invoke-H3-HermesAgent-Install.ps1',
            'afz-openai-agent\Push-Deploy-Watcher.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
          }

      - name: Validate audit-only request and safety invariants
        shell: powershell
        run: |
          $r=Get-Content 'afz-openai-agent\requests\h3-hermes-agent-install.json' -Raw|ConvertFrom-Json
          if([int]$r.schema -ne 1){throw 'schema'}
          if([string]$r.action -ne 'install-and-configure'){throw 'existing watcher binding requires install-and-configure action'}
          if([string]$r.status -ne 'AUDIT_ONLY'){throw 'status'}
          if([string]$r.recovery_mode -ne 'post-timeout-audit-only'){throw 'recovery mode'}
          if([string]$r.target -ne 'h3' -or [string]$r.host -ne 'DESKTOP-H3R6CQN'){throw 'target'}
          if([string]$r.provider -ne 'custom'){throw 'provider'}
          if([string]$r.base_url -ne 'http://127.0.0.1:11434/v1'){throw 'base_url'}
          if([string]$r.base_model -ne 'qwen3.6:35b-a3b'){throw 'base model'}
          if([string]$r.hermes_model -ne 'qwen3.6:35b-a3b-hermes64k'){throw 'alias'}
          if([int]$r.context_length -ne 65536){throw 'context'}
          if([bool]$r.start_gateway -or [bool]$r.run_generation_test){throw 'gateway/generation must remain disabled'}

          $s=Get-Content 'afz-openai-agent\Invoke-H3-HermesAgent-Install.ps1' -Raw
          foreach($required in @(
            'post-timeout-audit-only',
            'StrictHostKeyChecking=yes',
            'http://127.0.0.1:11434/api/tags',
            'show --modelfile',
            'generationTestStarted=$false',
            'gatewayStarted=$false',
            'HERMES_READY_LOCAL_OLLAMA_64K',
            'HERMES_INSTALLED_CONFIG_INCOMPLETE',
            'HERMES_LAUNCHER_MISSING_AFTER_TIMEOUT'
          )){
            if(-not $s.Contains($required)){throw "Missing audit-only invariant: $required"}
          }
