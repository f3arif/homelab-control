name: H3 Hermes PDF Carrier Gate Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch carrier gate
        shell: python
        run: |
          import base64
          exec(base64.b64decode(''))

      - name: Validate watcher under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent\Push-Deploy-Watcher.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'Push watcher parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('function Test-H3HermesPdfAuxPending{','$pdfAuxPending=Test-H3HermesPdfAuxPending','H3_HERMES_PDF_AUX_PENDING','HERMES_READY_LOCAL_OLLAMA_64K','pypdf,reportlab,pdfplumber','if(($now-$script:h3HermesLastAttempt).TotalSeconds -lt 60){return}')){if(-not $c.Contains($required)){throw "Missing carrier invariant: $required"}}
          if(-not $c.Contains('[bool]$r.return_document_text')){throw 'PDF content guard missing'}
          if(-not $c.Contains('[bool]$r.mutate_ollama')){throw 'PDF Ollama guard missing'}
          if(-not $c.Contains('[bool]$r.change_network')){throw 'PDF network guard missing'}
          'H3_HERMES_PDF_CARRIER_GATE_FIX=PASS'

      - name: Commit watcher patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Push-Deploy-Watcher.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Allow pending H3 PDF preflight through Hermes ready gate'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
