name: Patch AFZ R5 Orphan Self-Heal
on:
  push:
    branches:
      - fix/afz-r5-orphan-git-selfheal
    paths:
      - afz-openai-agent/Release-AFZ-Site-R5-OrphanSsh.ps1
      - afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1
      - .github/workflows/afz-r5-orphan-selfheal-patch.yml
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/afz-r5-orphan-git-selfheal
      - name: Insert one-time self-heal call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1')
          s=p.read_text(encoding='utf-8-sig')
          marker='Release-AFZ-Site-R5-OrphanSsh.ps1'
          if marker in s:
              print('SELFHEAL_CALL_ALREADY_PRESENT')
          else:
              anchor='''  Log "START interval=${IntervalSeconds}s action=deploy-pi-static-site carrier='$carrierTaskName'"\n  while($true){'''
              replacement='''  Log "START interval=${IntervalSeconds}s action=deploy-pi-static-site carrier='$carrierTaskName'"\n  # One-time exact R5 orphan self-heal. This helper is fail-closed and can stop only\n  # the verified R5 staging SSH child; it never touches the carrier task or deploy core.\n  try{\n    $r5Release=Join-Path $InstallRoot 'afz-openai-agent\\Release-AFZ-Site-R5-OrphanSsh.ps1'\n    if(Test-Path -LiteralPath $r5Release -PathType Leaf){\n      & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $r5Release *> $null\n      if($LASTEXITCODE -ne 0){Log "R5_ORPHAN_RELEASE_HELPER_EXIT exit=$LASTEXITCODE"}\n    }\n  }catch{Log "R5_ORPHAN_RELEASE_HELPER_ERROR $($_.Exception.Message)"}\n  while($true){'''
              count=s.count(anchor)
              if count != 1:
                  raise SystemExit(f'Expected one watcher anchor, found {count}')
              p.write_text(s.replace(anchor,replacement),encoding='utf-8')
              print('SELFHEAL_CALL_PATCHED')
          PY
      - name: Parse and enforce safety contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1','afz-openai-agent/Release-AFZ-Site-R5-OrphanSsh.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){$errors|Format-List|Out-String|Write-Error;throw "Parse failed: $p"}
          }
          $h=Get-Content 'afz-openai-agent/Release-AFZ-Site-R5-OrphanSsh.ps1' -Raw
          foreach($needle in @('afz-site-git-cutover-r5-20260828T1151','c38576741ce2d379723fde038300363429845656','Carrier task ended without a matching deployment result file.','192.168.50.68','/opt/edge/afz-site/git-deploy/stage','Stop-Process -Id $sshPid')){if(-not $h.Contains($needle)){throw "Missing safety marker: $needle"}}
          if($h -match 'Stop-Process[^\r\n]*corePid'){throw 'Self-heal must not directly stop deploy core'}
          if($h -match '(?i)Stop-ScheduledTask|Set-ScheduledTask|Start-ScheduledTask|Disable-ScheduledTask|Enable-ScheduledTask'){throw 'Self-heal must not mutate scheduled tasks'}
          Write-Host 'R5 SELFHEAL SAFETY PASS'
      - name: Commit watcher patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo NO_PATCH_COMMIT_NEEDED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/AFZ-Site-Deploy-Request-Watcher.ps1
          git commit -m 'Wire exact R5 orphan SSH self-heal into site watcher'
          git push origin HEAD:fix/afz-r5-orphan-git-selfheal
