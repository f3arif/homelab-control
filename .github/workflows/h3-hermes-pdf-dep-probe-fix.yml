name: H3 Hermes PDF Dependency Probe Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace fragile dependency probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1')
          text = path.read_text(encoding='utf-8')
          start_marker = "  $depCode='import json,importlib.util;mods=[\"pypdf\",\"reportlab\",\"pdfplumber\"];print(json.dumps({m:(importlib.util.find_spec(m) is not None) for m in mods}))'"
          end_marker = "  $installed=$false;$pipExit=$null;$pipErrBytes=0;$preFreeze=$null"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Existing dependency probe block not found')
          old_block = text[start:end]
          if old_block.count('$deps.pypdf') != 1:
              raise SystemExit('Unexpected dependency probe shape')

          replacement_b64 = ''
          replacement = base64.b64decode(replacement_b64).decode('utf-8')
          text = text[:start] + replacement + text[end:]
          required = [
              '-TimeoutMs 420000',
              'HERMES_PDF_DEPENDENCY_PROBE_INVALID_OUTPUT',
              "pypdf=$false;reportlab=$false;pdfplumber=$false",
              "documentTextReturned=$false",
              "providerTouched=$false",
              "ollamaMutationStarted=$false",
              "networkChanged=$false",
              "modelGenerationStarted=$false",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing invariant: ' + marker)
          if '$deps.pypdf' in text:
              raise SystemExit('Fragile dependency property access remains')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Parse helper and enforce guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'PDF helper parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('-TimeoutMs 420000','HERMES_PDF_DEPENDENCY_PROBE_INVALID_OUTPUT','pypdf','reportlab','pdfplumber','documentTextReturned=$false','providerTouched=$false','ollamaMutationStarted=$false','networkChanged=$false','modelGenerationStarted=$false')){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          if($c.Contains('$deps.pypdf')){throw 'Fragile property access remains'}
          'H3_HERMES_PDF_DEP_PROBE_FIX=PASS'

      - name: Commit helper patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Harden H3 Hermes PDF dependency probe'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
