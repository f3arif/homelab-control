name: FamilyPTT Porkbun DNS Provision R11

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/familyptt-dns-provision-r11.yml'
      - '.github/scripts/familyptt_porkbun_dns_r11.py'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out control repository
        uses: actions/checkout@v4

      - name: Provision exact FamilyPTT DNS records
        id: provision
        continue-on-error: true
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_API_KEY: ${{ secrets.PORKBUN_SECRET_API_KEY }}
        run: python3 .github/scripts/familyptt_porkbun_dns_r11.py

      - name: Publish sanitized result to issue 17
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('familyptt-dns-r11-result.json')
          if path.exists():
              result = json.loads(path.read_text(encoding='utf-8'))
          else:
              result = {
                  'status': 'ERROR',
                  'classification': 'PORKBUN_DNS_WORKFLOW_RESULT_MISSING',
                  'error': 'Provision helper did not create a result file',
                  'records': [],
              }

          lines = ['### FamilyPTT Porkbun DNS provisioning R11', '']
          if result.get('status') == 'SUCCESS':
              lines.append('Exact-scope Porkbun DNS provisioning completed and was verified through the Porkbun API.')
              lines.append('')
              for record in result.get('records', []):
                  lines.append(
                      f"- `{record.get('host')}` -> `{record.get('content')}` "
                      f"(`{record.get('action')}`, verified={record.get('verified')})"
                  )
          else:
              lines.append('Provisioning stopped safely before completion.')
              lines.append('')
              lines.append(f"Sanitized error: `{result.get('error', 'unknown')}`")

          lines.extend([
              '',
              'No Porkbun API key or secret value was printed or committed.',
              '',
              f"Classification: `{result.get('classification', 'UNKNOWN')}`",
          ])
          Path('/tmp/familyptt-r11-comment.json').write_text(
              json.dumps({'body': '\n'.join(lines)}), encoding='utf-8'
          )
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/17/comments" --input /tmp/familyptt-r11-comment.json >/dev/null

      - name: Enforce successful provisioning
        shell: bash
        run: |
          classification=$(python3 -c "import json; print(json.load(open('familyptt-dns-r11-result.json'))['classification'])")
          test "$classification" = 'PORKBUN_DNS_PROVISIONED_VERIFIED'
