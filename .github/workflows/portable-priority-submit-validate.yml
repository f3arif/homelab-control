name: Validate portable priority submitter

on:
  push:
    branches:
      - afz/portable-submit-compat
    paths:
      - afz-openai-agent/legacy-priority/AFZ-Priority-Submit.ps1
      - .github/workflows/portable-priority-submit-validate.yml
  pull_request:
    paths:
      - afz-openai-agent/legacy-priority/AFZ-Priority-Submit.ps1
      - .github/workflows/portable-priority-submit-validate.yml

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'afz-openai-agent\legacy-priority\AFZ-Priority-Submit.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell parse PASS"
