name: Hermes HP Envy Primary Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/remoteops/hpenvy-hermes-*.sh'
      - 'afz-openai-agent/requests/hpenvy-hermes-primary.json'
      - '.github/workflows/hermes-hpenvy-primary-validate.yml'
  push:
    branches: [main]
    paths:
      - 'afz-openai-agent/remoteops/hpenvy-hermes-*.sh'
      - 'afz-openai-agent/requests/hpenvy-hermes-primary.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse shell scripts
        run: |
          bash -n afz-openai-agent/remoteops/hpenvy-hermes-user-preflight.sh
          bash -n afz-openai-agent/remoteops/hpenvy-hermes-user-install.sh
          bash -n afz-openai-agent/remoteops/hpenvy-hermes-credential-plumbing-audit.sh
      - name: Validate HP primary safety contract
        shell: pwsh
        run: |
          $r=Get-Content 'afz-openai-agent/requests/hpenvy-hermes-primary.json' -Raw|ConvertFrom-Json
          if([int]$r.schema -ne 1 -or [string]$r.action -ne 'install-and-configure-primary' -or [string]$r.status -ne 'active'){throw 'request state'}
          if([string]$r.target -ne 'hpenvy' -or [string]$r.host -ne 'hpenvy' -or [string]$r.remote_user -ne 'coolyo' -or [string]$r.tailscale_ip -ne '100.71.26.69'){throw 'target'}
          if([string]$r.role -ne 'persistent-hermes-controller-primary'){throw 'role'}
          if([string]$r.install_scope -ne 'coolyo-user-standard-native-linux'){throw 'scope'}
          if([string]$r.hermes_commit -ne 'f50b5bb0fa5b48caef753c790bf0b09a3570918a'){throw 'pin'}
          if([string]$r.hermes_home -ne '/home/coolyo/.hermes' -or [string]$r.install_dir -ne '/home/coolyo/.hermes/hermes-agent'){throw 'paths'}
          if(-not [bool]$r.skip_interactive_setup -or -not [bool]$r.skip_browser -or -not [bool]$r.skip_computer_use){throw 'unattended flags'}
          if([string]$r.provider_target -ne 'openai-api' -or [string]$r.provider_secret_source -ne 'reuse-existing-afz-openai-environment-reference' -or [bool]$r.write_provider_secret_to_config){throw 'provider secret policy'}
          if([bool]$r.start_gateway -or [bool]$r.run_generation_test -or [bool]$r.modify_tailscale_ssh -or [bool]$r.modify_firewall -or [bool]$r.use_sudo){throw 'unsafe request flags'}
          if([string]$r.control_plane -ne 'github'){throw 'control plane'}
          $all=(Get-Content 'afz-openai-agent/remoteops/hpenvy-hermes-user-preflight.sh' -Raw)+(Get-Content 'afz-openai-agent/remoteops/hpenvy-hermes-user-install.sh' -Raw)+(Get-Content 'afz-openai-agent/remoteops/hpenvy-hermes-credential-plumbing-audit.sh' -Raw)
          foreach($required in @('f50b5bb0fa5b48caef753c790bf0b09a3570918a','/home/coolyo/.hermes','--skip-setup','--skip-browser','--skip-computer-use','--non-interactive','GATEWAY_STARTED=false','GENERATION_TEST_STARTED=false','SECRET_VALUES_EMITTED=false')){if(-not $all.Contains($required)){throw "Missing invariant: $required"}}
          foreach($forbidden in @('sudo ','systemctl enable','systemctl start','tailscale set','tailscale up','ufw allow','iptables ','nft add','/chat/completions','hermes gateway start','hermes gateway install')){if($all.ToLowerInvariant().Contains($forbidden.ToLowerInvariant())){throw "Forbidden behavior: $forbidden"}}
