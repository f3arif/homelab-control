name: H3 Hermes PDF Clean Verification Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize pip bootstrap state on clean path
        shell: python
        run: |
          from pathlib import Path
          p=Path('afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1')
          text=p.read_text(encoding='utf-8')
          old="$installed=$false;$pipExit=$null;$pipErrBytes=0;$preFreeze=$null\n  if(-not $depsReady){"
          new="$installed=$false;$pipBootstrapped=$false;$pipExit=$null;$pipErrBytes=0;$preFreeze=$null\n  if(-not $depsReady){"
          if new not in text:
              if old not in text: raise SystemExit('clean-path initialization anchor missing')
              text=text.replace(old,new,1)
          inner="    $pipBootstrapped=$false\n    Stage 'pip-probe'"
          if inner in text:
              text=text.replace(inner,"    Stage 'pip-probe'",1)
          if text.count('$pipBootstrapped=$false') != 1:
              raise SystemExit('pipBootstrapped must be initialized exactly once')
          for marker in ['-TimeoutMs 600000','AFZPDF_STAGE=',"'pypdf','reportlab','pdfplumber'",'documentTextReturned=$false','providerTouched=$false','ollamaMutationStarted=$false','networkChanged=$false','modelGenerationStarted=$false']:
              if marker not in text: raise SystemExit('missing invariant: '+marker)
          p.write_text(text,encoding='utf-8',newline='\n')

      - name: Validate helper under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent\Invoke-H3-Hermes-PdfRuntimeAudit.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'PDF helper parse failed'}
          $c=Get-Content $p -Raw
          if(([regex]::Matches($c,[regex]::Escape('$pipBootstrapped=$false'))).Count -ne 1){throw 'pipBootstrapped initialization count invalid'}
          foreach($required in @('-TimeoutMs 600000','AFZPDF_STAGE=',"'pypdf','reportlab','pdfplumber'",'documentTextReturned=$false','providerTouched=$false','ollamaMutationStarted=$false','networkChanged=$false','modelGenerationStarted=$false')){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          'H3_HERMES_PDF_CLEAN_PATH_STATE_FIX=PASS'

      - name: Commit helper patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Fix H3 PDF clean verification state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
