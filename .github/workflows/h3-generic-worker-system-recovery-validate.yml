name: H3 Generic Worker SYSTEM Recovery Validate

on:
  pull_request:
    paths:
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1'
      - 'afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1'
      - 'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1'
      - '.github/workflows/h3-generic-worker-system-recovery-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse affected scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths=@(
            'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1',
            'afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1',
            'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $errors|Format-List|Out-String|Write-Error
              throw "PowerShell parse failed: $path"
            }
          }
          'POWERSHELL_PARSE=PASS'

      - name: Prove preserved sync core is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git hash-object afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1)
          test "$actual" = 'b2086a00fd196a86b86a7a248f5521e73d984e4e'
          echo 'SYNC_CORE_BLOB_IDENTITY=PASS'

      - name: Verify bounded recovery safety contract
        shell: powershell
        run: |
          $wrapper=Get-Content 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1' -Raw
          $helper=Get-Content 'afz-openai-agent/Invoke-H3-GenericWorker-Recovery.ps1' -Raw

          foreach($needle in @(
            'Sync-AFZ-AgentFromGitHub-Core.ps1',
            'Invoke-H3-GenericWorker-Recovery.ps1',
            'h3GenericWorkerRecovery'
          )){if(-not $wrapper.Contains($needle)){throw "Wrapper invariant missing: $needle"}}

          foreach($needle in @(
            "C:\ProgramData\AFZ\OpenAIAgent\keys\afz_h3_worker_system",
            "AFZ H3 Generic Worker",
            "C:\AFZ\H3Worker\AFZ-H3-Worker.ps1",
            "C:\AFZ\H3Worker\Run-AFZ-H3-Worker-Task-Hidden.vbs",
            'Principal.UserId -match',
            'Faiz$',
            "Principal.LogonType -eq 'Interactive'",
            'Start-ScheduledTask -TaskName $taskName',
            'H3_GENERIC_WORKER_ALREADY_RUNNING',
            'H3_GENERIC_WORKER_STARTED_EXISTING_HIDDEN_TASK',
            'StrictHostKeyChecking=yes',
            'IdentitiesOnly=yes',
            'RedirectStandardInput $inFile',
            '[Console]::In.ReadToEnd()',
            'Invoke-Expression $script',
            '[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($bootstrap))',
            "'-EncodedCommand',$bootstrapEncoded",
            '[IO.File]::WriteAllText($inFile,$RemoteScript,$utf8)',
            'hiddenActionVerified',
            'principalVerified',
            'b61d8eb4e625549836c504d102bc0139d1c97786447e2ea071ac9dbc8f02795e',
            'a09e67601c7261dc38d430c62f01395df4649cb10a487a7ae9aa74e0d06e7d55',
            '.bak-corrupt-a09e6760',
            'REPAIR_KNOWN_CORRUPT_LAUNCHER_ONLY',
            'H3_GENERIC_WORKER_LAUNCHER_REPAIRED_STALE_TASK_RUNNING',
            'Generic Worker script hash mismatch; refusing launcher repair/start.',
            'Known corrupt launcher hash matched but content did not match the audited truncated launcher; refusing write.',
            '[IO.File]::WriteAllBytes($launcherBackup,[IO.File]::ReadAllBytes($expectedLauncher))',
            'Move-Item -LiteralPath $tmpLauncher -Destination $expectedLauncher -Force',
            'Repaired launcher content verification failed.'
          )){if(-not $helper.Contains($needle)){throw "Recovery invariant missing: $needle"}}

          if($helper.Contains("'-Command','-'")){throw 'Ambiguous PowerShell -Command - stdin transport must not return.'}
          if($helper -match '(?i)ToBase64String[^\r\n]*RemoteScript'){throw 'Full remote recovery script must never be encoded onto the SSH command line.'}
          if($helper.Contains('C:\Users\Faiz\.ssh\afz_h3_worker')){throw 'Interactive/user H3 key must not be used by SYSTEM recovery.'}
          if($helper.Contains("Run-AFZ-H3-Worker-Hidden")){throw 'Recovery must not use the obsolete fuzzy launcher name.'}
          foreach($forbidden in @(
            'Register-ScheduledTask',
            'Set-ScheduledTask',
            'Stop-ScheduledTask',
            'Unregister-ScheduledTask',
            'Disable-ScheduledTask',
            'Stop-Process',
            'Set-Acl',
            'icacls.exe',
            'Remove-Item -LiteralPath $key'
          )){if($helper.Contains($forbidden)){throw "Forbidden mutation primitive present: $forbidden"}}

          $startMatches=[regex]::Matches($helper,'Start-ScheduledTask').Count
          if($startMatches -ne 1){throw "Expected exactly one Start-ScheduledTask occurrence; found $startMatches"}
          $encodedMatches=[regex]::Matches($helper,'ToBase64String').Count
          if($encodedMatches -ne 1){throw "Expected exactly one tiny bootstrap encoding operation; found $encodedMatches"}
          $launcherMoveMatches=[regex]::Matches($helper,'Move-Item -LiteralPath \$tmpLauncher -Destination \$expectedLauncher -Force').Count
          if($launcherMoveMatches -ne 1){throw "Expected exactly one guarded launcher replacement; found $launcherMoveMatches"}
          'H3_GENERIC_RECOVERY_SAFETY=PASS'
