name: Pi Relay Read Only Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pi-relay-readonly-discovery.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Read Pi H3 status endpoint without mutation
        shell: bash
        run: |
          set +e
          host=100.91.50.9
          echo '=== TAILSCALE PING ==='
          tailscale ping --timeout=5s -c 1 "$host"
          echo "TAILSCALE_PING_EXIT=$?"
          echo '=== TCP 8087 ==='
          if timeout 4 bash -c "</dev/tcp/$host/8087" 2>/dev/null; then
            echo 'TCP_8087=OPEN'
          else
            echo 'TCP_8087=CLOSED_OR_FILTERED'
          fi
          echo '=== GET /status/h3 ==='
          curl --silent --show-error --include --connect-timeout 4 --max-time 10 "http://$host:8087/status/h3"
          echo
          echo "CURL_STATUS_H3_EXIT=$?"
          echo '=== GET /health ==='
          curl --silent --show-error --include --connect-timeout 4 --max-time 10 "http://$host:8087/health"
          echo
          echo "CURL_HEALTH_EXIT=$?"
          exit 0
