name: AFZ Updater Strict Sync Patch

on:
  push:
    branches:
      - fix/afz-updater-strict-sync-result
    paths:
      - '.github/workflows/afz-updater-strict-sync-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/afz-updater-strict-sync-result
          fetch-depth: 0

      - name: Apply exact updater result validation patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1')
          text = p.read_text(encoding='utf-8')
          old = """  try{\n    $syncArgs=@('-NoProfile','-ExecutionPolicy','Bypass','-File',$tmpSync,'-InstallRoot',$InstallRoot)\n    if($ExpectedSha){$syncArgs+=@('-ExpectedSha',$ExpectedSha)}\n    $syncResult=& powershell.exe @syncArgs | Select-Object -Last 1\n  }finally{Remove-Item -LiteralPath $tmpSync -Force -ErrorAction SilentlyContinue}\n  if(-not $syncResult){throw 'Agent source sync returned no result'}\n  if($syncResult -is [string]){try{$syncResult=$syncResult|ConvertFrom-Json}catch{}}\n  $changed=[bool]$syncResult.changed\n  $remoteSha=[string]$syncResult.remoteSha\n"""
          new = """  try{\n    $syncArgs=@('-NoProfile','-ExecutionPolicy','Bypass','-File',$tmpSync,'-InstallRoot',$InstallRoot)\n    if($ExpectedSha){$syncArgs+=@('-ExpectedSha',$ExpectedSha)}\n    $syncRaw=@(& powershell.exe @syncArgs 2>&1)\n    $syncExit=$LASTEXITCODE\n  }finally{Remove-Item -LiteralPath $tmpSync -Force -ErrorAction SilentlyContinue}\n  if($syncExit -ne 0){\n    $syncText=($syncRaw|ForEach-Object{[string]$_}) -join [Environment]::NewLine\n    throw \"Agent source sync failed exit=$syncExit output=$syncText\"\n  }\n  $syncLine=($syncRaw|ForEach-Object{[string]$_}|Where-Object{-not [string]::IsNullOrWhiteSpace($_)}|Select-Object -Last 1)\n  if([string]::IsNullOrWhiteSpace($syncLine)){throw 'Agent source sync returned no result'}\n  try{$syncResult=$syncLine|ConvertFrom-Json -ErrorAction Stop}catch{throw \"Agent source sync returned invalid JSON: $syncLine\"}\n  $remoteSha=([string]$syncResult.remoteSha).Trim().ToLowerInvariant()\n  if($remoteSha -notmatch '^[0-9a-f]{40}$'){throw \"Agent source sync returned invalid remoteSha: $remoteSha\"}\n  if($ExpectedSha -and $remoteSha -ne $ExpectedSha){throw \"Agent source sync returned unexpected remoteSha: actual=$remoteSha expected=$ExpectedSha\"}\n  $changed=[bool]$syncResult.changed\n"""
          if text.count(old) != 1:
              raise SystemExit(f'exact source block count was {text.count(old)}, expected 1')
          p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

      - name: Validate patch contract
        shell: python
        run: |
          from pathlib import Path
          text = Path('afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1').read_text(encoding='utf-8')
          required = [
              '$syncExit=$LASTEXITCODE',
              "if($syncExit -ne 0)",
              'ConvertFrom-Json -ErrorAction Stop',
              "if($remoteSha -notmatch '^[0-9a-f]{40}$')",
              'if($ExpectedSha -and $remoteSha -ne $ExpectedSha)'
          ]
          for token in required:
              assert token in text, token
          assert "$syncResult=& powershell.exe @syncArgs | Select-Object -Last 1" not in text
          print('STRICT_SYNC_RESULT_CONTRACT=PASS')

      - name: Commit updater patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch required'; exit 0; }
          git commit -m 'Fail updater on invalid child sync result'
          git push origin HEAD:fix/afz-updater-strict-sync-result
