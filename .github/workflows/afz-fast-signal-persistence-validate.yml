name: AFZ Fast Signal Persistence Validate

on:
  push:
    branches:
      - fix/afz-fast-signal-persistence
      - fix/afz-direct-push-recovery
      - fix/afz-fast-signal-monotonic
      - fix/afz-push-watcher-hot-reload
    paths:
      - 'afz-openai-agent/Push-Deploy-Watcher.ps1'
      - 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/Install-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/Start-AFZ-OpenAI-Agent.ps1'
      - '.github/workflows/afz-agent-push-deploy.yml'
      - '.github/workflows/afz-fast-signal-persistence-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'afz-openai-agent/Push-Deploy-Watcher.ps1'
      - 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/Install-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/Start-AFZ-OpenAI-Agent.ps1'
      - '.github/workflows/afz-agent-push-deploy.yml'
      - '.github/workflows/afz-fast-signal-persistence-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell transport sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'afz-openai-agent/Push-Deploy-Watcher.ps1',
            'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1',
            'afz-openai-agent/Install-AFZ-OpenAI-Agent.ps1',
            'afz-openai-agent/Start-AFZ-OpenAI-Agent.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw "PowerShell parse failed: $file"}
            Write-Host "PARSE PASS $file"
          }

      - name: Validate persistent watcher and diagnostic-only ack contract
        shell: python
        run: |
          from pathlib import Path

          push=Path('afz-openai-agent/Push-Deploy-Watcher.ps1').read_text()
          update=Path('afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1').read_text()
          install=Path('afz-openai-agent/Install-AFZ-OpenAI-Agent.ps1').read_text()
          start=Path('afz-openai-agent/Start-AFZ-OpenAI-Agent.ps1').read_text()

          task='AFZ OpenAI Agent Push Deploy Watcher'
          ack='AFZ-GITHUB-TRANSPORT-ACK-LATEST.json'
          purpose='EMERGENCY_DIAGNOSTIC_ACK_ONLY'

          assert task in update
          assert 'Register-ScheduledTask -TaskName $pushWatcherTaskName' in update
          assert task in install
          assert 'Register-ScheduledTask -TaskName $pushWatcherTask' in install
          assert 'Start-ScheduledTask -TaskName $pushWatcherTask' in install
          assert task in start
          assert 'if(-not $pushTask -and (Test-Path $watcherSrc))' in start
          assert task in push
          assert ack in push and ack in update
          assert purpose in push and purpose in update

          # Diagnostic ack is write-only observability, never a control/request input.
          for text in (push, update):
            for line in text.splitlines():
              if ack in line:
                assert 'Get-Content' not in line
          assert "controlPlane='github'" in push
          assert "controlPlane='github'" in update

          # Fast signals are acceleration hints, not rollback authority. A delayed
          # signal already contained by the deployed commit must be marked handled
          # without invoking an exact-SHA updater pass.
          required_monotonic=[
            'Current-ContainsSignal',
            'https://api.github.com/repos/f3arif/homelab-control/compare',
            "@('ahead','identical')",
            'Signal already contained by current source=',
            'source-already-newer',
            'DEPLOY_SKIP_ANCESTOR'
          ]
          for marker in required_monotonic:
            assert marker in push, marker
          guard=push.index('if(Current-ContainsSignal $before $sha)')
          updater=push.index('$code=Invoke-UpdaterPass $updater $sha 1')
          assert guard < updater, 'monotonic ancestry guard must run before exact-SHA updater'

          # A script replacement does not update a long-lived watcher process. The
          # independent fallback updater must refresh the task once per new watcher
          # hash, while exact-SHA passes invoked by the watcher must never stop their
          # own parent process.
          required_refresh=[
            'push-watcher-source.sha256',
            'Get-FileHash -LiteralPath $pushWatcher -Algorithm SHA256',
            '$pushWatcherNeedsRefresh=([string]::IsNullOrWhiteSpace($ExpectedSha)',
            'if($pushWatcherNeedsRefresh)',
            'Ensure-Running $pushWatcherTaskName $true',
            'Set-Content -LiteralPath $pushWatcherHashMarker -Value $pushWatcherSourceHash -Encoding ASCII',
            'pushWatcherRestarted=$pushWatcherRestarted'
          ]
          for marker in required_refresh:
            assert marker in update, marker
          refresh_guard=update.index('$pushWatcherNeedsRefresh=([string]::IsNullOrWhiteSpace($ExpectedSha)')
          restart_call=update.index('Ensure-Running $pushWatcherTaskName $true')
          assert refresh_guard < restart_call
          assert 'Ensure-Running $pushWatcherTaskName $false' in update

          # Transport repair must remain scope-neutral even when a separate website
          # request exists elsewhere in the repository.
          assert 'afz-site-deploy.json' not in push
          assert 'deploy-pi-static-site' not in push
          print('FAST SIGNAL PERSISTENCE CONTRACT PASS')

      - name: Validate exact-SHA signal publisher remains GitHub-only
        shell: python
        run: |
          from pathlib import Path
          y=Path('.github/workflows/afz-agent-fast-signal.yml').read_text()
          assert "context.sha" in y
          assert ".github/afz-agent-deploy-signal.txt" in y
          assert "permissions:\n  contents: write" in y
          assert 'OneDrive' not in y
          assert 'SharePoint' not in y
          print('SIGNAL PUBLISHER CONTRACT PASS')

      - name: Validate direct Tailscale recovery contract
        shell: python
        run: |
          from pathlib import Path
          y=Path('.github/workflows/afz-agent-push-deploy.yml').read_text()
          required=[
            "'.github/afz-agent-direct-push.txt'",
            'tailscale/github-action@v4',
            'tags: tag:afz-deploy',
            'http://100.70.25.8:8797/api/push-deploy',
            '"repository":"f3arif/homelab-control"',
            '"ref":"refs/heads/main"',
            'http://100.70.25.8:8797/health',
            'Windows-main exact source confirmed',
            'cancel-in-progress: true'
          ]
          for marker in required:
            assert marker in y, marker
          assert 'OneDrive' not in y
          assert 'SharePoint' not in y
          assert 'afz-site-deploy.json' not in y
          print('DIRECT PUSH RECOVERY CONTRACT PASS')
