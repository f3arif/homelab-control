name: AFZ Nuvio add-on setup source probe
on:
  push:
    branches: ['fix/nuvio-addon-setup-r33-20261011']
    paths: ['.github/workflows/afz-nuvio-addon-setup-r33.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: afz-nuvio-addon-setup-r33
  cancel-in-progress: false
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join existing AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy
      - name: Inspect exact R32 source through existing HP relay
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s tailscale ssh coolyo@100.71.26.69 'ssh -i /home/coolyo/.ssh/afz-nextcloud-h3 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 Faiz@100.106.186.118 powershell.exe -NoProfile -NonInteractive -EncodedCommand '
