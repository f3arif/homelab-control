name: Media Public Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/media-public-smoke-signal.txt'

permissions:
  contents: read

concurrency:
  group: media-public-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public media boundary
        shell: bash
        run: |
          set -euo pipefail

          request_code=$(curl -L -sS -o /tmp/request.html -w '%{http_code}' --connect-timeout 5 --max-time 20 https://request.afzeng.ca/login)
          test "$request_code" = "200"
          echo "request.afzeng.ca/login: HTTP $request_code (public as intended)"

          set +e
          jellyfin_code=$(curl -L -sS -o /tmp/jellyfin-public.out -w '%{http_code}' --connect-timeout 5 --max-time 20 https://jellyfin.afzeng.ca/System/Info/Public)
          jellyfin_rc=$?
          set -e

          if [ "$jellyfin_rc" -eq 0 ]; then
            case "$jellyfin_code" in
              2*|3*)
                echo "ERROR: jellyfin.afzeng.ca is publicly reachable with HTTP $jellyfin_code"
                exit 1
                ;;
            esac
          fi

          echo "jellyfin.afzeng.ca: public access blocked as intended (curl_rc=$jellyfin_rc http=$jellyfin_code)"
