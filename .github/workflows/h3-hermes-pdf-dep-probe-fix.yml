name: H3 Hermes PDF Python Exit Canary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

jobs:
  canary:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact Run-Python canary
        shell: python
        run: |
          from pathlib import Path
          text = Path('afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1').read_text(encoding='utf-8')
          start = text.index('function Run-Python([string[]]$PyArgs,[int]$TimeoutSeconds){')
          end = text.index('\ntry{\n  if($env:COMPUTERNAME', start)
          fn = text[start:end]
          canary = fn + r'''
          $ErrorActionPreference='Stop'
          $script:python=(Get-Command python.exe -ErrorAction Stop).Source

          $ok=Run-Python -PyArgs @('-c','import sys;print("AFZ_OK:"+sys.argv[1])','argument with spaces') -TimeoutSeconds 15
          if($ok.timedOut -or $ok.exit -ne 0){throw "success canary exit=$($ok.exit) stderr=$($ok.stderrPreview)"}
          if(([string]$ok.stdout).Trim() -ne 'AFZ_OK:argument with spaces'){throw "success stdout mismatch: $($ok.stdout)"}

          $bad=Run-Python -PyArgs @('-c','raise RuntimeError("AFZ_EXPECTED_FAILURE")') -TimeoutSeconds 15
          if($bad.timedOut){throw 'failure canary timed out'}
          if($bad.exit -eq 0){throw "failure exit incorrectly reported zero; stderr=$($bad.stderrPreview)"}
          if(([string]$bad.stderrPreview) -notmatch 'AFZ_EXPECTED_FAILURE'){throw "failure stderr missing expected marker: $($bad.stderrPreview)"}

          "SUCCESS_EXIT=$($ok.exit)"
          "FAILURE_EXIT=$($bad.exit)"
          'H3_HERMES_PDF_RUN_PYTHON_EXIT_CANARY=PASS'
          '''
          Path('run-python-exit-canary.ps1').write_text(canary, encoding='utf-8', newline='\n')

      - name: Run under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\run-python-exit-canary.ps1
          if($LASTEXITCODE -ne 0){throw "exit canary process failed: $LASTEXITCODE"}
