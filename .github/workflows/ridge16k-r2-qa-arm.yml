name: Ridge16K R2 QA Arm

on:
  push:
    paths:
      - '.github/workflows/ridge16k-r2-qa-arm.yml'

permissions:
  contents: write

jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch post-sync hook and create typed QA request
        shell: python
        run: |
          from pathlib import Path
          import json

          sync = Path('afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1')
          text = sync.read_text(encoding='utf-8')

          fn = r'''function Start-Ridge16KQualityAuditOneShot {
            param([string]$SyncedSha)
            $jobId='qwenridge16k-afz-website-20260902-r2-qa01'
            $request=Join-Path $InstallRoot 'afz-openai-agent\requests\h3-qwenridge16k-quality-audit.json'
            $bootstrap=Join-Path $InstallRoot 'afz-openai-agent\Bootstrap-H3-QwenRidge16K-QualityAudit.ps1'
            $markerRoot='C:\ProgramData\AFZ\OpenAIAgent\jobs\h3-qwenridge16k-qa-request'
            $marker=Join-Path $markerRoot ($jobId+'-activation-v1.json')
            New-Item -ItemType Directory -Force -Path $markerRoot|Out-Null

            if(Test-Path -LiteralPath $marker -PathType Leaf){
              try{return Get-Content -LiteralPath $marker -Raw|ConvertFrom-Json}catch{return [ordered]@{ok=$true;status='already-activated';jobId=$jobId;marker=$marker;syncedSha=$SyncedSha}}
            }
            if(-not(Test-Path -LiteralPath $request -PathType Leaf)){return [ordered]@{ok=$true;status='request-missing-not-armed';jobId=$jobId;syncedSha=$SyncedSha}}
            if(-not(Test-Path -LiteralPath $bootstrap -PathType Leaf)){return [ordered]@{ok=$false;status='bootstrap-missing';jobId=$jobId;path=$bootstrap;syncedSha=$SyncedSha}}

            try{
              $r=Get-Content -LiteralPath $request -Raw -Encoding UTF8|ConvertFrom-Json
              $routes=@($r.required_routes|ForEach-Object {[string]$_})
              $expected=@('/','/services','/projects','/about','/contact')
              if([int]$r.schema -ne 1 -or [string]$r.project -ne 'qwenridge16k-readonly-quality-audit' -or [string]$r.job_id -ne $jobId -or [string]$r.source_job_id -ne 'qwenridge16k-afz-website-20260902-r2' -or [string]$r.project_root -ne 'C:\Projects\Qwen38-Ridge16K-AFZ-Website-Test-20260902-r2' -or -not [bool]$r.no_model_calls -or [bool]$r.site_mutation_allowed -or $routes.Count -ne 5){
                return [ordered]@{ok=$false;status='request-contract-invalid';jobId=$jobId;syncedSha=$SyncedSha}
              }
              foreach($route in $expected){if($routes -notcontains $route){return [ordered]@{ok=$false;status='request-route-contract-invalid';jobId=$jobId;route=$route;syncedSha=$SyncedSha}}}
              $argLine="-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$bootstrap`" -ExpectedSha `"$SyncedSha`" -JobId `"$jobId`""
              $p=Start-Process -FilePath 'powershell.exe' -ArgumentList $argLine -WindowStyle Hidden -PassThru
              $o=[ordered]@{ok=$true;status='bootstrap-started';jobId=$jobId;expectedSha=$SyncedSha;bootstrapPid=$p.Id;marker=$marker;activatedAt=(Get-Date -Format o);modelCalls=0;siteMutationAllowed=$false}
              $o|ConvertTo-Json -Depth 10 -Compress|Set-Content -LiteralPath $marker -Encoding UTF8
              return $o
            }catch{
              return [ordered]@{ok=$false;status='activation-exception';jobId=$jobId;syncedSha=$SyncedSha;error=$_.Exception.Message}
            }
          }'''

          marker = 'function Start-Ridge16KQualityAuditOneShot'
          if marker not in text:
              needle = "if(-not [string]::IsNullOrWhiteSpace($ExpectedSha)){"
              if needle not in text:
                  raise SystemExit('post-sync function insertion point missing')
              text = text.replace(needle, fn + '\n\n' + needle, 1)

          call = '  $ridge16KQAActivation=Start-Ridge16KQualityAuditOneShot -SyncedSha $resolvedSha'
          if call not in text:
              needle = '  $qwen35BActivation=Start-Qwen35BOneShot -SyncedSha $resolvedSha'
              if needle not in text:
                  raise SystemExit('post-sync activation insertion point missing')
              text = text.replace(needle, needle + '\n\n  # Read-only Ridge16K r2 visual/content QA. The typed request forbids model calls and site mutation.\n' + call, 1)

          out = "  $out['qwenRidge16KQAActivation']=$ridge16KQAActivation"
          if out not in text:
              needle = "  $out['qwen35BA3BActivation']=$qwen35BActivation"
              if needle not in text:
                  raise SystemExit('post-sync result insertion point missing')
              text = text.replace(needle, needle + '\n' + out, 1)

          sync.write_text(text, encoding='utf-8', newline='\n')

          req = {
              'schema': 1,
              'project': 'qwenridge16k-readonly-quality-audit',
              'job_id': 'qwenridge16k-afz-website-20260902-r2-qa01',
              'source_job_id': 'qwenridge16k-afz-website-20260902-r2',
              'project_root': r'C:\Projects\Qwen38-Ridge16K-AFZ-Website-Test-20260902-r2',
              'no_model_calls': True,
              'site_mutation_allowed': False,
              'required_routes': ['/', '/services', '/projects', '/about', '/contact'],
              'capture_desktop': True,
              'capture_mobile': True,
              'publish_branch': 'h3-direct-results'
          }
          req_path = Path('afz-openai-agent/requests/h3-qwenridge16k-quality-audit.json')
          req_path.parent.mkdir(parents=True, exist_ok=True)
          req_path.write_text(json.dumps(req, indent=2) + '\n', encoding='utf-8')

      - name: Validate PowerShell AST
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1',
            'afz-openai-agent/Bootstrap-H3-QwenRidge16K-QualityAudit.ps1',
            'afz-openai-agent/tools/Run-WindowsMain-H3-QwenRidge16K-QualityAudit-Carrier.ps1',
            'afz-openai-agent/tools/Launch-H3-QwenRidge16K-QualityAudit.ps1',
            'afz-openai-agent/tools/Start-H3-QwenRidge16K-QualityAudit.ps1'
          )
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw "$file parse failure: $($errors.Message -join '; ')"}
          }
          $req=Get-Content 'afz-openai-agent/requests/h3-qwenridge16k-quality-audit.json' -Raw|ConvertFrom-Json
          if(-not $req.no_model_calls -or $req.site_mutation_allowed){throw 'QA safety request flags invalid'}
          if($req.job_id -ne 'qwenridge16k-afz-website-20260902-r2-qa01'){throw 'Unexpected QA job id'}

      - name: Commit validated QA arm
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1 afz-openai-agent/requests/h3-qwenridge16k-quality-audit.json
          if git diff --cached --quiet; then
            echo 'No QA arming changes needed.'
            exit 0
          fi
          git commit -m 'Arm read-only Ridge16K r2 quality audit'
          git pull --rebase origin main
          git push origin HEAD:main
