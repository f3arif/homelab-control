name: Windows-main Direct Commander Device Code

on:
  push:
    branches: [main]
    paths:
      - '.github/windowsmain-dc-direct-signal.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: windowsmain-dc-direct
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy
          args: --accept-dns=false

      - name: Publish runner IP and wait for direct access
        id: allow
        shell: bash
        run: |
          set -euo pipefail
          ip=$(tailscale ip -4 | head -n1)
          test -n "$ip"
          echo "runner_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "DIRECT_RUNNER_TAILSCALE_IP=$ip"
          for i in $(seq 1 100); do
            code=$(curl -sS -o /tmp/afz-health.json -w '%{http_code}' --connect-timeout 3 --max-time 6 http://100.70.25.8:8796/health || true)
            echo "allowlist_wait_attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/afz-health.json
              exit 0
            fi
            sleep 4
          done
          echo 'Runner IP was not allowlisted in time' >&2
          exit 1

      - name: Wait for direct agent v2.0.1
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if body=$(curl -fsS --connect-timeout 3 --max-time 8 http://100.70.25.8:8796/health 2>/dev/null); then
              echo "$body"
              if python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("version")=="2.0.1" else 1)' <<<"$body"; then
                exit 0
              fi
            fi
            sleep 4
          done
          echo 'Direct agent did not reach version 2.0.1' >&2
          exit 1

      - name: Request fresh Commander device code directly
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --connect-timeout 3 --max-time 90 -X POST http://100.70.25.8:8796/api/desktop-commander/device-code)
          echo "$body"
          BODY="$body" python - <<'PY'
          import json, os
          d=json.loads(os.environ['BODY'])
          assert d.get('ok') is True, d
          print('DIRECT_STATE='+str(d.get('state')))
          print('VERIFY_URL='+str(d.get('verifyUrl')))
          print('DEVICE_CODE='+str(d.get('deviceCode')))
          print('TASK_STATE='+str(d.get('taskState')))
          print('PERSISTED_AUTOSTART='+str(d.get('persistedAutostart')))
          PY
