name: Patch AFZ Site ACK Safety Comment
on:
  push:
    branches:
      - fix/afz-site-ack-safety-comment
    paths:
      - .github/workflows/afz-site-ack-safety-comment-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/afz-site-ack-safety-comment
      - name: Restore documented fail-open invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1')
          s=p.read_text(encoding='utf-8-sig')
          phrase='failure to publish must never affect the GitHub source-sync control path'
          if phrase in s:
              print('SAFETY_COMMENT_ALREADY_PRESENT')
          else:
              old='''    if(Test-Path -LiteralPath $publisher -PathType Leaf){\n      & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $publisher -InstallRoot $InstallRoot *> $null\n    }\n  } catch {}\n}'''
              new='''    if(Test-Path -LiteralPath $publisher -PathType Leaf){\n      & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $publisher -InstallRoot $InstallRoot *> $null\n    }\n  } catch {\n    # failure to publish must never affect the GitHub source-sync control path\n  }\n}'''
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one Publish-SiteDeployAck catch anchor, found {s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8')
              print('SAFETY_COMMENT_RESTORED')
          PY
      - name: Parse and commit
        shell: pwsh
        run: |
          $p=(Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'PowerShell parse failed'}
          $text=Get-Content -LiteralPath $p -Raw
          if(-not $text.Contains('failure to publish must never affect the GitHub source-sync control path')){throw 'Safety invariant comment missing'}
      - name: Commit comment-only repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Sync-AFZ-AgentFromGitHub.ps1
          git commit -m 'Restore website ACK fail-open safety invariant comment'
          git push origin HEAD:fix/afz-site-ack-safety-comment
