name: H3 Hermes PDF Dependency Probe Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/h3-hermes-pdf-dep-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct probe quoting and execute protocol canary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          path = Path('afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1')
          text = path.read_text(encoding='utf-8')
          old = r'''  $depCode='import importlib.util;mods=[\"pypdf\",\"reportlab\",\"pdfplumber\"];print(\";\".join(m+\"=\"+(\"1\" if importlib.util.find_spec(m) is not None else \"0\") for m in mods))' '''.rstrip()
          new = '''  $depCode='import importlib.util;mods=["pypdf","reportlab","pdfplumber"];print(";".join(m+"="+("1" if importlib.util.find_spec(m) is not None else "0") for m in mods))' '''.rstrip()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one escaped probe line, found {text.count(old)}')
          text = text.replace(old, new, 1)

          pycode = 'import importlib.util;mods=["pypdf","reportlab","pdfplumber"];print(";".join(m+"="+("1" if importlib.util.find_spec(m) is not None else "0") for m in mods))'
          cp = subprocess.run([sys.executable, '-c', pycode], text=True, capture_output=True, timeout=10)
          if cp.returncode != 0:
              raise SystemExit('Dependency protocol Python canary failed: ' + cp.stderr[:300])
          parts = cp.stdout.strip().split(';')
          if len(parts) != 3 or {p.split('=',1)[0] for p in parts} != {'pypdf','reportlab','pdfplumber'} or any(p.split('=',1)[1] not in {'0','1'} for p in parts):
              raise SystemExit('Unexpected dependency protocol output: ' + cp.stdout[:300])

          for marker in ['-TimeoutMs 420000','HERMES_PDF_DEPENDENCY_PROBE_INVALID_OUTPUT','documentTextReturned=$false','providerTouched=$false','ollamaMutationStarted=$false','networkChanged=$false','modelGenerationStarted=$false']:
              if marker not in text:
                  raise SystemExit('Missing invariant: ' + marker)
          if '\\"pypdf\\"' in text:
              raise SystemExit('Escaped probe quote remains')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Parse helper and enforce guards
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|Format-List|Out-String|Write-Error;throw 'PDF helper parse failed'}
          $c=Get-Content $p -Raw
          foreach($required in @('-TimeoutMs 420000','HERMES_PDF_DEPENDENCY_PROBE_INVALID_OUTPUT','pypdf','reportlab','pdfplumber','documentTextReturned=$false','providerTouched=$false','ollamaMutationStarted=$false','networkChanged=$false','modelGenerationStarted=$false')){if(-not $c.Contains($required)){throw "Missing invariant: $required"}}
          if($c.Contains('$deps.pypdf')){throw 'Fragile dependency property access remains'}
          'H3_HERMES_PDF_DEP_PROBE_QUOTING_FIX=PASS'

      - name: Commit helper patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add afz-openai-agent/Invoke-H3-Hermes-PdfRuntimeAudit.ps1
          git diff --cached --quiet && exit 0
          git commit -m 'Correct H3 Hermes PDF probe quoting'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
