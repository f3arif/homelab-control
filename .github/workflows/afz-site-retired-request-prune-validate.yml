name: AFZ Site Retired Request Prune Validate

on:
  push:
    branches:
      - main
      - fix/afz-site-retired-request-prune
    paths:
      - afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1
      - .github/workflows/afz-site-retired-request-prune-validate.yml
  pull_request:
    paths:
      - afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1
      - .github/workflows/afz-site-retired-request-prune-validate.yml

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and prove narrow retired-request reconciliation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path 'afz-openai-agent/Sync-AFZ-AgentFromGitHub-Core.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|Format-List|Out-String|Write-Error;throw 'PowerShell parse failed'}
          $text=Get-Content -LiteralPath $p -Raw
          foreach($needle in @('# Exact overlay retirement reconciliation.',"`$managedRetiredArtifacts=@('requests\afz-site-deploy.json')",'Remove-Item -LiteralPath $localArtifact -Force','removed=$removed','($removed.Count -gt 0)')){
            if(-not $text.Contains($needle)){throw "Missing reconciliation safety marker: $needle"}
          }
          $start=$text.IndexOf('# Exact overlay retirement reconciliation.')
          $end=$text.IndexOf('  foreach($ps1 in @(',$start)
          if($start -lt 0 -or $end -le $start){throw 'Unable to isolate prune block'}
          $section=$text.Substring($start,$end-$start)
          foreach($bad in @('-Recurse','Get-ChildItem','Stop-Process','Stop-ScheduledTask','Set-ScheduledTask','Disable-ScheduledTask','Enable-ScheduledTask','requests\*')){
            if($section.Contains($bad)){throw "Forbidden broad/mutating primitive in prune block: $bad"}
          }
          if(([regex]::Matches($section,[regex]::Escape("'requests\afz-site-deploy.json'"))).Count -ne 1){throw 'Managed prune list must contain exactly one retired site request'}
          $sb=[scriptblock]::Create($section)
          $tmp=Join-Path $env:TEMP ('afz-prune-validate-'+[guid]::NewGuid().ToString('n'))
          try{
            $src=Join-Path $tmp 'src';$dst=Join-Path $tmp 'dst'
            New-Item -ItemType Directory -Force -Path (Join-Path $src 'requests'),(Join-Path $dst 'requests')|Out-Null
            $local=Join-Path $dst 'requests\afz-site-deploy.json'
            Set-Content -LiteralPath $local -Value '{"status":"active"}' -Encoding ASCII
            $removed=@(); . $sb
            if(Test-Path -LiteralPath $local){throw 'Absent-in-source retired request was not removed'}
            if(@($removed).Count -ne 1 -or [string]$removed[0] -ne 'requests\afz-site-deploy.json'){throw 'Removed audit list incorrect'}
            Set-Content -LiteralPath (Join-Path $src 'requests\afz-site-deploy.json') -Value '{"status":"active"}' -Encoding ASCII
            Set-Content -LiteralPath $local -Value '{"status":"active"}' -Encoding ASCII
            $removed=@(); . $sb
            if(-not(Test-Path -LiteralPath $local)){throw 'Source-present request must never be pruned'}
            if(@($removed).Count -ne 0){throw 'Source-present request incorrectly recorded as removed'}
          }finally{Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'AFZ SITE RETIRED REQUEST PRUNE PASS'
