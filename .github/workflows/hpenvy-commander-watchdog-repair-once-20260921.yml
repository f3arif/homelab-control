name: HP Envy Commander Watchdog Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hpenvy-commander-watchdog-repair-once-20260921.yml'

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join AFZ tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:afz-deploy

      - name: Repair HP Commander watchdog
        shell: bash
        run: |
          set -euo pipefail
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = "hpenvy"
          test "$(id -un)" = "coolyo"
          uid=$(id -u)
          export XDG_RUNTIME_DIR=/run/user/$uid
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus
          mkdir -p "$HOME/.config/systemd/user" "$HOME/.local/state"

          cp -a "$HOME/.config/systemd/user/afz-desktop-commander-watch.service" "$HOME/.config/systemd/user/afz-desktop-commander-watch.service.before-20260921" 2>/dev/null || true
          cp -a "$HOME/.config/systemd/user/afz-desktop-commander-watch.timer" "$HOME/.config/systemd/user/afz-desktop-commander-watch.timer.before-20260921" 2>/dev/null || true

          cat > "$HOME/.config/systemd/user/afz-desktop-commander-watch.service" <<'EOF'
          [Unit]
          Description=AFZ Desktop Commander watchdog check

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -lc 'uid=$(id -u); export XDG_RUNTIME_DIR=/run/user/$uid; export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus; if systemctl --user is-active --quiet afz-desktop-commander.service; then exit 0; fi; echo "$(date -u +%%FT%%TZ) watchdog_restarting_commander" >> /home/coolyo/.local/state/afz-desktop-commander-watch.log; systemctl --user start afz-desktop-commander.service'
          EOF

          cat > "$HOME/.config/systemd/user/afz-desktop-commander-watch.timer" <<'EOF'
          [Unit]
          Description=AFZ Desktop Commander watchdog timer

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          AccuracySec=2s
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF

          systemctl --user daemon-reload
          systemctl --user enable --now afz-desktop-commander-watch.timer
          systemctl --user start afz-desktop-commander.service
          sleep 5

          echo "COMMANDER_ACTIVE=$(systemctl --user is-active afz-desktop-commander.service)"
          echo "COMMANDER_ENABLED=$(systemctl --user is-enabled afz-desktop-commander.service)"
          echo "WATCH_ACTIVE=$(systemctl --user is-active afz-desktop-commander-watch.timer)"
          echo "WATCH_ENABLED=$(systemctl --user is-enabled afz-desktop-commander-watch.timer)"
          echo "COMMANDER_PID=$(systemctl --user show afz-desktop-commander.service -p MainPID --value)"
          systemctl --user list-timers --all --no-pager | grep afz-desktop-commander-watch || true
          curl -ksS --max-time 6 --resolve ptt-api.afzeng.ca:443:192.168.50.68 -o /dev/null -w 'EDGE_API_HTTP=%{http_code}\n' https://ptt-api.afzeng.ca/health
          curl -ksS --max-time 6 --resolve ptt-livekit.afzeng.ca:443:192.168.50.68 -o /dev/null -w 'EDGE_LIVEKIT_HTTP=%{http_code}\n' https://ptt-livekit.afzeng.ca/
          REMOTE
          )
          printf '%s\n' "$remote_script" | tailscale ssh coolyo@100.71.26.69 'bash -s'
