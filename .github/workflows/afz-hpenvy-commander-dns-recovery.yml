name: HP Envy Commander DNS recovery
on:
  push:
    branches: [ops/hpenvy-commander-dns-recovery-20260921]
    paths: [.github/workflows/afz-hpenvy-commander-dns-recovery.yml]
permissions:
  contents: read
concurrency:
  group: afz-hpenvy-commander-dns-recovery
  cancel-in-progress: true
jobs:
  close-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: End remote diagnostic without further connection attempts
        run: |
          echo 'STOPPED: hosted Tailscale identity was denied; H3 existing SSH identity was denied.'
          echo 'No HP DNS, authentication, service or production configuration was changed.'
          echo 'Any older queued diagnostic in this concurrency group is superseded.'
