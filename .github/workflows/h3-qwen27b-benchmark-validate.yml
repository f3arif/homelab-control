name: Validate H3 Qwen27B Benchmark Fabric

on:
  pull_request:
    paths:
      - 'afz-openai-agent/AFZ-Agent-Control.ps1'
      - 'afz-openai-agent/Invoke-H3-Qwen27B-WebsiteBenchmark.ps1'
      - 'afz-openai-agent/Bootstrap-H3-GitHub-DirectBenchmark.ps1'
      - 'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1'
      - 'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1'
      - 'afz-openai-agent/tools/H3-GitHub-Direct-Benchmark-Watcher.ps1'
      - 'afz-openai-agent/tools/Start-H3-GitHub-Direct-Benchmark.ps1'
      - 'afz-openai-agent/tools/Enable-H3-GitHub-DirectAuth.ps1'
      - 'afz-openai-agent/tools/Run-H3-Qwen27B-WebsiteBenchmark.ps1'
      - '.github/workflows/h3-qwen27b-website-benchmark.yml'
      - '.github/workflows/h3-qwen27b-benchmark-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell with Windows PowerShell AST
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'afz-openai-agent/AFZ-Agent-Control.ps1',
            'afz-openai-agent/Invoke-H3-Qwen27B-WebsiteBenchmark.ps1',
            'afz-openai-agent/Bootstrap-H3-GitHub-DirectBenchmark.ps1',
            'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1',
            'afz-openai-agent/Update-AFZ-OpenAI-Agent.ps1',
            'afz-openai-agent/tools/H3-GitHub-Direct-Benchmark-Watcher.ps1',
            'afz-openai-agent/tools/Start-H3-GitHub-Direct-Benchmark.ps1',
            'afz-openai-agent/tools/Enable-H3-GitHub-DirectAuth.ps1',
            'afz-openai-agent/tools/Run-H3-Qwen27B-WebsiteBenchmark.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE FAIL: $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "PARSE PASS: $file" -ForegroundColor Green
            }
          }
          if ($failed) { exit 1 }

      - name: Assert direct H3 GitHub boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Get-Content 'afz-openai-agent/Bootstrap-H3-GitHub-DirectBenchmark.ps1' -Raw
          $winWatcher = Get-Content 'afz-openai-agent/H3-Qwen27B-Request-Watcher.ps1' -Raw
          $h3Watcher = Get-Content 'afz-openai-agent/tools/H3-GitHub-Direct-Benchmark-Watcher.ps1' -Raw
          $launcher = Get-Content 'afz-openai-agent/tools/Start-H3-GitHub-Direct-Benchmark.ps1' -Raw
          $authHelper = Get-Content 'afz-openai-agent/tools/Enable-H3-GitHub-DirectAuth.ps1' -Raw
          $runner = Get-Content 'afz-openai-agent/tools/Run-H3-Qwen27B-WebsiteBenchmark.ps1' -Raw
          $workflow = Get-Content '.github/workflows/h3-qwen27b-website-benchmark.yml' -Raw
          $all = $bootstrap + "`n" + $winWatcher + "`n" + $h3Watcher + "`n" + $launcher + "`n" + $authHelper + "`n" + $runner
          $benchmarkOnly = $bootstrap + "`n" + $h3Watcher + "`n" + $launcher + "`n" + $authHelper + "`n" + $runner

          foreach ($needle in @(
            'DESKTOP-H3R6CQN',
            'Faiz@100.106.186.118',
            'qwen3.8:27b',
            'Qwen38-27B-Website-Benchmark-20260826-174739',
            'h3-qwen27b-benchmark.json',
            'h3-direct-results',
            'h3-qwen27b-benchmark-status.json',
            'Path]::IsPathRooted',
            'path traversal',
            'AFZ H3 GitHub Direct Benchmark Watcher',
            'blocked-github-auth',
            'permissions.push'
          )) {
            if (-not $all.Contains($needle)) { throw "Required direct boundary missing: $needle" }
          }

          if ($winWatcher -match 'Invoke-H3-Qwen27B-WebsiteBenchmark') {
            throw 'windows-main watcher must not dispatch benchmark iterations directly.'
          }
          if ($winWatcher -notmatch 'Handle-BenchmarkRequest' -or $winWatcher -notmatch 'benchmark-bootstrap') {
            throw 'windows-main watcher must expose benchmark bootstrap handling without owning benchmark execution.'
          }
          if ($launcher -notmatch 'blocked-github-auth' -or $launcher -notmatch 'permissions.push') {
            throw 'H3 launcher must gate Qwen execution on authenticated GitHub repository write access.'
          }
          foreach ($forbidden in @('Invoke-Expression','iex ','cmd.exe /c')) {
            if ($all -match [regex]::Escape($forbidden)) { throw "Forbidden primitive found: $forbidden" }
          }
          foreach ($forbiddenTransport in @('OneDrive','SharePoint')) {
            if ($benchmarkOnly -match [regex]::Escape($forbiddenTransport)) { throw "Forbidden benchmark transport found: $forbiddenTransport" }
          }
          if ($workflow -match 'tailscale/github-action|TS_OAUTH|TS_AUDIENCE|100\.70\.25\.8:8797') {
            throw 'GitHub workflow must not directly enter the private execution plane.'
          }

      - name: Confirm bounded request contract
        shell: powershell
        run: |
          $w = Get-Content '.github/workflows/h3-qwen27b-website-benchmark.yml' -Raw
          if ($w -notmatch [regex]::Escape('afz-openai-agent/requests/h3-qwen27b-benchmark.json')) { throw 'Request path missing.' }
          if ($w -notmatch 'max_iterations') { throw 'Bounded iteration contract missing.' }
          if ($w -notmatch 'cancel-in-progress: false') { throw 'Concurrency protection missing.' }
